<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Notebook War</title>
<style>
  :root{ --paper:#f6f2e4; --ink:#3b3a36; --blue:#2f4f9e; --red:#b7332f; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:#cfc7b4;
    font-family:"HanziPen SC","Hanzipen SC","Chalkboard SE","Comic Sans MS","Bradley Hand","PingFang SC",cursive,sans-serif;
    color:var(--ink);overflow:hidden;display:flex;flex-direction:column;user-select:none;
  }
  #rot{display:flex;flex-direction:column;flex:1 1 auto;width:100%;min-height:0}
  body.ls #rot{position:fixed;top:0;left:0;transform-origin:0 0}
  #lsb{display:none}
  button.nat{min-width:62px}
  button.nat.pen{color:var(--paper);font-weight:bold}      /* 你正在画的一方 */
  button.nat.foe{background:transparent;font-weight:bold}  /* 对手 */
  button.nat.out{opacity:.42}                              /* 本局没上场 */
  a.era{
    font-size:11px;color:var(--ink);opacity:.45;text-decoration:none;
    border-bottom:1px dotted currentColor;margin-left:10px;white-space:nowrap;
  }
  a.era:hover{opacity:.85}
  header{
    flex:0 0 auto;display:flex;align-items:center;gap:12px;
    padding:4px 12px;background:var(--paper);border-bottom:2px dashed #c9bfa6;
  }
  h1{font-size:18px;margin:0;letter-spacing:2px;font-weight:normal;white-space:nowrap}
  h1 .s{font-size:11px;opacity:.5;letter-spacing:0}
  .score{margin-left:auto;display:flex;gap:10px;font-size:13px;align-items:center;white-space:nowrap}
  .score b{font-size:17px}
  .sb{color:var(--blue)} .sr{color:var(--red)} .vs{opacity:.45;font-size:12px}
  #bar{width:90px;height:9px;border:1.5px solid #a9a08a;border-radius:4px;overflow:hidden;display:flex}
  #bar i{display:block;height:100%}
  #bar .b{background:var(--blue)} #bar .r{background:var(--red)}
  #wrap{flex:1 1 auto;position:relative;min-height:0}
  canvas{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}
  body.aiming canvas{cursor:cell}
  #hud{
    flex:0 0 auto;background:var(--paper);border-top:2px dashed #c9bfa6;
    padding:4px 8px 6px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;
  }
  .grp{display:flex;gap:4px;align-items:center;padding:1px 7px;border-right:1px dotted #b9ad91}
  .grp:last-child{border:none}
  .col{flex-direction:column;align-items:flex-start;gap:3px}
  .row{display:flex;gap:4px;align-items:center}
  .lbl{font-size:11px;opacity:.5;width:14px;flex:0 0 auto}
  button{
    font-family:inherit;font-size:13px;color:var(--ink);background:transparent;
    border:1.5px solid #a9a08a;border-radius:12px 9px 13px 8px;
    padding:3px 9px;cursor:pointer;transition:.1s;line-height:1.25;position:relative;overflow:hidden;
  }
  button:hover{background:#ece5d0}
  button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  button small{display:block;font-size:9px;opacity:.62;letter-spacing:-.2px}
  .row button{min-width:52px;padding:2px 6px;font-size:12px;white-space:nowrap}
  .row button.on{border-width:2.5px;background:var(--ink);color:var(--paper)}
  /* Order buttons: a cooldown mask rising from the bottom */
  .cmd{border-style:solid;border-color:#8d8272}
  .cmd .cool{
    position:absolute;left:0;right:0;bottom:0;background:rgba(59,58,54,.24);
    pointer-events:none;height:0;
  }
  .cmd.ready{border-color:var(--ink);font-weight:bold}
  .cmd.armed{background:var(--ink);color:var(--paper)}
  .cmd.cooling{opacity:.55;cursor:not-allowed}
  #banner{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none}
  #banner span{font-size:min(13vw,110px);transform:rotate(-6deg);text-shadow:2px 3px 0 rgba(0,0,0,.08);letter-spacing:6px}
  #log{
    position:absolute;right:8px;bottom:6px;pointer-events:none;
    font-size:11px;line-height:1.5;text-align:right;opacity:.62;max-width:44%;
  }
  #log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #hint{
    position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
    font-size:12px;opacity:.42;pointer-events:none;white-space:nowrap;
  }
  @media (max-width:900px){
    h1{font-size:15px} h1 .s{display:none}
    #hud{padding:3px 4px 5px;gap:4px} .grp{padding:1px 4px}
    button{font-size:11px;padding:2px 6px}
    .row button{min-width:auto;font-size:11px;padding:2px 5px}
    .row button small{display:none}
    .score{font-size:12px;gap:6px} #bar{width:58px}
    #hint{font-size:11px;white-space:normal;max-width:80%;text-align:center}
    #lsb{display:inline-block}
    #log{font-size:10px;max-width:38%}
  }
  @media (max-width:520px){
    header{padding:3px 7px} h1{font-size:13px;letter-spacing:1px}
    .score{font-size:11px;gap:4px} .score b{font-size:14px} #bar{width:40px;height:7px}
    #hud{padding:2px 3px 4px;gap:3px}
    .grp{padding:1px 3px;gap:3px} .grp.col{gap:2px} .row{gap:3px}
    .lbl{display:none}
    button{font-size:10px;padding:2px 4px;border-radius:9px 7px 10px 6px}
    .row button{font-size:10px;padding:1px 4px}
    #hint{font-size:10px;bottom:4px} #log{font-size:9px}
  }
</style>
</head>
<body>
<div id="rot">

<header>
  <h1>Notebook War <span class="s">/ 1944</span><a class="era" href="cold-war.html">Cold War →</a></h1>
  <div class="score">
    <span class="sb" id="l0">GER <b id="nb">0</b></span>
    <div id="bar"><i class="b" id="pb"></i><i class="r" id="pr"></i></div>
    <span class="sr" id="l1"><b id="nr">0</b> CCCP</span>
    <span class="vs" id="tide"></span>
    <span class="vs"><span id="lossLbl">losses</span> <span class="sr" id="lb">0</span>:<span class="sb" id="lr">0</span></span>
  </div>
</header>

<div id="wrap">
  <canvas id="c"></canvas>
  <div id="banner"><span id="bantext"></span></div>
  <div id="log"></div>
  <div id="hint">Drag to draw units　·　Click an order, then click the field　·　Space to pause</div>
</div>

<div id="hud">
  <div class="grp">
    <span class="lbl" id="facLbl">Side</span>
    <button class="nat" data-n="0">GER</button>
    <button class="nat" data-n="1">USA</button>
    <button class="nat" data-n="2">SOV</button>
  </div>
  <div class="grp col" id="tools">
    <div class="row" id="rowG"><span class="lbl">G</span></div>
    <div class="row" id="rowA"><span class="lbl">A</span></div>
    <div class="row" id="rowS"><span class="lbl">S</span></div>
  </div>
  <div class="grp col">
    <div class="row" id="rowC"><span class="lbl">!</span></div>
    <div class="row">
      <button id="play" class="on">Pause</button><button id="spd">1×</button>
      <button id="auto" class="on">Auto-balance</button><button id="snd" class="on">Sound</button>
      <button id="grid" class="on">Grid</button><button id="lsb">Rotate</button>
      <button id="clr">Restart</button><button id="langBtn" title="Language / 语言">中</button>
    </div>
  </div>
</div>

</div>
<script>
"use strict";
/* ══════════════════════════ SKETCH BRUSHES ══════════════════════════ */
let _s = 1;
const seed = n => { _s = (n | 0) || 1; };
const sr = () => { _s = (_s * 1103515245 + 12345) & 0x7fffffff; return _s / 0x7fffffff; };
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);

/* ══════════════════════════ LANGUAGE ══════════════════════════
   Bilingual throughout: any user-facing string is written as [en, zh]
   and read through L(). Falls back to English if a translation is missing. */
let lang = 'en';
try {
  const q = new URLSearchParams(location.search).get('lang');       // ?lang=en|zh wins, for sharing a link
  lang = q === 'en' || q === 'zh' ? q
       : localStorage.getItem('mg_lang') || ((navigator.language || '').indexOf('zh') === 0 ? 'zh' : 'en');
} catch (e) { }
const L = a => Array.isArray(a) ? (a[lang === 'zh' ? 1 : 0] || a[0]) : a;
const UI = {
  losses:   ['losses', '战损'],
  pause:    ['Pause', '暂停'],      fight:    ['Fight', '开战'],
  auto:     ['Auto-balance', '自动平衡'], sound: ['Sound', '音效'],
  grid:     ['Grid', '网格'],       rotate:   ['Rotate', '横屏'],
  portrait: ['Portrait', '竖屏'],   restart:  ['Restart', '重来'],
  ground:   ['G', '陆'],            air:      ['A', '空'],  spect:  ['S', '奇'],  orders: ['!', '令'],
  hint:     ['Drag to draw units　·　Click an order, then click the field　·　Space to pause',
             '按住拖动＝画部队　·　点指令再点战场　·　空格暂停'],
  pushing:  ['pushing', '攻势'],
  wins:     ['WINS', '胜 利'],      mutual:  ['MUTUAL RUIN', '同 归 于 尽'],
  hp:       ['HP', '血'],           kills:   ['kills', '战功'],
  ammo:     ['ammo', '弹'],         reloading:['reloading', '装填中'],
  heals:    ['heals allies', '治疗友军'],
  resup:    ['unsuppress · faster reload', '解压制·快装填'],
  supporting:[' (supporting)', '（正在支援）'],
  suppressed:['suppressed', '压制'], prone: ['prone', '卧倒'],
  inBunker: ['in bunker', '驻守碉堡'], inTrench: ['in trench', '壕沟内'],
  withdraw: ['withdrawing', '撤退整补'], rtb: ['RTB', '返航中'],
  fuel:     ['fuel', '油料'],       trackDmg:['track damaged', '履带受损'],
  turretJam:['turret jammed', '炮塔卡滞'], rallied:['rallied', '受鼓舞'],
  speed:    ['speed', '速'],        range:  ['range', '射程'],
  reload:   ['reload', '装填'],     dmg:    ['dmg', '伤'],
  splash:   ['splash', '溅射'],     vs:     ['vs', '对'],
  vsG:      ['ground', '地'],       vsA:    ['air', '空'], vsGA: ['ground+air', '地空'],
  support:  ['support', '支援'],
  cooldown: ['cooldown', '冷却'],
  aimHint:  ['Click the button, then click the field to aim', '点按钮后再点战场选位置'],
  /* log templates */
  lgDestroy:[' destroyed ', ' 击毁 '],
  lgPromote:[' promoted to ', ' 晋升'],
  lgRegroup:[' pulls back to regroup', ' 撤下整补'],
  lgFuel:   [' RTB — out of fuel', ' 油尽返航'],
  lgAmmo:   [' RTB — out of ammo', ' 弹尽返航'],
  lgInit:   [' seizes the initiative', ' 转入攻势'],
  lgStrike: [' calls in an air strike', ' 呼叫空袭'],
  lgBarrage:[' requests a barrage', ' 请求炮火覆盖'],
  lgReinf:  [' reinforcements arrive', ' 紧急增援抵达'],
  lgRally:  [' rallies ', ' 全线鼓舞 '],  lgUnits: [' units', ' 部队'],
  lgSmoke:  [' lays smoke', ' 施放烟幕'],
  lgDrop:   [' airborne drop', ' 空降突击队'],
};
const T = k => L(UI[k]);

const cv = document.getElementById('c');
const mainCtx = cv.getContext('2d');
let ctx = mainCtx;
let W = 0, H = 0, DPR = 1;

function rline(x1, y1, x2, y2, amp) {
  amp = amp === undefined ? 1.6 : amp;
  for (let k = 0; k < 2; k++) {
    const o = () => (sr() - .5) * amp;
    ctx.beginPath();
    ctx.moveTo(x1 + o(), y1 + o());
    ctx.quadraticCurveTo((x1 + x2) / 2 + o() * 1.8, (y1 + y2) / 2 + o() * 1.8, x2 + o(), y2 + o());
    ctx.stroke();
  }
}
function rpoly(pts, close, amp) {
  amp = amp === undefined ? 1.6 : amp;
  for (let k = 0; k < 2; k++) {
    const o = () => (sr() - .5) * amp;
    ctx.beginPath();
    ctx.moveTo(pts[0][0] + o(), pts[0][1] + o());
    for (let i = 1; i < pts.length; i++) {
      const p = pts[i], q = pts[i - 1];
      ctx.quadraticCurveTo((p[0] + q[0]) / 2 + o() * 1.6, (p[1] + q[1]) / 2 + o() * 1.6, p[0] + o(), p[1] + o());
    }
    if (close) ctx.closePath();
    ctx.stroke();
  }
}
function rcirc(cx, cy, r, amp) {
  const pts = [], n = 9;
  for (let i = 0; i <= n; i++) { const a = i / n * 6.2832; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  rpoly(pts, true, amp === undefined ? 1.3 : amp);
}
/* Five-pointed star: connect every second point and the outline falls out. Hollow for the US, filled in for the USSR */
function star(cx, cy, r, solid) {
  const pts = [];
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + i * 4 * Math.PI / 5;
    pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
  }
  rpoly(pts, true, .7);
  if (solid) { const lw = ctx.lineWidth; ctx.lineWidth = lw * .7; rline(cx - r * .5, cy, cx + r * .5, cy, .6); ctx.lineWidth = lw; }
}
/* The Soviet "paint fill": a few diagonal strokes inside the shape */
function sh(x, y, w, h, n) {
  n = n || 3;
  const lw = ctx.lineWidth; ctx.lineWidth = Math.max(.7, lw * .6);
  for (let i = 0; i < n; i++) { const t = x + w * (i + .5) / n; rline(t, y, t - h * .55, y + h, .9); }
  ctx.lineWidth = lw;
}

/* ══════════════════════════ FAKE 3D PROJECTION ══════════════════════════
   World: wx across [0,WORLD_W] · wz depth [0 near, 1 far] · alt height above ground
   Cheated perspective: screen y fills the whole ground, x contracts by true perspective,
                        but unit scale only decays gently → the far rank stays readable  */
const WORLD_W = 1400, DEPTH = 700, PERSP = 1.15, ALTK = 1.7;
const P_MIN = 1 / (1 + PERSP);
let FAR_Y = 0, BOT = 0, HZ = 0, XK = 1;
let SIZEK = 1.3;

const persp = wz => 1 / (1 + wz * PERSP);
const pnorm = p => (p - P_MIN) / (1 - P_MIN);
/* Compressed perspective scaling: true perspective squashes the far rank to 0.47
   (unreadable); no scaling at all and depth disappears. Split it: far ≈ 0.62 of near */
const scaleAt = p => (.28 + .72 * p) * SIZEK;
function proj(wx, wz, alt) {
  const p = persp(wz);
  return [W / 2 + (wx - WORLD_W / 2) * p * XK,
          FAR_Y + (BOT - FAR_Y) * pnorm(p) - (alt || 0) * p * XK * ALTK, p];
}
const gyAt = wz => FAR_Y + (BOT - FAR_Y) * pnorm(persp(wz));
function unproj(sx, sy) {
  const n = clamp((sy - FAR_Y) / (BOT - FAR_Y), 0, 1);
  const p = P_MIN + n * (1 - P_MIN);
  return [(sx - W / 2) / (p * XK) + WORLD_W / 2, (1 / p - 1) / PERSP];
}
function layout() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth || 1; H = cv.clientHeight || 1;
  cv.width = W * DPR; cv.height = H * DPR;
  mainCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
  HZ = H * .19; FAR_Y = HZ + 14; BOT = H * .97;
  XK = W / WORLD_W * 1.12;
  const m = Math.min(W, H * 2.4);
  SIZEK = m < 520 ? .92 : (m < 760 ? 1.18 : (m < 1100 ? 1.44 : 1.66));
  paper = null; scars = null;
}
function applyRot() {
  const r = document.getElementById('rot'), on = document.body.classList.contains('ls');
  if (on) {
    r.style.width = window.innerHeight + 'px';
    r.style.height = window.innerWidth + 'px';
    r.style.transform = 'translate(' + window.innerWidth + 'px,0) rotate(90deg)';
  } else { r.style.width = r.style.height = r.style.transform = ''; }
  layout();
}
window.addEventListener('resize', applyRot);
window.addEventListener('orientationchange', () => setTimeout(applyRot, 120));

/* ══════════════════════════ WEAPONS ══════════════════════════
   Weapons are their own thing. A unit carries 1-2, each with its own range/reload/ammo.
   On firing it picks the one with the best expected damage per second against this target.
   vs[armour, soft] · acc base accuracy · supp suppression (fire pins men without hitting)
   Splash weapons skip the hit roll; ammo is only tracked for airborne weapons          */
const WPN = {
  rifle:    { name:['Rifle','步枪'],          m:[['Kar98k','Kar98k'],['M1 Garand','M1 加兰德'],['Mosin-Nagant','莫辛纳甘']],                          proj:'bullet', dmg:5,  rng:105, rof:.50, hits:'ga', vs:[.45,1],   acc:.68, supp:.07 },
  grenade:  { name:['Grenade','手榴弹'],      m:[['Stielhandgranate','长柄手榴弹'],['Mk.2 Grenade','Mk.2 手雷'],['RGD-33','RGD-33']],                proj:'bomb',   dmg:16, rng:58,  rof:4.5, hits:'g',  vs:[.6,1.4], vsH:0.35,  splash:26, supp:.3 },
  hmg:      { name:['Machine Gun','重机枪'],  m:[['MG42','MG42'],['M1919 Browning','M1919 勃朗宁'],['DP-27','DP-27 转盘']],                          proj:'bullet', dmg:4,  rng:135, rof:.55, hits:'ga', vs:[.3,1.25], acc:.52, supp:.2,  burst:3 },
  srifle:   { name:['Sniper Rifle','狙击枪'], m:[['Kar98k ZF39','Kar98k ZF39'],['M1903A4 Springfield','M1903A4 春田'],['Mosin PU','莫辛 PU']],       proj:'bullet', dmg:30, rng:265, rof:2.2, hits:'g',  vs:[0.12,2.4],   acc:.93, supp:.05 },
  atTube:   { name:['AT Launcher','反坦克筒'],m:[['Panzerschreck','Panzerschreck'],['M9 Bazooka','M9 巴祖卡'],['PTRD-41','PTRD-41']],                proj:'rocket', dmg:52, rng:150, rof:3.0, hits:'g',  vs:[2.2,.5], vsH:3.2,  acc:.82, supp:.12, minRng:30 },
  tankGun:  { name:['Tank Gun','坦克炮'],     m:[['8.8cm KwK 36','8.8cm KwK 36'],['75mm M3','75mm M3'],['76mm F-34','76mm F-34']],                   proj:'shell',  dmg:30, rng:185, rof:1.3, hits:'g',  vs:[1.2,1], vsH:2.2,   acc:.80, supp:.28 },
  coax:     { name:['Coaxial MG','同轴机枪'], m:[['MG34','MG34'],['M1919A4','M1919A4'],['DT-29','DT-29']],                                           proj:'bullet', dmg:4,  rng:112, rof:.45, hits:'ga', vs:[.25,1.3], acc:.60, supp:.18, burst:3 },
  htMg:     { name:['Vehicle MG','车载机枪'], m:[['MG34 mount','MG34 车载'],['M2 .50 cal','M2 .50'],['DShK 12.7','DShK 12.7']],                      proj:'bullet', dmg:7,  rng:150, rof:.40, hits:'ga', vs:[.4,1.3],  acc:.58, supp:.24, burst:2 },
  flakLt:   { name:['Light Flak','轻高炮'],   m:[['2cm Flakvierling 38','2cm 四联高炮'],['M45 Quad .50','M45 四联 .50'],['61-K 37mm','61-K 37mm']],  proj:'flak',   dmg:16, rng:200, rof:.42, hits:'a',  vs:[1,1],     acc:.50, supp:.06, burst:3 },
  flak88:   { name:['Heavy Flak','重高炮'],   m:[['8.8cm Flak 36','8.8cm Flak 36'],['90mm M1','90mm M1'],['52-K 85mm','52-K 85mm']],                 proj:'shell',  dmg:60, rng:360, rof:2.8, hits:'ga', vs:[1.8,0.85], vsH:2.4, acc:.84, supp:.3 },
  howitzer: { name:['Howitzer','榴弹炮'],     m:[['15cm sFH 18','15cm sFH 18'],['105mm M101','105mm M101'],['122mm M-30','122mm M-30']],             proj:'bomb',   dmg:40, rng:400, rof:3.0, hits:'g',  vs:[1,1.2], vsH:1.4,   splash:56, supp:.55 },
  mlrsSalvo:{ name:['Rocket Salvo','火箭齐射'],m:[['15cm Nebelwerfer 41','15cm 烟雾发射器'],['4.5in T34','4.5 吋 T34'],['132mm M-13','132mm M-13']], proj:'rocket', dmg:24, rng:430, rof:6.0, hits:'g',  vs:[.8,1.4], vsH:0.7,  splash:44, supp:.45, burst:6 },
  /* Airborne: no guided weapons in WW2 — just guns and iron bombs */
  fighterGun:{name:['Wing Guns','机翼武器'],  m:[['MG151/20','MG151/20'],['6× M2 .50 cal','6×M2 .50'],['ShVAK 20mm','ShVAK 20mm']],                  proj:'bullet', dmg:16, rng:140, rof:.50, hits:'ga', vs:[.7,1], vsH:0.18,    acc:.66, supp:.28, ammo:36, burst:2 },

const K = WORLD_W / 800;
const ROF_K = 1.9;          // Global reload multiplier: individual shots were too fast to follow
/* What makes a battle watchable is not a slow rate of fire — that just makes a dull picture.
   It is units that survive the first exchange, so both sides stay tangled together. */
const TOUGH = 2.8;
for (const n in WPN) {
  const w = WPN[n];
  w.id = n; w.rng *= K;
  if (w.splash) w.splash *= K;
  w.minRng = (w.minRng || 0) * K;      // Missiles have a minimum range → knife fights fall back on guns
  if (w.acc === undefined) w.acc = 1;
  if (w.supp === undefined) w.supp = .1;
  w.supp *= 2.4;            // With only 17 a side the firefight is sparse; push suppression back up
  w.rof *= ROF_K;
}
for (const k in UNITS) {
  const d = UNITS[k];
  d.key = k; d.spd *= K;
  d.hp = Math.round(d.hp * TOUGH);
  if (d.hold) d.hold *= K;
  d.ws = d.w.map(n => WPN[n]);
  const rs = d.ws.map(w => w.rng);
  d.rngMax = rs.length ? Math.max.apply(null, rs) : 0;
  d.rngMin = rs.length ? Math.min.apply(null, rs) : 0;
  d.hitAny = (d.ws.some(w => w.hits.indexOf('g') >= 0) ? 'g' : '') +
             (d.ws.some(w => w.hits.indexOf('a') >= 0) ? 'a' : '');
  d.dps = d.ws.reduce((s, w) => s + w.dmg * (w.burst || 1) / w.rof, 0);
  d.hasAmmo = d.ws.some(w => w.ammo !== undefined);
  /* Derived personality, rather than a hand-written column per unit:
     · suppression resistance: men behind armour keep their heads better
     · withdraw threshold: support trucks bail first, armour last, aircraft never (they RTB)
     · assault: short-ranged units have to close in; long-ranged ones stay back */
  d.morale = d.armor ? 1.6 : 1;
  d.grit = d.layer === 'a' ? 0 : (d.support ? .5 : (d.armor ? .2 : .3));
  d.aggr = !!d.aggr;                      // Explicit: only units whose main weapon is short-ranged push in
  if (d.layer === 'a' && !d.wing) d.wing = 'fixed';   // Only rotors may hover
}

let paper = null, scars = null, scarFade = 0;
function drawPaper() {
  if (!paper || paper.width !== cv.width || paper.grid !== showGrid) {
    paper = document.createElement('canvas');
    paper.width = cv.width; paper.height = cv.height; paper.grid = showGrid;
    const p = paper.getContext('2d');
    p.setTransform(DPR, 0, 0, DPR, 0, 0);
    p.fillStyle = '#f6f2e4'; p.fillRect(0, 0, W, H);
    p.strokeStyle = '#bfd5e9'; p.lineWidth = 1;
    for (let y = 28; y < H; y += 28) {
      p.beginPath();
      for (let x = 0; x <= W; x += 22) p.lineTo(x, y + Math.sin(x * .012 + y) * .7);
      p.stroke();
    }
    p.globalAlpha = .4;
    for (let x = 28; x < W; x += 28) { p.beginPath(); p.moveTo(x, 0); p.lineTo(x, H); p.stroke(); }
    p.globalAlpha = 1;
    p.strokeStyle = '#e0a3a3'; p.lineWidth = 1.4;
    p.beginPath(); p.moveTo(46, 0); p.lineTo(46, H); p.stroke();
    p.fillStyle = 'rgba(120,105,80,.05)';
    for (let i = 0; i < 900; i++) p.fillRect(Math.random() * W, Math.random() * H, 1.4, 1.4);

    ctx = p; seed(11); ctx.lineCap = 'round';
    ctx.strokeStyle = '#c6bda6'; ctx.lineWidth = 1.4;
    let mx = -60;
    while (mx < W + 40) {
      const wd = clamp(rnd(220, 400) * (W / 1100), 70, 420), hg = rnd(34, 78) * clamp(W / 1100, .6, 1);
      rpoly([[mx, HZ], [mx + wd * .3, HZ - hg * .55], [mx + wd * .46, HZ - hg],
             [mx + wd * .68, HZ - hg * .5], [mx + wd, HZ]], false, 2.4);
      mx += wd * .82;
    }
    ctx.strokeStyle = '#8a8271'; ctx.lineWidth = 1.6;
    rline(0, HZ, W, HZ, 1.8);
    if (showGrid) {
      ctx.strokeStyle = 'rgba(115,138,170,.4)'; ctx.lineWidth = 1;
      for (let wx = 0; wx <= WORLD_W; wx += 100) {
        const a = proj(wx, 0, 0), b = proj(wx, 1, 0);
        rline(a[0], a[1], b[0], b[1], 1.3);
      }
      for (let i = 0; i <= 10; i++) {
        const a = proj(0, i / 10, 0), b = proj(WORLD_W, i / 10, 0);
        rline(a[0], a[1], b[0], b[1], 1.3);
      }
    }
    ctx.strokeStyle = '#8d8a6d'; ctx.lineWidth = 1.1;
    for (let i = 0; i < 150; i++) {
      const q = proj(sr() * WORLD_W, sr(), 0), sc = scaleAt(q[2]);
      rline(q[0], q[1], q[0] + (sr() - .5) * 6 * sc, q[1] - (4 + sr() * 7) * sc, 1);
    }
    ctx = mainCtx;
  }
  mainCtx.drawImage(paper, 0, 0, W, H);
  if (!scars) {                                  // Scar layer: craters are painted on once and stay on the paper
    scars = document.createElement('canvas');
    scars.width = cv.width; scars.height = cv.height;
    scars.getContext('2d').setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  mainCtx.drawImage(scars, 0, 0, W, H);
}
/* Punch a crater into the scar layer */
function scarCrater(wx, wz, r) {
  if (!scars) return;
  const q = proj(wx, wz, 0), sc = scaleAt(q[2]);
  const rr = clamp(r * sc * .3, 3, 34);
  const c = scars.getContext('2d');
  const save = ctx; ctx = c;
  seed((wx * 31 + wz * 977) | 0);
  ctx.lineCap = 'round';
  ctx.globalAlpha = .3; ctx.strokeStyle = '#7a7261'; ctx.lineWidth = 1.3;
  const pts = [];
  for (let i = 0; i < 11; i++) {
    const a = i / 11 * 6.2832, k = rr * (.72 + sr() * .5);
    pts.push([q[0] + Math.cos(a) * k, q[1] + Math.sin(a) * k * .42]);
  }
  rpoly(pts, true, 2.2);
  ctx.globalAlpha = .16; ctx.lineWidth = 1;       // Scribble across the crater floor
  for (let i = 0; i < 5; i++) {
    const y = q[1] - rr * .16 + i * rr * .08;
    rline(q[0] - rr * .66, y, q[0] + rr * .66, y + rnd(-1, 1), 1.4);
  }
  ctx.globalAlpha = 1;
  ctx = save;
}

/* ══════════════════════════ SPAWNING ══════════════════════════ */
function spawn(side, key, wx, wz) {
  const d = UNITS[key];
  const u = {
    id: uid++, side, d,
    wx: clamp(wx, -30, WORLD_W + 30), wz: clamp(wz, .02, .98),
    alt: d.layer === 'a' ? d.alt : 0,
    hp: d.hp, max: d.hp, tgt: null, anc: null, retgt: 0,
    ws: d.ws.map(w => ({ d: w, cd: rnd(0, w.rof), ammo: w.ammo === undefined ? Infinity : w.ammo })),
    fuel: d.fuel || 0, rtb: 0, fk: '',
    face: side === 0 ? 1 : -1,
    sd: (Math.random() * 1e6) | 0, ph: Math.random() * 10,
    st: rnd(.72, 1.04), flash: 0, done: 0, silent: 0, noloss: 0,
    sup: 0, prone: 0, vet: 0, rank: 0, kills: 0,
    mode: 0, aimEl: 0, boost: 0, cover: null, link: null, smokeT: 0,
    turnT: 0, orb: Math.random() * 6.3, leg: 0, egress: 0, bunker: null, dropping: 0,
  };
  if (key === 'para') { u.alt = 300; u.dropping = 1; u.rank = 1; }   // Airborne troops start as veterans
  units.push(u);
  return u;
}
function weightedKey() {
  let tot = 0; for (const k of ALL) tot += UNITS[k].weight;
  let r = Math.random() * tot;
  for (const k of ALL) { if (!UNITS[k].weight) continue; r -= UNITS[k].weight; if (r <= 0) return k; }
  return 'inf';
}
function power(side) {
  let p = 0;
  for (const u of units) if (u.side === side) p += u.hp + u.d.dps * 2.2 + (u.d.support ? 70 : 0);
  return p;
}
function counterKey(side) {
  const foe = 1 - side;
  let air = 0, armor = 0, soft = 0, myAir = 0, myAD = 0, mySup = 0, myTot = 0;
  for (const u of units) {
    if (u.side === foe) { u.d.layer === 'a' ? air++ : (u.d.armor ? armor++ : soft++); }
    else {
      myTot++;
      if (u.d.layer === 'a') myAir++;
      if (u.d.hitAny.indexOf('a') >= 0) myAD++;
      if (u.d.support) mySup++;
    }
  }
  const tot = air + armor + soft || 1, mt = myTot || 1, r = Math.random();
  if (mySup / mt < .1 && r < .3) return pick(['supply','medic']);
  if (myAir / mt < .18 && r < .5) return pick(['fig','atk','bmb']);
  if (air > 0 && myAD / mt < .12 && r < .55) return pick(['aa','sam','fig']);
  if (air / tot > .26 && r < .6) return pick(['aa','sam','fig','aa']);
  if (armor / tot > .34 && r < .6) return pick(['atgm','tank','sam','atgm']);
  if (soft / tot > .48 && r < .5) return pick(['mg','sniper','mlrs','arty','atk']);
  return weightedKey();
}
function reinforce(side, key) {
  if (reserve[side] <= 0) return false;              // 预备队见底
  reserve[side]--;
  spawn(side, key || counterKey(side),
        side === 0 ? rnd(-20, 90) : rnd(WORLD_W - 90, WORLD_W + 20), rnd(.05, .95));
  return true;
}
function initArmies() {
  const plan = ['inf','inf','inf','mg','sniper','tank','ifv','atgm','aa','sam',
                'arty','supply','medic','fig','atk','bmb'];     // Don't crowd the opening deployment
  plan.forEach(k => {
    spawn(0, k, rnd(20, WORLD_W * .26), rnd(.05, .95));
    spawn(1, k, rnd(WORLD_W * .74, WORLD_W - 20), rnd(.05, .95));
  });
  /* Map works: trenches spread across the field plus a few bunkers you can garrison. Infantry only */
  works.length = 0;
  for (let i = 0; i < 7; i++)
    works.push({ kind: 'trench', wx: 180 + i * (WORLD_W - 360) / 6 + rnd(-45, 45),
                 wz: rnd(.12, .88), r: 30 * K, half: 105, sd: (Math.random() * 1e6) | 0 });
  for (let i = 0; i < 4; i++)
    works.push({ kind: 'bunker', wx: rnd(260, WORLD_W - 260), wz: rnd(.14, .86),
                 r: 34 * K, cap: 2, users: [], sd: (Math.random() * 1e6) | 0 });
}

   因为最后一批往往是被同一发奇观一次清掉的）。三道保险：
   压缩器兜住峰值、150ms 内最多放 4 个爆炸、单发音量也压低一档。 */
function audioCtx() {
  if (!AC) {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const comp = AC.createDynamicsCompressor();
    comp.threshold.value = -20; comp.knee.value = 14; comp.ratio.value = 14;
    comp.attack.value = .003; comp.release.value = .15;

    master.connect(comp); comp.connect(AC.destination);

function beep(type) {
  if (!sound) return;

    const ac = audioCtx(), t = ac.currentTime;
    recent = recent.filter(x => t - x < .15);
    if (recent.length >= 4) return;              // 这一瞬间已经够吵了，再叠只会破音
    recent.push(t);

      const n = 5000, b = ac.createBuffer(1, n, 44100), ch = b.getChannelData(0);
      for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
      const s = ac.createBufferSource(); s.buffer = b;
      const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 620;
      s.connect(f); f.connect(g); g.gain.value = .12; s.start(t);
    } else if (type === 'ric') {
      const o = ac.createOscillator();
      o.type = 'triangle';
      o.frequency.setValueAtTime(1800, t);
      o.frequency.exponentialRampToValueAtTime(600, t + .16);
      g.gain.setValueAtTime(.035, t); g.gain.exponentialRampToValueAtTime(.001, t + .18);
      o.connect(g); o.start(t); o.stop(t + .19);
    } else {
      const o = ac.createOscillator();
      o.type = type === 'shot' ? 'square' : 'sawtooth';
      o.frequency.setValueAtTime(type === 'shot' ? 900 : 380, t);
      o.frequency.exponentialRampToValueAtTime(150, t + (type === 'shot' ? .06 : .18));
      g.gain.setValueAtTime(.028, t); g.gain.exponentialRampToValueAtTime(.001, t + .2);
      o.connect(g); o.start(t); o.stop(t + .21);

}

/* ══════════════════════════ 战斗：查询 ══════════════════════════ */
const canHit = (a, b) => a.d.hitAny.indexOf(b.d.layer) >= 0;
/* 装甲有两级：armor 1 = 飞机和轻装甲车辆，armor 2 = 坦克这类重甲。
   同一个 vs[0] 本来要同时管"打飞机"和"打坦克"——所以战斗机机枪不得不给到
   0.7 才打得动空战，代价是它顺手也能凿穿坦克。vsH 把重甲单拎出来，缺省
   回落到 vs[0]，没标 vsH 的武器一个数都没变 */
const armMul = (p, v) => (v.d.armor > 1 && p.vsH !== undefined) ? p.vsH : p.vs[0];
const dmgTo = (p, v) => p.dmg * (v.d.armor ? armMul(p, v) : p.vs[1]);
const dist3 = (a, b) => Math.hypot(b.wx - a.wx, (b.wz - a.wz) * DEPTH, (b.alt || 0) - (a.alt || 0));
const distG = (a, b) => Math.hypot(b.wx - a.wx, (b.wz - a.wz) * DEPTH);
/* 老兵修正：精度、装填、抗打击 */
const RANK_ACC = [1, 1.12, 1.25], RANK_ROF = [1, .92, .84], RANK_TGH = [1, .94, .88];

function findTarget(u) {
  let best = null, bd = 1e18;
  for (const v of units) {
    if (v.side === u.side || v.hp <= 0 || !canHit(u, v)) continue;
    const d = dist3(u, v);
    if (d < bd) { bd = d; best = v; }
  }
  return best;
}
function findAnchor(u) {
  let best = null, bd = 1e18;
  for (const v of units) {
    if (v.side === u.side || v.hp <= 0 || v.d.layer !== 'g') continue;
    const d = Math.abs(v.wx - u.wx) + Math.abs(v.wz - u.wz) * DEPTH * .5;
    if (d < bd) { bd = d; best = v; }
  }
  return best;
}
/* 烟雾遮蔽：目标裹在烟里就难打 */
function smokeCover(t) {
  for (const s of smokes) {
    if (t.alt > 60) continue;
    if (Math.hypot(t.wx - s.wx, (t.wz - s.wz) * DEPTH) < s.r) return .38;
  }

}
function pickWeapon(u, t, dist) {
  let best = null, bestEff = 0;
  for (const w of u.ws) {
    const W = w.d;
    if (w.cd > 0 || w.ammo <= 0) continue;
    if (W.hits.indexOf(t.d.layer) < 0) continue;
    /* 航弹是垂直丢下去的：射程只算水平投放距离。原来把飞行高度也算进
       三维距离，175 的巡航高度直接吃掉了 154 的射程，轰炸机永远投不了弹 */
    const dw = W.proj === 'drop' ? distG(u, t) : dist;
    if (dw > W.rng || dw < W.minRng) continue;
    let eff = W.dmg * (t.d.armor ? armMul(W, t) : W.vs[1]) * (W.burst || 1) / W.rof;
    if (!t.d.armor && W.vs[0] / W.vs[1] > 2) eff *= .45;   // 反装甲弹别去点步兵
    if (W.splash) {                                        // 溅射弹按目标周围人堆加权
      let cluster = 0;
      for (const v of units) {
        if (v.side === u.side || v.hp <= 0) continue;
        if (distG(v, t) < W.splash) cluster++;

      eff *= Math.max(1, cluster * .85);

const outOfAmmo = u => u.ws.length > 0 && u.ws.every(w => w.ammo <= 0);
/* 火力压制：不需要命中，弹片落在身边就压得人抬不起头 */
function suppress(wx, wz, r, amount, side) {
  for (const v of units) {
    if (v.side === side || v.hp <= 0 || v.d.layer === 'a') continue;
    const d = Math.hypot(v.wx - wx, (v.wz - wz) * DEPTH);

/* 工事是步兵专用的：车辆照常从上面开过去，既不挡路也不吃掩护 */
const usesCover = u => u.d.layer === 'g' && !u.d.armor;
function inWork(u) {
  if (u.bunker) return u.bunker;                       // 已进驻碉堡
  for (const w of works) {
    if (w.kind !== 'trench') continue;
    if (Math.abs(u.wx - w.wx) < w.r && Math.abs(u.wz - w.wz) * DEPTH < w.half) return w;
  }

}
/* 找最近的可用工事：碉堡防护好，给它一点"值得多跑几步"的优惠 */
function nearestWork(u, maxD) {
  let best = null, bd = maxD;
  for (const w of works) {
    if (w.kind === 'bunker' && w.users.length >= w.cap) continue;
    const d = Math.hypot(u.wx - w.wx, (u.wz - w.wz) * DEPTH) * (w.kind === 'bunker' ? .7 : 1);

function pushLog(txt) {
  logs.unshift(txt);

  el.innerHTML = logs.map((t, i) => '<div style="opacity:' + (1 - i * .18) + '">' + t + '</div>').join('');

/* ══════════════════════════ 战斗：主更新 ══════════════════════════ */
function update(dt) {
  tick += dt;
  /* 弹坑随时间渐隐：每隔一会儿把整块伤痕层擦掉一点 alpha，
     老坑被擦的次数多、先淡去，新坑还清楚 */
  scarFade += dt;
  if (scarFade > 1.2 && scars) {
    scarFade = 0;
    const c = scars.getContext('2d');
    c.save();
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.globalCompositeOperation = 'destination-out';
    c.fillStyle = 'rgba(0,0,0,.055)';
    c.fillRect(0, 0, scars.width, scars.height);
    c.restore();
  }
  for (const id in cmdCd) if (cmdCd[id] > 0) cmdCd[id] = Math.max(0, cmdCd[id] - dt);
  evTimer -= dt;                                     // 战场奇观：自己会来，不用你操作
  if (evTimer <= 0) { evTimer = rnd(60, 105); runSpectacle(); }

  if (autoRe) {
    reTimer -= dt;
    if (reTimer <= 0) {
      /* 波动平衡：不把双方死死锁在 50:50，让优势像潮水一样在两边来回 ——
         一方攻势推进一阵，再被扳回来。只有落后到快崩盘时才强力兜底。 */
      reTimer = 1.15;

      let nb = 0, nr = 0;
      for (const u of units) u.side === 0 ? nb++ : nr++;
      const cap = [nb, nr];
      const pw = [power(0), power(1)];
      const weak = pw[0] <= pw[1] ? 0 : 1;
      const ratio = Math.max(1, Math.min(pw[0], pw[1])) / Math.max(1, Math.max(pw[0], pw[1]));

      const tide = Math.sin(tick * .055);                  // 一个来回约 110 游戏秒
      const favored = tide > 0 ? 0 : 1;
      const sway = Math.abs(tide);
      if (favored !== lastFavored && sway > .35) {
        lastFavored = favored;
        pushLog(sideName(favored) + T('lgInit'));
      }
      for (let s = 0; s < 2; s++) {
        if (cap[s] >= TARGET) continue;
        /* 下风的一方补得慢些，于是战线会被推着走 */
        if (s === favored || Math.random() > sway * .6) reinforce(s);
      }
      if (ratio < .45 && cap[weak] < TARGET + 8) {         // 快打崩了才强力兜底
        reinforce(weak); reinforce(weak);
      }
    }
  }

  for (const u of units) {
    if (u.hp <= 0) continue;
    const air = u.d.layer === 'a';
    u.flash = Math.max(0, u.flash - dt * 4);
    if (u.dropping) {                                  // 挂在伞上飘下来，这期间打不了也挨不着压制
      u.alt -= 52 * dt;
      u.wx += Math.sin(tick * .55 + u.sd) * 11 * dt;   // 随风摆
      u.sup = 0;
      if (u.alt <= 0) {
        u.alt = 0; u.dropping = 0;

      }
      continue;
    }
    u.boost = Math.max(0, u.boost - dt);
    /* 工事里压制退得快，碉堡里最踏实 */
    u.sup = Math.max(0, u.sup - dt * (u.cover ? (u.cover.kind === 'bunker' ? .42 : .28) : .15));
    u.retgt -= dt;

    /* 卧倒：压制到一定程度步兵就趴下不动了（装甲车辆不趴） */
    if (!air && !u.d.armor) u.prone = u.sup > .75 ? Math.min(1, u.prone + dt * 4) : Math.max(0, u.prone - dt * 2);

    if (u.retgt <= 0 || !u.tgt || u.tgt.hp <= 0) {
      u.tgt = findTarget(u);

      const th = u.d.grit * (1 + u.rank * .22);
      if (u.mode === 0 && frac < th) { u.mode = 1; if (u.rank) pushLog(sideName(u.side) + ' ' + L(u.d.name) + T('lgRegroup')); }

    const hurtTrack = u.d.armor && frac < .45, hurtTurret = u.d.armor && frac < .25;

      if (!u.d.suicide && u.d.fuel) {
        u.fuel -= dt;
        if (!u.rtb && (u.fuel <= 0 || outOfAmmo(u))) {

        }
      }
      if (u.rtb) {
        const home = u.side === 0 ? -220 : WORLD_W + 220;

        u.alt += (u.d.alt * 1.35 - u.alt) * dt * .8;
        if (u.wx < -190 || u.wx > WORLD_W + 190) { u.hp = 0; u.silent = 1; u.noloss = 1; }
      } else if (u.d.suicide) {
        if (t) {
          /* 自杀弹要真撞上去，三个方向都得收敛（wz 记得换算成世界单位再折回） */
          const d = dist3(u, t) || 1;
          u.wx += (t.wx - u.wx) / d * sp * dt;
          u.wz += (t.wz - u.wz) * DEPTH / d * sp * dt / DEPTH;
          u.alt += ((t.alt || 0) - u.alt) / d * sp * dt;
          if (dist3(u, t) < 30 * K) { detonate(u); continue; }
        } else { u.wx += fwd * sp * dt; u.alt += (u.d.alt - u.alt) * dt; }
        if (u.wx < -160 || u.wx > WORLD_W + 160) { u.hp = 0; u.silent = 1; u.noloss = 1; }
      } else {
        const dist = t ? dist3(u, t) : 1e18;
        /* 咬地面目标就压下去飞：既进得了射程，也才像在俯冲 */
        const wantAlt = !t ? u.d.alt : (t.d.layer === 'a' ? t.alt : u.d.alt * .5);
        if (u.d.wing === 'rotor') {
          /* ── 旋翼：可以悬停，可以倒着退，稳稳吊在射程上打 ── */
          if (t) {
            const d = dist || 1, ux = (t.wx - u.wx) / d, uz = (t.wz - u.wz) * DEPTH / d;
            if (dist > u.d.rngMin * .85) { u.wx += ux * sp * dt; u.wz += uz * sp * dt / DEPTH; }
            else if (dist < u.d.rngMin * .35) u.wx -= ux * sp * dt * .6;
            else u.wz += uz * sp * dt * .3 / DEPTH;
          } else u.wx += fwd * sp * dt * .5;
        } else if (u.d.loiter && t && dist < u.d.rngMax * .95) {
          /* ── 察打无人机：吊在目标头上绕圈盘旋 ── */
          u.orb = (u.orb === undefined ? Math.random() * 6.3 : u.orb) + dt * .55;
          const R = u.d.rngMax * .62;
          u.wx += (t.wx + Math.cos(u.orb) * R - u.wx) * Math.min(1, dt * 1.2);
          u.wz += (t.wz + Math.sin(u.orb) * R * .5 / DEPTH - u.wz) * Math.min(1, dt * 1.2);
        } else if (t) {
          /* ── 固定翼：切进射程，然后在射程上小幅前后游弋 ──
             用正弦驱动而不是"飞过头就脱离"的状态机：允许速度过零点
             （也就是允许短暂静止），代码简单、不会卡死。
             注意水平推进不能写成 (t.wx-u.wx)/dist * sp —— dist 是三维的，
             飞机有高度，水平距离趋零时速度会渐近归零，飞机就钉在目标
             头顶不动了（这个 bug 实测抓到过） */
          const dz = t.wz - u.wz;
          if (t.d.layer === 'a') {
            /* ── 空中缠斗：咬住对手尾巴，而不是擦身而过 ──
               双方都往对方身后钻，自然绞成互相追逐的圆圈 */
            const bx = t.wx - t.face * 78 * K;                // 目标屁股后面
            const cs = sp * (dist < u.d.rngMin ? .62 : 1);    // 绞在一起就减速盘旋
            u.wx += Math.sign(bx - u.wx) * cs * dt;
            u.wz += Math.sign(dz) * Math.min(Math.abs(dz), cs * dt * .7 / DEPTH);
          } else {
            /* ── 对地：来回攻击航线 ──
               阶段由"本段剩余航程"推进，不看与目标的相对位置：目标自己
               也在跑，靠相对位置判断"是否飞过头"在相向交错时永远判不出来，
               飞机就卡在原地了（前几版栽的就是这个坑） */
            if (u.leg <= 0) {
              if (u.egress) {                                 // 拉开完了 → 掉头再进入
                u.egress = 0;
                u.face = t.wx > u.wx ? 1 : -1;
                u.leg = Math.abs(t.wx - u.wx) + 90 * K;       // 冲到目标并穿过去
              } else {                                        // 打完这一趟 → 脱离
                u.egress = 1;
                u.leg = 250 * K;
              }

            u.leg -= sp * dt;

            if (!u.egress) u.wz += Math.sign(dz) * Math.min(Math.abs(dz), sp * dt * .5 / DEPTH);

          }

        u.alt += (wantAlt - u.alt) * Math.min(1, dt * 1.4) + Math.sin(u.ph * 1.6 + u.sd) * 14 * dt;

      u.alt = clamp(u.alt, 18, 360);
    } else if (u.mode === 1) {
      /* ── 撤退整补：往自家后方退 ── */
      const home = u.side === 0 ? 40 : WORLD_W - 40;
      if (Math.abs(u.wx - home) > 30) u.wx += Math.sign(home - u.wx) * sp * dt;

      /* ── 地面推进：停在自己最远武器的射程上；被压制/趴下就别动 ── */

        u.wx = u.bunker.wx + ((u.slot || 0) - (u.bunker.cap - 1) / 2) * 15 * K;
        u.wz = u.bunker.wz;
        if (u.sup < .12) leaveBunker(u);
      } else if (usesCover(u) && u.sup > .4 && !u.cover) ck = nearestWork(u, 190 * K);
      if (u.bunker) { /* 不动 */ }
      else if (ck) {
        /* 步兵吃到火力，先往最近的壕沟/碉堡里钻，不硬顶着推进 */
        const dx = ck.wx - u.wx, dz = (ck.wz - u.wz) * DEPTH, d = Math.hypot(dx, dz) || 1;
        if (ck.kind === 'bunker' && d < ck.r && ck.users.length < ck.cap) {
          u.slot = ck.users.length;                // 并排站进射击孔
          ck.users.push(u.id); u.bunker = ck;

           大家都停在射程边缘远远对射，永远缠不起来 */
        const a = u.anc;
        const stop = (u.d.hold || (u.d.aggr ? u.d.rngMin * .5 : u.d.rngMax * .9)) * u.st;
        if (a) {
          const dx = a.wx - u.wx, dz = (a.wz - u.wz) * DEPTH, d = Math.hypot(dx, dz) || 1;
          if (d > stop) { u.wx += dx / d * sp * dt; u.wz += dz / d * sp * dt * .22 / DEPTH; }
        } else u.wx += fwd * sp * dt;
      }
      u.wx = clamp(u.wx, 8, WORLD_W - 8);
    }
    u.wz = clamp(u.wz, .02, .98);

    /* 炮口指向：算出仰角，高炮对天、坦克平射，一眼看得出在打谁 */
    if (t) {
      const dh = (t.alt || 0) + (t.d.layer === 'g' ? t.d.h * .5 : 0) - (u.alt || 0);
      const want = clamp(Math.atan2(dh * 1.15, Math.max(40, distG(u, t))), -.12, 1.32);
      u.aimEl += (want - u.aimEl) * Math.min(1, dt * 3.4);
    } else u.aimEl += (.12 - u.aimEl) * Math.min(1, dt * 1.6);

    /* 掉头（固定翼脱离途中保持航向，不许原地扭头） */
    let wantFace = u.face;
    const onRun = u.d.wing === 'fixed' && t && t.d.layer === 'g' && !u.rtb;
    if (u.rtb || u.mode === 1) wantFace = u.side === 0 ? -1 : 1;
    else if (onRun) wantFace = u.face;          // 对地航线自己管朝向，别在这儿扭头
    else if (t && Math.abs(t.wx - u.wx) > 25) wantFace = t.wx > u.wx ? 1 : -1;
    else if (!t) wantFace = fwd;
    if (wantFace !== u.face) u.turnT = .4;                    // 翻面 → 短暂横滚
    u.face = wantFace;
    u.turnT = Math.max(0, (u.turnT || 0) - dt);

    /* 别叠成一坨 */
    for (const v of units) {
      if (v === u || v.hp <= 0 || v.d.layer !== u.d.layer) continue;
      if (u.bunker || v.bunker) continue;          // 碉堡里的别被顶出去
      const dx = v.wx - u.wx, dz = (v.wz - u.wz) * DEPTH, da = (v.alt || 0) - (u.alt || 0);
      const md = air ? 78 : 50;      // 单位画大了，间距跟着放开，不然更挤
      if (Math.abs(dx) < md && Math.abs(dz) < md * .8 && Math.abs(da) < 45) {
        const push = (md - Math.abs(dx)) * dt * 1.9 * (dx > 0 ? -1 : 1);
        u.wx += push; v.wx -= push;
        const pz = (md * .8 - Math.abs(dz)) * dt * 1.1 * (dz > 0 ? -1 : 1) / DEPTH;
        u.wz = clamp(u.wz + pz, .02, .98); v.wz = clamp(v.wz - pz, .02, .98);
      }
    }

    /* ── 支援单位：补给车解压制+快装填，医疗兵治伤员 ── */
    if (u.d.support) {
      u.suppT = (u.suppT || 0) + dt;
      if (u.suppT > .5) {
        u.suppT = 0; u.link = null;
        let best = null, bd = 1e18;
        for (const v of units) {
          if (v.side !== u.side || v.hp <= 0 || v === u || v.d.layer === 'a') continue;
          const d = distG(u, v);
          if (d > 190 * K) continue;
          const need = u.d.support === 'medic' ? (1 - v.hp / v.max) : v.sup;
          if (need > .12 && d < bd) { bd = d; best = v; }
        }
        u.link = best;
      }
      if (u.link && u.link.hp > 0) {
        if (u.d.support === 'medic') {
          u.link.hp = Math.min(u.link.max, u.link.hp + u.link.max * .05 * dt);
          u.link.medicated = 1;
        } else {
          u.link.sup = Math.max(0, u.link.sup - dt * 1.1);
          u.link.resupplied = 1;
        }
      }
    }

    /* ── 开火 ── */
    const supRof = 1 + u.sup * 1.6;
    const rofMul = supRof * RANK_ROF[u.rank] * (hurtTurret ? 1.9 : 1) *
                   (u.boost ? .7 : 1) * (u.resupplied ? .85 : 1) * (u.prone > .5 ? 1.35 : 1);
    u.resupplied = 0;
    for (const w of u.ws) if (w.cd > 0) w.cd -= dt;
    if (t && !u.d.suicide && !u.rtb && u.mode === 0 && !u.egress) {   // 脱离途中背对目标，不开火
      const wp = pickWeapon(u, t, dist3(u, t));
      if (wp) {
        wp.cd = wp.d.rof * rnd(.85, 1.15) * rofMul;
        if (wp.ammo !== Infinity) wp.ammo--;
        fire(u, t, wp);
      }
    }
  }

  /* 弹药飞行 */
  for (const p of projs) {
    if (p.delay > 0) { p.delay -= dt; continue; }
    p.life -= dt;
    p.pt = p.t;
    p.t += dt / p.dur;
    const tt = Math.min(1, p.t);
    p.wx = p.sx + (p.ex - p.sx) * tt;
    p.wz = p.sz + (p.ez - p.sz) * tt;
    p.alt = p.sa + (p.ea - p.sa) * tt + Math.sin(tt * Math.PI) * p.arc;
    if (p.trail) { p.trail.push(p.wx, p.wz, p.alt); if (p.trail.length > 33) p.trail.splice(0, 3); }
    if (p.t >= 1) { hit(p); p.dead = 1; }
    if (p.life <= 0) p.dead = 1;
  }
  projs = projs.filter(p => !p.dead);

  for (const f of fx) f.t += dt;
  fx = fx.filter(f => f.t < f.dur);
  for (const w of wrecks) w.t += dt;
  wrecks = wrecks.filter(w => w.t < w.life);
  for (const s of smokes) { s.t += dt; s.r = s.r0 * (.55 + .45 * Math.min(1, s.t / 1.6)); }
  smokes = smokes.filter(s => s.t < s.life);

  /* 死亡结算 */
  for (const u of units) {
    if (u.hp <= 0 && !u.done) {
      u.done = 1;
      leaveBunker(u);
      if (!u.noloss) lost[u.side]++;
      if (!u.silent) {
        const air = u.d.layer === 'a';
        wrecks.push({ wx: u.wx, wz: u.wz, alt: u.alt, d: u.d, side: u.side, sd: u.sd,
                      face: u.face, t: 0, life: air ? 1.4 : 3.6 });
        if (air) {
          boom(u.wx, u.wz, u.alt, 56);
          fx.push({ k: 'boom', wx: u.wx + rnd(-16, 16), wz: u.wz, alt: u.alt + rnd(-12, 16),
                    r: 36, t: -.16, dur: .46, sd: (Math.random() * 1e6) | 0 });
          fx.push({ k: 'debris', wx: u.wx, wz: u.wz, alt: u.alt, t: 0, dur: 1.25,
                    sd: (Math.random() * 1e6) | 0, n: 9 });
        } else {
          boom(u.wx, u.wz, u.alt, 32);
        }
        beep('boom');
        /* 战功记账：谁打死的，谁涨经验 */
        const kr = u.killer;
        if (kr && kr.hp > 0) {
          kr.kills++; kr.vet += u.d.armor ? 2 : 1;
          const nr = kr.vet >= 5 ? 2 : (kr.vet >= 2 ? 1 : 0);   // 缠斗后击杀变稀，门槛跟着降
          if (nr > kr.rank) {
            kr.rank = nr;
            pushLog(sideName(kr.side) + ' ' + L(kr.d.name) + T('lgPromote') + L(RANK_NAME[nr]));
          }
          pushLog(sideName(kr.side) + ' ' + (kr.rank ? L(RANK_NAME[kr.rank]) + ' ' : '') + L(kr.d.name) +
                  T('lgDestroy') + sideName(u.side) + ' ' + L(u.d.name) + (u.ace ? ' ★' : ''));
        }
      }
    }
  }
  units = units.filter(u => u.hp > 0);

  if (!over && tick > 1.5) {
    let nb = 0, nr = 0;
    for (const u of units) u.side === 0 ? nb++ : nr++;
    /* 打光场上的、也打光预备队的，才算真的败了 */
    if (autoRe) { if (nb > 0 || reserve[0] > 0) nb = 1; if (nr > 0 || reserve[1] > 0) nr = 1; }
    if (nb === 0 || nr === 0) {
      over = true; running = false;
      const win = nb > 0 ? 0 : (nr > 0 ? 1 : -1);
      showBanner(win < 0 ? T('mutual') : sideName(win) + ' ' + T('wins'), win < 0 ? '#3b3a36' : sideCol(win));
    }
  }
}

/* ══════════════════════════ 开火与命中 ══════════════════════════ */
function fire(u, t, wp) {
  const W = wp.d, n = W.burst || 1;
  const d = W.proj === 'drop' ? distG(u, t) : dist3(u, t);
  for (let i = 0; i < n; i++) shoot(u, t, i * (W.proj === 'rocket' ? .16 : .09), d, W);
  u.flash = 1; u.fk = W.proj;
  beep(W.proj === 'bullet' || W.proj === 'flak' ? 'shot' : 'pew');
}
function shoot(u, t, delay, d3, W) {
  const k = W.proj, splash = W.splash || 0;
  const far = clamp((d3 || 0) / W.rng, 0, 1);
  let miss = false;
  if (!splash) {
    let acc = W.acc * (1 - .38 * far) * RANK_ACC[u.rank] * smokeCover(t);
    if (t.d.layer === 'a') acc *= (u.d.layer === 'g' ? .62 : .82);
    if (t.d.armor) acc *= 1.18;
    if (t.d.spd > 40 * K) acc *= .82;
    /* 缠在一起互相机动规避，谁也不好瞄 —— 让狗斗多绞几个回合 */
    if (t.d.layer === 'a' && u.d.layer === 'a' && (d3 || 0) < 110 * K) acc *= .7;
    if (u.sup > .3) acc *= 1 - u.sup * .35;         // 被压着打，手抖
    if (u.prone > .5) acc *= .82;
    if (t.cover) acc *= t.cover.kind === 'bunker' ? .52 : .72;   // 目标缩在工事里
    if (t.prone > .5) acc *= .78;                   // 趴着的人难打
    miss = Math.random() > clamp(acc, .08, .95);
  }
  const scatter = splash ? splash * .4 * (.55 + .8 * far) : (k === 'bullet' ? 12 : 8);
  let ex = t.wx + rnd(-scatter, scatter);
  let ez = t.wz + rnd(-scatter, scatter) / DEPTH;
  let ea = (t.alt || 0) + (t.d.layer === 'g' ? t.d.h * .5 : rnd(-8, 8));
  if (miss) {
    const off = 34 + far * 90;
    ex += rnd(-off, off); ez += rnd(-off, off) / DEPTH;
    ea += t.d.layer === 'a' ? rnd(-off, off) * .7 : rnd(0, off) * .5;
  }
  projs.push({
    kind: k, side: u.side, dmg: W.dmg, vs: W.vs, splash, supp: W.supp, owner: u,
    sx: u.wx + u.face * 18, sz: u.wz, sa: (u.alt || 0) + (u.d.layer === 'g' ? u.d.h * .6 : 0),
    ex, ez, ea, miss,
    wx: u.wx + u.face * 18, wz: u.wz, alt: (u.alt || 0) + (u.d.layer === 'g' ? u.d.h * .6 : 0),
    t: 0, pt: 0, delay: delay || 0, life: 8, col: sideCol(u.side), sd: (Math.random() * 1e6) | 0,
    dur: k === 'bullet' || k === 'flak' ? .26 : (k === 'shell' ? .34 : (k === 'bomb' ? 1.0 : .62)),
    arc: k === 'bomb' ? 210 : (k === 'shell' ? 26 : (k === 'rocket' ? 30 : 0)),
    trail: k === 'rocket' ? [] : null,
  });
}
function detonate(u) {
  u.hp = 0; u.silent = 1; u.done = 1; lost[u.side]++;
  const W = u.ws[0].d;
  hit({ ex: u.wx, ez: u.wz, ea: u.alt, dmg: W.dmg, vs: W.vs, splash: W.splash,
        supp: W.supp, side: u.side, sd: u.sd, miss: 0, owner: null });
}
/* 造成伤害：装甲面前轻武器会跳弹（期望伤害不变，但看着有戏） */
function applyDamage(p, v) {
  let dmg;
  const am = v.d.armor ? armMul(p, v) : 1;
  if (v.d.armor && am < 1) {
    if (Math.random() > am) {                  // 打不穿 → 跳弹
      fx.push({ k: 'ric', wx: p.ex, wz: p.ez, alt: p.ea, t: 0, dur: .3, sd: p.sd });
      beep('ric');
      v.sup = Math.min(1.5, v.sup + .06);
      return;
    }
    dmg = p.dmg;                                    // 打穿了就是全额
  } else dmg = dmgTo(p, v);
  if (v.cover && v.d.layer === 'g') dmg *= v.cover.kind === 'bunker' ? .42 : .74;
  if (v.prone > .5) dmg *= .82;
  dmg *= RANK_TGH[v.rank];
  v.hp -= dmg;
  if (v.hp <= 0 && p.owner) v.killer = p.owner;
}
function hit(p) {
  const r = p.splash;
  if (r) {
    boom(p.ex, p.ez, Math.max(0, p.ea - 6), r * .55);
    /* 只有重炮和航弹才留坑：手雷、火箭弹这种小溅射太频繁，会把纸糊成一片灰 */
    if (p.ea < 40 && r > 48 * K) scarCrater(p.ex, p.ez, r * .5);
    for (const v of units) {
      if (v.side === p.side || v.hp <= 0) continue;
      const d = Math.hypot(v.wx - p.ex, (v.wz - p.ez) * DEPTH, (v.alt || 0) - p.ea);
      if (d < r) {
        const falloff = 1 - d / r * .55;
        const q = { dmg: p.dmg * falloff, vs: p.vs, owner: p.owner };
        applyDamage(q, v);
      }
    }
    suppress(p.ex, p.ez, r * 1.8, p.supp || .3, p.side);
    beep('boom');
    return;
  }
  suppress(p.ex, p.ez, 62 * K, p.supp || .1, p.side);     // 子弹擦身而过也压人
  if (p.miss) { fx.push({ k: 'puff', wx: p.ex, wz: p.ez, alt: p.ea, t: 0, dur: .3, sd: p.sd }); return; }
  let best = null, bd = 30 * K;
  for (const v of units) {
    if (v.side === p.side || v.hp <= 0) continue;
    const d = Math.hypot(v.wx - p.ex, (v.wz - p.ez) * DEPTH, (v.alt || 0) + v.d.h * .5 - p.ea);
    if (d < bd) { bd = d; best = v; }
  }
  if (best) { applyDamage(p, best); fx.push({ k: 'spark', wx: p.ex, wz: p.ez, alt: p.ea, t: 0, dur: .22, sd: p.sd }); }
  else fx.push({ k: 'puff', wx: p.ex, wz: p.ez, alt: p.ea, t: 0, dur: .3, sd: p.sd });
}
const boom = (wx, wz, alt, r) => fx.push({ k: 'boom', wx, wz, alt, r, t: 0, dur: .5, sd: (Math.random() * 1e6) | 0 });

/* ══════════════════════════ 指挥官指令 ══════════════════════════ */
const CMDS = [
  { id:'strike',  name:['Strike','空袭'],    tip:['A bomber flight sweeps through, laying bombs along a line','一队轰炸机掠过，沿线洒下航弹'], cd:26, aim:1 },
  { id:'barrage', name:['Barrage','炮击'],   tip:['12 howitzer shells walk across the target area','12 发榴弹陆续砸进指定区域'],                cd:20, aim:1 },
  { id:'reinf',   name:['Reinforce','增援'], tip:['Commit a batch of units from the rear immediately','后方立刻投入一批部队'],                   cd:16, aim:0 },
  { id:'rally',   name:['Rally','鼓舞'],     tip:['Clears suppression, +speed and rate of fire for 7s','解除压制，全员提速抢攻 7 秒'],           cd:30, aim:1 },
  { id:'smoke',   name:['Smoke','烟雾'],     tip:['Lays smoke; enemy accuracy into it drops hard','放一片烟，敌军打这片命中大降'],               cd:18, aim:1 },
  { id:'airdrop', name:['Airdrop','空降'],   tip:['Transport drops a paratrooper stick (they fight once landed)','运输机掠过，投下一队伞兵（落地才能开火）'], cd:34, aim:1 },
];
const cmdCd = {};
CMDS.forEach(c => cmdCd[c.id] = 0);
let armed = null;

/* 不依赖发射单位的天降弹药 */
function ordnance(side, wx, wz, delay, dmg, splash, supp) {
  projs.push({
    kind: 'bomb', side, dmg, vs: [1, 1.2], splash: splash * K, supp, owner: null,
    sx: wx, sz: wz, sa: 300, ex: wx, ez: wz, ea: 0,
    wx, wz, alt: 300, t: 0, pt: 0, delay, life: 14,
    col: sideCol(side), sd: (Math.random() * 1e6) | 0, miss: 0,
    dur: .95, arc: 0, trail: null,
  });
}
function execCmd(id, wx, wz) {
  const side = curSide;
  if (id === 'strike') {
    for (let i = 0; i < 9; i++)
      ordnance(side, wx + (i - 4) * 52 + rnd(-12, 12), wz + rnd(-.05, .05), .55 + i * .17, 46, 62, .6);
    fx.push({ k: 'flyby', wx, wz, alt: 320, t: 0, dur: 2.4, sd: (Math.random() * 1e6) | 0, side });
    pushLog(sideName(side) + T('lgStrike'));
  } else if (id === 'barrage') {
    for (let i = 0; i < 12; i++)
      ordnance(side, wx + rnd(-95, 95), wz + rnd(-95, 95) / DEPTH, rnd(.3, 2.6), 40, 54, .55);
    pushLog(sideName(side) + T('lgBarrage'));
  } else if (id === 'reinf') {
    for (let i = 0; i < 5; i++) {
      reinforce(side);
      fx.push({ k: 'puff', wx: side === 0 ? 60 : WORLD_W - 60, wz: rnd(.1, .9), alt: 6, t: 0, dur: .5, sd: (Math.random() * 1e6) | 0 });
    }
    pushLog(sideName(side) + T('lgReinf'));
  } else if (id === 'rally') {
    let n = 0;
    for (const u of units) {
      if (u.side !== side || u.hp <= 0) continue;
      if (Math.hypot(u.wx - wx, (u.wz - wz) * DEPTH) > 300 * K) continue;
      u.sup = 0; u.prone = 0; u.boost = 7; if (u.mode === 1 && u.hp / u.max > .4) u.mode = 0;
      n++;
    }
    fx.push({ k: 'rally', wx, wz, alt: 0, t: 0, dur: 1.1, sd: (Math.random() * 1e6) | 0, side });
    pushLog(sideName(side) + T('lgRally') + n + T('lgUnits'));
  } else if (id === 'airdrop') {
    fx.push({ k: 'flyby', wx, wz, alt: 350, t: 0, dur: 2.8, sd: (Math.random() * 1e6) | 0, side });
    for (let i = 0; i < 5; i++) {
      const u = spawn(side, 'para', wx + (i - 2) * 42 * K + rnd(-14, 14), wz + rnd(-.05, .05));
      u.alt = 290 + i * 26;                     // 依次跳出舱门，高度错开
    }
    pushLog(sideName(side) + T('lgDrop'));
  } else if (id === 'smoke') {
    for (let i = 0; i < 4; i++)
      smokes.push({ wx: wx + rnd(-70, 70), wz: wz + rnd(-70, 70) / DEPTH, alt: 0,
                    r0: rnd(52, 76) * K, r: 30, t: 0, life: 13, sd: (Math.random() * 1e6) | 0 });
    pushLog(sideName(side) + T('lgSmoke'));
  }
  cmdCd[id] = CMDS.find(c => c.id === id).cd;
}


/* ══════════════════════════ SPECTACLES ══════════════════════════
   Occasional set-pieces that fire on their own — no order, no cooldown button.
   Each belongs to one nation, so you only see it when that nation is in the match. */
let evTimer = rnd(40, 75);
function farSide(side) { return side === 0 ? rnd(WORLD_W * .52, WORLD_W - 70) : rnd(70, WORLD_W * .48); }
/* Aim a set-piece at where the enemy actually is — a random patch of empty
   field makes for an expensive fireworks display and nothing else */
function enemyCentre(side) {
  let n = 0, sx = 0, sz = 0;
  for (const u of units)
    if (u.side !== side && u.hp > 0 && u.d.layer === 'g') { sx += u.wx; sz += u.wz; n++; }
  return n ? [sx / n, sz / n] : [farSide(side), .5];
}
/* Something arriving straight down out of the sky */
function skyFall(side, wx, wz, dmg, splash, dur, alt) {
  projs.push({
    kind: 'rocket', side, dmg, vs: [1.5, 1.6], splash: splash * K, supp: 2.2, owner: null,
    sx: wx, sz: wz, sa: alt, ex: wx, ez: wz, ea: 0, wx, wz, alt,
    t: 0, pt: 0, delay: 0, life: 14, col: sideCol(side),
    sd: (Math.random() * 1e6) | 0, miss: 0, dur, arc: 0, trail: [],
  });
}
function runSpectacle() {
  const ok = e => (e.nat < 0 || e.nat === match[0] || e.nat === match[1]);
  const pool = SPECTACLE.filter(e => ok(e) && (!e.when || e.when(e.nat === match[0] ? 0 : 1)));
  if (!pool.length) return;
  const e = pick(pool);
  const side = e.nat < 0 ? (Math.random() < .5 ? 0 : 1) : (e.nat === match[0] ? 0 : 1);
  e.go(side);
  pushLog('⚑ ' + sideName(side) + ' — ' + L(e.name));
}

const SPECTACLE = [
  { nat: 0, name: ['V-2 rocket', 'V-2 火箭'], go(side) {
      /* Supersonic — no warning, nothing can intercept it. It simply arrives. */
      skyFall(side, farSide(side), rnd(.1, .9), 320, 200, 1.4, 900);
    } },
  { nat: 0, name: ['V-1 flying bomb', 'V-1 飞弹'], go(side) {
      /* Slow and low, unlike the V-2 — flak actually gets a shot at this one */
      for (let i = 0; i < 2; i++) {
        const u = spawn(side, 'v1', side === 0 ? -30 - i * 70 : WORLD_W + 30 + i * 70, rnd(.2, .8));
        u.alt = 150;
      }
    } },
  { nat: 0, name: ["Wittmann's Tiger", '魏特曼的虎式'], go(side) {
      /* One tank, named, with a crew that knows what it's doing */
      const u = spawn(side, 'tank', side === 0 ? -30 : WORLD_W + 30, rnd(.3, .7));
      u.rank = 2; u.max = Math.round(u.max * 2.3); u.hp = u.max; u.ace = 1;
    } },
  { nat: 1, name: ['Market Garden', '市场花园'], go(side) {
      /* A division's worth of canopies over the enemy's back yard */
      const c = enemyCentre(side);
      for (let i = 0; i < 12; i++) {
        const u = spawn(side, 'para', c[0] + rnd(-210, 210), c[1] + rnd(-.26, .26));
        u.alt = 270 + i * 16; u.dropping = 1;
      }
    } },

/* ══════════════════════════ 画兵 ══════════════════════════ */
const bob = u => (u.prone > .5 ? 0 : Math.sin(tick * 6 + u.ph) * 1.2);
const rotor = u => Math.sin(tick * 22 + u.ph);
/* 炮管：按仰角画出去，一眼看出在打天上还是地上 */
function barrel(x, y, len, el, face) {
  rline(x, y, x + Math.cos(el) * len, y - Math.sin(el) * len);
  return [x + Math.cos(el) * len, y - Math.sin(el) * len];
}

/* 三种钢盔：德式 Stahlhelm 宽檐压低 / 美式 M1 圆碗 / 苏式 SSh-40 略方带尖 */
function helmet(x, y, n) {
  if (n === 0) {
    rpoly([[x - 5, y + 1], [x - 4.6, y - 3.4], [x, y - 5.2], [x + 4.6, y - 3.4], [x + 5, y + 1]], false, 1.4);
    rline(x - 6.4, y + 1.3, x + 6.4, y + .9);
  } else if (n === 1) {
    rcirc(x, y - 1, 4.4);
    rline(x - 5.4, y + 1.7, x + 4.4, y + 1.3);
  } else {
    rpoly([[x - 4.4, y + 1], [x - 4.4, y - 3], [x, y - 5.4], [x + 4.4, y - 3], [x + 4.4, y + 1]], true, 1.3);
    rline(x, y - 5.4, x, y - 6.8);
  }
}
/* 国籍标记：铁十字 / 白星 / 红星 */
function mark(x, y, r, n) {
  if (n === 0) { rline(x - r, y, x + r, y, .7); rline(x, y - r, x, y + r, .7); }
  else star(x, y, r * 1.1, n === 2);
}

const DRAW = {
