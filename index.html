<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>草稿纸大战</title>
<style>
  :root{ --paper:#f6f2e4; --ink:#3b3a36; --blue:#2f4f9e; --red:#b7332f; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:#cfc7b4;
    font-family:"HanziPen SC","Hanzipen SC","Chalkboard SE","Comic Sans MS","Bradley Hand","PingFang SC",cursive,sans-serif;
    color:var(--ink);overflow:hidden;display:flex;flex-direction:column;user-select:none;
  }
  /* 整个界面装在 #rot 里，横屏模式把它连按钮一起转 90° —— 比
     screen.orientation.lock 可靠（那个在 iOS Safari 根本没有） */
  #rot{display:flex;flex-direction:column;flex:1 1 auto;width:100%;min-height:0}
  body.ls #rot{position:fixed;top:0;left:0;transform-origin:0 0}
  #ls{display:none}
  header{
    flex:0 0 auto;display:flex;align-items:center;gap:14px;
    padding:5px 14px;background:var(--paper);border-bottom:2px dashed #c9bfa6;
  }
  h1{font-size:19px;margin:0;letter-spacing:2px;font-weight:normal}
  h1 .s{font-size:12px;opacity:.5;letter-spacing:0}
  .score{margin-left:auto;display:flex;gap:12px;font-size:14px;align-items:center}
  .score b{font-size:18px}
  .sb{color:var(--blue)} .sr{color:var(--red)} .vs{opacity:.45;font-size:12px}
  #bar{width:96px;height:9px;border:1.5px solid #a9a08a;border-radius:4px;overflow:hidden;display:flex}
  #bar i{display:block;height:100%}
  #bar .b{background:var(--blue)} #bar .r{background:var(--red)}
  #wrap{flex:1 1 auto;position:relative;min-height:0}
  canvas{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}
  #hud{
    flex:0 0 auto;background:var(--paper);border-top:2px dashed #c9bfa6;
    padding:5px 10px 7px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  }
  .grp{display:flex;gap:5px;align-items:center;padding:1px 8px;border-right:1px dotted #b9ad91}
  .grp:last-child{border:none}
  .col{flex-direction:column;align-items:flex-start;gap:3px}
  .row{display:flex;gap:4px;align-items:center}
  .lbl{font-size:11px;opacity:.5;width:14px;flex:0 0 auto}
  button{
    font-family:inherit;font-size:13px;color:var(--ink);background:transparent;
    border:1.5px solid #a9a08a;border-radius:12px 9px 13px 8px;
    padding:3px 9px;cursor:pointer;transition:.1s;line-height:1.25;
  }
  button:hover{background:#ece5d0}
  button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  button.side.blue.on{background:var(--blue);border-color:var(--blue)}
  button.side.red.on{background:var(--red);border-color:var(--red)}
  button small{display:block;font-size:9px;opacity:.62;letter-spacing:-.2px}
  .row button{min-width:54px;padding:2px 6px;font-size:12px;white-space:nowrap}
  .row button.on{border-width:2.5px;background:var(--ink);color:var(--paper)}
  #banner{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none}
  #banner span{font-size:min(13vw,110px);transform:rotate(-6deg);text-shadow:2px 3px 0 rgba(0,0,0,.08);letter-spacing:6px}
  #hint{
    position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
    font-size:13px;opacity:.42;pointer-events:none;white-space:nowrap;
  }
  @media (max-width:900px){
    h1{font-size:15px} h1 .s{display:none}
    #hud{padding:4px 5px 6px;gap:4px} .grp{padding:1px 4px}
    button{font-size:11px;padding:2px 6px}
    .row button{min-width:auto;font-size:11px;padding:2px 5px}
    .row button small{display:none}
    .score{font-size:12px;gap:7px} #bar{width:64px}
    #hint{font-size:11px;white-space:normal;max-width:88%;text-align:center}
    #ls{display:inline-block}          /* 横屏切换只在小屏出现 */
  }
  /* 手机竖屏：控件让出画面高度 */
  @media (max-width:520px){
    header{padding:3px 8px} h1{font-size:13px;letter-spacing:1px}
    .score{font-size:11px;gap:5px} .score b{font-size:14px} #bar{width:46px;height:7px}
    #hud{padding:3px 3px 5px;gap:3px}
    .grp{padding:1px 3px;gap:3px} .grp.col{gap:2px} .row{gap:3px}
    .lbl{display:none}
    button{font-size:10px;padding:2px 5px;border-radius:9px 7px 10px 6px}
    .row button{font-size:10px;padding:1px 4px}
    #hint{font-size:10px;bottom:4px}
  }
</style>
</head>
<body>

<div id="rot">

<header>
  <h1>草稿纸大战 <span class="s">/ 斜着看的战场</span></h1>
  <div class="score">
    <span class="sb">蓝 <b id="nb">0</b></span>
    <div id="bar"><i class="b" id="pb"></i><i class="r" id="pr"></i></div>
    <span class="sr"><b id="nr">0</b> 红</span>
    <span class="vs">战损 <span class="sr" id="lb">0</span>:<span class="sb" id="lr">0</span></span>
  </div>
</header>

<div id="wrap">
  <canvas id="c"></canvas>
  <div id="banner"><span id="bantext"></span></div>
  <div id="hint">按住拖动 ＝ 在透视网格上画部队（越靠下＝离你越近）　·　数字/字母键切兵种　·　空格暂停</div>
</div>

<div id="hud">
  <div class="grp">
    <button class="side blue on" data-side="0">蓝军</button>
    <button class="side red" data-side="1">红军</button>
  </div>
  <div class="grp col" id="tools">
    <div class="row" id="rowG"><span class="lbl">陆</span></div>
    <div class="row" id="rowA"><span class="lbl">空</span></div>
  </div>
  <div class="grp col">
    <div class="row"><button id="play" class="on">暂停</button><button id="spd">1×</button></div>
    <div class="row"><button id="auto" class="on">自动平衡</button><button id="snd">音效</button></div>
  </div>
  <div class="grp col">
    <div class="row"><button id="grid" class="on">网格</button><button id="ls">横屏</button></div>
    <div class="row"><button id="clr">重来</button></div>
  </div>
</div>

</div>

<script>
"use strict";
/* ══════════════════════ 手绘画笔 ══════════════════════ */
let _s = 1;
const seed = n => { _s = (n | 0) || 1; };
const sr = () => { _s = (_s * 1103515245 + 12345) & 0x7fffffff; return _s / 0x7fffffff; };
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);

const cv = document.getElementById('c');
const mainCtx = cv.getContext('2d');
let ctx = mainCtx;
let W = 0, H = 0, DPR = 1;

function rline(x1, y1, x2, y2, amp) {
  amp = amp === undefined ? 1.6 : amp;
  for (let k = 0; k < 2; k++) {
    const o = () => (sr() - .5) * amp;
    ctx.beginPath();
    ctx.moveTo(x1 + o(), y1 + o());
    ctx.quadraticCurveTo((x1 + x2) / 2 + o() * 1.8, (y1 + y2) / 2 + o() * 1.8, x2 + o(), y2 + o());
    ctx.stroke();
  }
}
function rpoly(pts, close, amp) {
  amp = amp === undefined ? 1.6 : amp;
  for (let k = 0; k < 2; k++) {
    const o = () => (sr() - .5) * amp;
    ctx.beginPath();
    ctx.moveTo(pts[0][0] + o(), pts[0][1] + o());
    for (let i = 1; i < pts.length; i++) {
      const p = pts[i], q = pts[i - 1];
      ctx.quadraticCurveTo((p[0] + q[0]) / 2 + o() * 1.6, (p[1] + q[1]) / 2 + o() * 1.6, p[0] + o(), p[1] + o());
    }
    if (close) ctx.closePath();
    ctx.stroke();
  }
}
function rcirc(cx, cy, r, amp) {
  const pts = [], n = 9;
  for (let i = 0; i <= n; i++) { const a = i / n * 6.2832; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  rpoly(pts, true, amp === undefined ? 1.3 : amp);
}
/* 红军统一的"涂色"手法：形状里补几道斜排线 */
function sh(x, y, w, h, n) {
  n = n || 3;
  const lw = ctx.lineWidth; ctx.lineWidth = Math.max(.8, lw * .6);
  for (let i = 0; i < n; i++) {
    const t = x + w * (i + .5) / n;
    rline(t, y, t - h * .55, y + h, .9);
  }
  ctx.lineWidth = lw;
}

/* ══════════════════════ 伪 3D 投影 ══════════════════════
   世界：wx 左右[0,WORLD_W] · wz 纵深[0近,1远] · alt 离地高度
   作弊透视：屏幕 y 铺满整块地面，横向按真透视收缩，
             但单位缩放只温和衰减 → 远处仍看得清                       */
const WORLD_W = 1400, DEPTH = 700, PERSP = 1.15, ALTK = 1.7;
const P_MIN = 1 / (1 + PERSP);
let FAR_Y = 0, BOT = 0, HZ = 0, XK = 1;
let SIZEK = 1.3;                   // 兵的大小，窄屏收小免得挤成一团（layout 里按屏宽定）

const persp = wz => 1 / (1 + wz * PERSP);
const pnorm = p => (p - P_MIN) / (1 - P_MIN);
const scaleAt = p => (.5 + .5 * p) * SIZEK;
function proj(wx, wz, alt) {
  const p = persp(wz);
  const gy = FAR_Y + (BOT - FAR_Y) * pnorm(p);
  return [W / 2 + (wx - WORLD_W / 2) * p * XK, gy - (alt || 0) * p * XK * ALTK, p];
}
const gyAt = wz => FAR_Y + (BOT - FAR_Y) * pnorm(persp(wz));
function unproj(sx, sy) {
  const n = clamp((sy - FAR_Y) / (BOT - FAR_Y), 0, 1);
  const p = P_MIN + n * (1 - P_MIN);
  return [(sx - W / 2) / (p * XK) + WORLD_W / 2, (1 / p - 1) / PERSP];
}

function layout() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  /* 用布局尺寸而非 getBoundingClientRect：横屏模式下容器带 rotate(90deg)，
     包围盒的宽高是反的，clientWidth/Height 不受 transform 影响 */
  W = cv.clientWidth || 1; H = cv.clientHeight || 1;
  cv.width = W * DPR; cv.height = H * DPR;
  mainCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
  HZ = H * .19; FAR_Y = HZ + 14; BOT = H * .97;
  XK = W / WORLD_W * 1.12;          // 近处略微超出画面，梯形两侧不至于空太多
  /* 兵的大小看"能用多少地方"，横屏时高度矮，别只按宽度放大 */
  const m = Math.min(W, H * 2.4);
  SIZEK = m < 520 ? .72 : (m < 760 ? .92 : (m < 1100 ? 1.12 : 1.3));
  paper = null;
}
/* 横屏模式：把 #rot 转 90°，宽高互换（用实际像素而非 100vh/100vw，
   免得踩 iOS Safari 工具栏导致的 vh 抖动） */
function applyRot() {
  const r = document.getElementById('rot'), on = document.body.classList.contains('ls');
  if (on) {
    r.style.width = window.innerHeight + 'px';
    r.style.height = window.innerWidth + 'px';
    r.style.transform = 'translate(' + window.innerWidth + 'px,0) rotate(90deg)';
  } else { r.style.width = r.style.height = r.style.transform = ''; }
  layout();
}
window.addEventListener('resize', applyRot);
window.addEventListener('orientationchange', () => setTimeout(applyRot, 120));

/* ══════════════════════ 武器表 ══════════════════════
   武器是独立的东西，一个单位可以挂好几门，各有自己的射程/装填/弹药。
   开火时 AI 按"对当前这个目标的单位时间有效伤害"挑一门 —— 于是战斗机
   远距离放空空导弹、贴近了改航炮；坦克碰步兵用同轴机枪、碰装甲才动主炮。
   hits 打得着的层 · vs[对装甲,对软] 伤害倍率 · acc 基础精度
   溅射武器不判命中（靠落点散布产生偏差，炸偏了周围照样吃伤害）
   ammo 只给空中武器 —— 地面武器不限弹，免得战场堆一群没子弹的僵尸    */
const WPN = {
  rifle:    { name:'步枪',      proj:'bullet', dmg:5,  rng:105, rof:.50, hits:'ga', vs:[.45,1],   acc:.68 },
  grenade:  { name:'手雷',      proj:'bomb',   dmg:16, rng:58,  rof:4.5, hits:'g',  vs:[.6,1.4],  splash:26 },
  hmg:      { name:'重机枪',    proj:'bullet', dmg:4,  rng:135, rof:.55, hits:'ga', vs:[.3,1.25], acc:.52, burst:3 },
  srifle:   { name:'狙击枪',    proj:'bullet', dmg:30, rng:265, rof:2.2, hits:'g',  vs:[.12,3],   acc:.93 },
  atgmMsl:  { name:'反坦克导弹',proj:'rocket', dmg:56, rng:245, rof:2.6, hits:'g',  vs:[2.2,.5],  acc:.88 },
  tankGun:  { name:'120主炮',   proj:'shell',  dmg:25, rng:185, rof:1.3, hits:'g',  vs:[1.2,1],   acc:.80 },
  coax:     { name:'同轴机枪',  proj:'bullet', dmg:4,  rng:112, rof:.45, hits:'ga', vs:[.25,1.3], acc:.60, burst:3 },
  autocan:  { name:'30机炮',    proj:'bullet', dmg:8,  rng:155, rof:.28, hits:'ga', vs:[.55,1.3], acc:.60 },
  flakGun:  { name:'高炮弹幕',  proj:'flak',   dmg:20, rng:215, rof:.45, hits:'a',  vs:[1,1],     acc:.48, burst:2 },
  samMsl:   { name:'防空导弹',  proj:'rocket', dmg:72, rng:430, rof:3.2, hits:'a',  vs:[1,1],     acc:.85 },
  howitzer: { name:'155榴弹',   proj:'bomb',   dmg:40, rng:400, rof:3.0, hits:'g',  vs:[1,1.2],   splash:56 },
  mlrsSalvo:{ name:'火箭弹齐射',proj:'rocket', dmg:24, rng:490, rof:6.0, hits:'g',  vs:[.8,1.4],  splash:44, burst:6 },
  /* ── 机载武器（带弹药） ── */
  aam:      { name:'空空导弹',  proj:'rocket', dmg:58, rng:230, rof:4.2, hits:'a',  vs:[1,1],     acc:.86, ammo:4 },
  gunpod:   { name:'航炮',      proj:'bullet', dmg:8,  rng:145, rof:.20, hits:'ga', vs:[.8,1],    acc:.68, ammo:70 },
  gatling:  { name:'加特林舔地',proj:'bullet', dmg:13, rng:130, rof:.12, hits:'g',  vs:[1.4,1.1], acc:.62, ammo:140, burst:2 },
  agRocket: { name:'对地火箭',  proj:'rocket', dmg:22, rng:185, rof:2.2, hits:'g',  vs:[.9,1.2],  splash:30, burst:4, ammo:6 },
  heliAT:   { name:'挂载反坦克',proj:'rocket', dmg:44, rng:205, rof:1.8, hits:'g',  vs:[2,.8],    acc:.86, ammo:8 },
  heliGun:  { name:'机头机炮',  proj:'bullet', dmg:6,  rng:120, rof:.35, hits:'ga', vs:[.4,1.2],  acc:.60, ammo:90, burst:3 },
  bombLoad: { name:'航弹',      proj:'drop',   dmg:56, rng:88,  rof:2.6, hits:'g',  vs:[1,1.2],   splash:70, burst:2, ammo:5 },
  droneMsl: { name:'精确制导弹',proj:'rocket', dmg:40, rng:235, rof:3.4, hits:'g',  vs:[1.6,1],   acc:.90, ammo:4 },
  warhead:  { name:'战斗部',    proj:'ram',    dmg:120,rng:22,  rof:9,   hits:'g',  vs:[1.5,1.5], splash:86 },
};

/* ══════════════════════ 编制表 ══════════════════════
   spd/hold 写"屏幕手感值"，启动时换算成世界单位
   armor 装甲 · alt 巡航高度 · fuel 滞空秒数 · w 挂载的武器            */
const UNITS = {
  inf:   { name:'步兵',   sub:'步枪+手雷',  k:'1', layer:'g', hp:34,  spd:26, armor:0, h:24, w:['rifle','grenade'],     weight:30 },
  mg:    { name:'机枪班', sub:'三连发压制', k:'2', layer:'g', hp:46,  spd:15, armor:0, h:18, w:['hmg'],                 weight:16 },
  sniper:{ name:'狙击手', sub:'专杀步兵',   k:'3', layer:'g', hp:26,  spd:18, armor:0, h:12, w:['srifle'],              weight:8 },
  atgm:  { name:'反坦克组',sub:'导弹+自卫枪',k:'4', layer:'g', hp:40,  spd:15, armor:0, h:22, w:['atgmMsl','rifle'],     weight:11 },
  tank:  { name:'主战坦克',sub:'主炮+同轴枪',k:'5', layer:'g', hp:195, spd:15, armor:1, h:16, w:['tankGun','coax'],      weight:18 },
  ifv:   { name:'步战车', sub:'机炮+反坦克',k:'6', layer:'g', hp:112, spd:31, armor:1, h:14, w:['autocan','atgmMsl'],   weight:14 },
  aa:    { name:'高射炮', sub:'近程弹幕',   k:'7', layer:'g', hp:95,  spd:12, armor:1, h:16, w:['flakGun'], hold:210,   weight:11 },
  sam:   { name:'防空导弹',sub:'远程猎机',   k:'8', layer:'g', hp:88,  spd:10, armor:1, h:18, w:['samMsl'],  hold:300,   weight:8 },
  arty:  { name:'榴弹炮', sub:'超远溅射',   k:'9', layer:'g', hp:105, spd:8,  armor:1, h:16, w:['howitzer'],            weight:9 },
  mlrs:  { name:'火箭炮', sub:'6发齐射',    k:'0', layer:'g', hp:92,  spd:7,  armor:1, h:18, w:['mlrsSalvo'],           weight:7 },

  fig:   { name:'战斗机', sub:'空空弹+航炮',k:'q', layer:'a', hp:72,  spd:68, armor:1, h:12, w:['aam','gunpod'],        alt:250, fuel:30, weight:13 },
  atk:   { name:'攻击机', sub:'舔地加特林', k:'w', layer:'a', hp:125, spd:46, armor:1, h:14, w:['gatling','agRocket'],  alt:95,  fuel:38, weight:11 },
  heli:  { name:'武直',   sub:'反坦克+机炮',k:'e', layer:'a', hp:108, spd:21, armor:1, h:14, w:['heliAT','heliGun'],    alt:52,  fuel:52, weight:11 },
  bmb:   { name:'轰炸机', sub:'地毯轰炸',   k:'r', layer:'a', hp:155, spd:36, armor:1, h:16, w:['bombLoad'],            alt:175, fuel:40, weight:8 },
  drone: { name:'无人机', sub:'察打一体',   k:'t', layer:'a', hp:46,  spd:27, armor:0, h:10, w:['droneMsl'],            alt:205, fuel:75, weight:9 },
  cruise:{ name:'巡航导弹',sub:'一次性·可拦截',k:'y',layer:'a',hp:22, spd:74, armor:0, h:8,  w:['warhead'],             alt:120, fuel:0, suicide:1, weight:4 },
};

const K = WORLD_W / 800;                       // 屏幕手感 → 世界单位
for (const n in WPN) {
  const w = WPN[n];
  w.id = n;
  w.rng *= K;
  if (w.splash) w.splash *= K;
  if (w.acc === undefined) w.acc = 1;          // 溅射武器不判必中必失
}
for (const k in UNITS) {
  const d = UNITS[k];
  d.key = k;
  d.spd *= K;
  if (d.hold) d.hold *= K;
  d.ws = d.w.map(n => WPN[n]);
  /* 派生：最远/最近武器射程、能打的层的并集、总 dps（战力估值用） */
  d.rngMax = Math.max.apply(null, d.ws.map(w => w.rng));
  d.rngMin = Math.min.apply(null, d.ws.map(w => w.rng));
  d.hitAny = (d.ws.some(w => w.hits.indexOf('g') >= 0) ? 'g' : '') +
             (d.ws.some(w => w.hits.indexOf('a') >= 0) ? 'a' : '');
  d.dps = d.ws.reduce((s, w) => s + w.dmg * (w.burst || 1) / w.rof, 0);
  d.hasAmmo = d.ws.some(w => w.ammo !== undefined);
}
const GROUND = ['inf','mg','sniper','atgm','tank','ifv','aa','sam','arty','mlrs'];
const AIR = ['fig','atk','heli','bmb','drone','cruise'];
const ALL = GROUND.concat(AIR);
const SIDE_COL = ['#2f4f9e', '#b7332f'];
const SIDE_NAME = ['蓝军', '红军'];
const SLOW = .5;                               // 全局慢速

/* ══════════════════════ 状态 ══════════════════════ */
let units = [], projs = [], fx = [], wrecks = [];
let uid = 1, lost = [0, 0];
let running = true, speed = 1, autoRe = true, sound = false, showGrid = true;
let curSide = 0, curTool = 'inf';
let over = false, reTimer = 0, tick = 0;

/* ══════════════════════ 纸 + 透视网格 ══════════════════════ */
let paper = null;
function drawPaper() {
  if (!paper || paper.width !== cv.width || paper.grid !== showGrid) {
    paper = document.createElement('canvas');
    paper.width = cv.width; paper.height = cv.height; paper.grid = showGrid;
    const p = paper.getContext('2d');
    p.setTransform(DPR, 0, 0, DPR, 0, 0);
    p.fillStyle = '#f6f2e4'; p.fillRect(0, 0, W, H);
    p.strokeStyle = '#bfd5e9'; p.lineWidth = 1;
    for (let y = 28; y < H; y += 28) {
      p.beginPath();
      for (let x = 0; x <= W; x += 22) p.lineTo(x, y + Math.sin(x * .012 + y) * .7);
      p.stroke();
    }
    p.globalAlpha = .4;
    for (let x = 28; x < W; x += 28) { p.beginPath(); p.moveTo(x, 0); p.lineTo(x, H); p.stroke(); }
    p.globalAlpha = 1;
    p.strokeStyle = '#e0a3a3'; p.lineWidth = 1.4;
    p.beginPath(); p.moveTo(46, 0); p.lineTo(46, H); p.stroke();
    p.fillStyle = 'rgba(120,105,80,.05)';
    for (let i = 0; i < 900; i++) p.fillRect(Math.random() * W, Math.random() * H, 1.4, 1.4);

    ctx = p; seed(11); ctx.lineCap = 'round';
    ctx.strokeStyle = '#c6bda6'; ctx.lineWidth = 1.4;                 // 远山
    let mx = -60;
    while (mx < W + 40) {
      const wd = clamp(rnd(220, 400) * (W / 1100), 70, 420), hg = rnd(34, 78) * clamp(W / 1100, .6, 1);
      rpoly([[mx, HZ], [mx + wd * .3, HZ - hg * .55], [mx + wd * .46, HZ - hg],
             [mx + wd * .68, HZ - hg * .5], [mx + wd, HZ]], false, 2.4);
      mx += wd * .82;
    }
    ctx.strokeStyle = '#8a8271'; ctx.lineWidth = 1.6;
    rline(0, HZ, W, HZ, 1.8);
    if (showGrid) {                                                   // 手画透视网格
      ctx.strokeStyle = 'rgba(115,138,170,.4)'; ctx.lineWidth = 1;
      for (let wx = 0; wx <= WORLD_W; wx += 100) {
        const a = proj(wx, 0, 0), b = proj(wx, 1, 0);
        rline(a[0], a[1], b[0], b[1], 1.3);
      }
      for (let i = 0; i <= 10; i++) {
        const a = proj(0, i / 10, 0), b = proj(WORLD_W, i / 10, 0);
        rline(a[0], a[1], b[0], b[1], 1.3);
      }
    }
    ctx.strokeStyle = '#8d8a6d'; ctx.lineWidth = 1.1;                 // 草
    for (let i = 0; i < 150; i++) {
      const wz = sr(), q = proj(sr() * WORLD_W, wz, 0), sc = scaleAt(q[2]);
      rline(q[0], q[1], q[0] + (sr() - .5) * 6 * sc, q[1] - (4 + sr() * 7) * sc, 1);
    }
    ctx = mainCtx;
  }
  mainCtx.drawImage(paper, 0, 0, W, H);
}

/* ══════════════════════ 生成 ══════════════════════ */
function spawn(side, key, wx, wz) {
  const d = UNITS[key];
  units.push({
    id: uid++, side, d,
    wx: clamp(wx, -30, WORLD_W + 30), wz: clamp(wz, .02, .98),
    alt: d.layer === 'a' ? d.alt : 0,
    hp: d.hp, max: d.hp, tgt: null, anc: null, retgt: 0,
    /* 每门武器一份独立的装填计时与弹药 */
    ws: d.ws.map(w => ({ d: w, cd: rnd(0, w.rof), ammo: w.ammo === undefined ? Infinity : w.ammo })),
    fuel: d.fuel || 0, rtb: 0, fk: '',
    face: side === 0 ? 1 : -1,
    sd: (Math.random() * 1e6) | 0, ph: Math.random() * 10,
    st: rnd(.72, 1.04), flash: 0, done: 0, silent: 0, noloss: 0,
  });
}
function weightedKey() {
  let tot = 0; for (const k of ALL) tot += UNITS[k].weight;
  let r = Math.random() * tot;
  for (const k of ALL) { r -= UNITS[k].weight; if (r <= 0) return k; }
  return 'inf';
}
/* 战力估值：血 + 火力，用于自动平衡 */
function power(side) {
  let p = 0;
  for (const u of units) if (u.side === side) p += u.hp + u.d.dps * 2.2;
  return p;
}
/* 挑兵种：先补自家编成缺口（免得某个军种被打绝种），再按对手编成挑克制 */
function counterKey(side) {
  const foe = 1 - side;
  let air = 0, armor = 0, soft = 0, myAir = 0, myAD = 0, myTot = 0;
  for (const u of units) {
    if (u.side === foe) { u.d.layer === 'a' ? air++ : (u.d.armor ? armor++ : soft++); }
    else { myTot++; if (u.d.layer === 'a') myAir++; if (u.d.hitAny.indexOf('a') >= 0) myAD++; }
  }
  const tot = air + armor + soft || 1, mt = myTot || 1, r = Math.random();
  if (myAir / mt < .18 && r < .55) return pick(['fig','atk','heli','bmb','drone']);
  if (air > 0 && myAD / mt < .12 && r < .55) return pick(['aa','sam','fig','ifv']);
  if (air / tot > .26 && r < .6) return pick(['aa','sam','fig','ifv','sam']);
  if (armor / tot > .34 && r < .6) return pick(['atgm','heli','tank','drone','atgm']);
  if (soft / tot > .48 && r < .5) return pick(['mg','sniper','mlrs','arty','atk']);
  return weightedKey();
}
function reinforce(side, key) {
  spawn(side, key || counterKey(side),
        side === 0 ? rnd(-20, 90) : rnd(WORLD_W - 90, WORLD_W + 20), rnd(.05, .95));
}
function initArmies() {
  const plan = ['inf','inf','inf','inf','mg','sniper','tank','tank','ifv','atgm','aa','sam','arty','mlrs','fig','heli','atk','drone'];
  plan.forEach(k => {
    spawn(0, k, rnd(20, WORLD_W * .26), rnd(.05, .95));
    spawn(1, k, rnd(WORLD_W * .74, WORLD_W - 20), rnd(.05, .95));
  });
}

/* ══════════════════════ 音效 ══════════════════════ */
let AC = null;
function beep(type) {
  if (!sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime, g = AC.createGain();
    g.connect(AC.destination);
    if (type === 'boom') {
      const n = 5000, b = AC.createBuffer(1, n, 44100), ch = b.getChannelData(0);
      for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
      const s = AC.createBufferSource(); s.buffer = b;
      const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 620;
      s.connect(f); f.connect(g); g.gain.value = .18; s.start(t);
    } else {
      const o = AC.createOscillator();
      o.type = type === 'shot' ? 'square' : 'sawtooth';
      o.frequency.setValueAtTime(type === 'shot' ? 900 : 380, t);
      o.frequency.exponentialRampToValueAtTime(150, t + (type === 'shot' ? .06 : .18));
      g.gain.setValueAtTime(.04, t); g.gain.exponentialRampToValueAtTime(.001, t + .2);
      o.connect(g); o.start(t); o.stop(t + .21);
    }
  } catch (e) { }
}

/* ══════════════════════ 战斗逻辑（世界坐标） ══════════════════════ */
const canHit = (a, b) => a.d.hitAny.indexOf(b.d.layer) >= 0;
const dmgTo = (p, v) => p.dmg * (v.d.armor ? p.vs[0] : p.vs[1]);
const dist3 = (a, b) => Math.hypot(b.wx - a.wx, (b.wz - a.wz) * DEPTH, (b.alt || 0) - (a.alt || 0));

/* 挑武器：在打得着、装填好、有弹、够射程的武器里，选对这个目标
   单位时间有效伤害最高的那门。导弹自然被留给装甲和飞机，机枪留给步兵。 */
function pickWeapon(u, t, dist) {
  let best = null, bestEff = 0;
  for (const w of u.ws) {
    const W = w.d;
    if (w.cd > 0 || w.ammo <= 0) continue;
    if (W.hits.indexOf(t.d.layer) < 0) continue;
    if (dist > W.rng) continue;
    let eff = W.dmg * (t.d.armor ? W.vs[0] : W.vs[1]) * (W.burst || 1) / W.rof;
    /* 反装甲专用弹别拿去打步兵 —— 弹药金贵，留给硬目标 */
    if (!t.d.armor && W.vs[0] / W.vs[1] > 2) eff *= .45;
    /* 溅射弹按目标周围挤了多少人加权：敌人扎堆时才值得甩手雷/齐射 */
    if (W.splash) {
      let cluster = 0;
      for (const v of units) {
        if (v.side === u.side || v.hp <= 0) continue;
        if (Math.hypot(v.wx - t.wx, (v.wz - t.wz) * DEPTH) < W.splash) cluster++;
      }
      eff *= Math.max(1, cluster * .85);
    }
    if (eff > bestEff) { bestEff = eff; best = w; }
  }
  return best;
}
const outOfAmmo = u => u.ws.every(w => w.ammo <= 0);

function findTarget(u) {
  let best = null, bd = 1e18;
  for (const v of units) {
    if (v.side === u.side || v.hp <= 0 || !canHit(u, v)) continue;
    const d = dist3(u, v);
    if (d < bd) { bd = d; best = v; }
  }
  return best;
}
/* 陆军推进锚点：只认最近的敌方地面单位，否则会被过路飞机勾住原地不动 */
function findAnchor(u) {
  let best = null, bd = 1e18;
  for (const v of units) {
    if (v.side === u.side || v.hp <= 0 || v.d.layer !== 'g') continue;
    const d = Math.hypot(v.wx - u.wx, (v.wz - u.wz) * DEPTH);
    if (d < bd) { bd = d; best = v; }
  }
  return best;
}

function update(dt) {
  tick += dt;
  /* 自动平衡增援：弱的一方必补，强的一方只在差距不大时补 */
  if (autoRe) {
    reTimer -= dt;
    if (reTimer <= 0) {
      reTimer = 2.0;
      let nb = 0, nr = 0;
      for (const u of units) u.side === 0 ? nb++ : nr++;
      const pw = [power(0), power(1)];
      const weak = pw[0] <= pw[1] ? 0 : 1;
      const ratio = Math.max(1, Math.min(pw[0], pw[1])) / Math.max(1, Math.max(pw[0], pw[1]));
      const cap = [nb, nr];
      if (cap[weak] < 54) reinforce(weak);
      if (ratio < .55 && cap[weak] < 54) reinforce(weak);       // 落后太多，追加一个
      if (ratio > .82 && cap[1 - weak] < 54) reinforce(1 - weak);
    }
  }

  for (const u of units) {
    if (u.hp <= 0) continue;
    u.flash = Math.max(0, u.flash - dt * 4);
    u.retgt -= dt;
    if (u.retgt <= 0 || !u.tgt || u.tgt.hp <= 0) {
      u.tgt = findTarget(u);
      if (u.d.layer === 'g') u.anc = findAnchor(u);
      u.retgt = .3 + Math.random() * .3;
    }
    const t = u.tgt, fwd = u.side === 0 ? 1 : -1, sp = u.d.spd;
    const dist = t ? dist3(u, t) : 1e18;

    /* 油料/弹药：耗尽即返航（所有挂载都打空了也算） */
    if (u.d.layer === 'a' && !u.d.suicide) {
      u.fuel -= dt;
      if (!u.rtb && (u.fuel <= 0 || outOfAmmo(u))) u.rtb = 1;
    }

    if (u.d.layer === 'a') {
      u.ph += dt;
      if (u.rtb) {                                          // 返航：拉升、掉头、飞出图外
        const home = u.side === 0 ? -220 : WORLD_W + 220;
        u.wx += Math.sign(home - u.wx) * sp * dt * 1.1;
        u.alt += (u.d.alt * 1.35 - u.alt) * dt * .8;
        if (u.wx < -190 || u.wx > WORLD_W + 190) { u.hp = 0; u.silent = 1; u.noloss = 1; }
      } else if (u.d.suicide) {                             // 巡航导弹：一头撞上去
        if (t) {
          const d = dist || 1;
          u.wx += (t.wx - u.wx) / d * sp * dt;
          u.wz += (t.wz - u.wz) / d * sp * dt;
          u.alt += ((t.alt || 0) - u.alt) / d * sp * dt;
          if (dist < 30 * K) { detonate(u); continue; }
        } else {
          u.wx += fwd * sp * dt;
          u.alt += (u.d.alt - u.alt) * dt;
        }
        if (u.wx < -160 || u.wx > WORLD_W + 160) { u.hp = 0; u.silent = 1; u.noloss = 1; }
      } else {
        const wantAlt = (t && t.d.layer === 'a') ? t.alt : u.d.alt;
        if (t) {
          /* 按最近武器的射程贴上去：攻击机才会飞到加特林射程内舔地，
             战斗机也会从放导弹的距离一路压到航炮距离狗斗 */
          const d = dist || 1, ux = (t.wx - u.wx) / d, uz = (t.wz - u.wz) * DEPTH / d;
          if (dist > u.d.rngMin * .85) { u.wx += ux * sp * dt; u.wz += uz * sp * dt / DEPTH; }
          else if (dist < u.d.rngMin * .35) u.wx -= ux * sp * dt * .6;
          else u.wz += uz * sp * dt * .3 / DEPTH;
        } else u.wx += fwd * sp * dt * .5;
        u.alt += (wantAlt - u.alt) * Math.min(1, dt * 1.4) + Math.sin(u.ph * 1.6 + u.sd) * 14 * dt;
        u.wx = clamp(u.wx, -180, WORLD_W + 180);
      }
      u.alt = clamp(u.alt, 18, 360);
    } else {
      const a = u.anc, stop = (u.d.hold || u.d.rngMax * .9) * u.st;
      if (a) {
        const dx = a.wx - u.wx, dz = (a.wz - u.wz) * DEPTH, d = Math.hypot(dx, dz) || 1;
        if (d > stop) { u.wx += dx / d * sp * dt; u.wz += dz / d * sp * dt * .22 / DEPTH; }
      } else u.wx += fwd * sp * dt;
      u.wx = clamp(u.wx, 8, WORLD_W - 8);
    }
    u.wz = clamp(u.wz, .02, .98);

    /* 掉头：朝向跟着当前目标/去向，留 25 单位死区免得来回抖 */
    let wantFace = u.face;
    if (u.rtb) wantFace = u.side === 0 ? -1 : 1;
    else if (t && Math.abs(t.wx - u.wx) > 25) wantFace = t.wx > u.wx ? 1 : -1;
    else if (!t) wantFace = fwd;
    u.face = wantFace;

    /* 别叠成一坨 */
    for (const v of units) {
      if (v === u || v.hp <= 0 || v.d.layer !== u.d.layer) continue;
      const dx = v.wx - u.wx, dz = (v.wz - u.wz) * DEPTH, da = (v.alt || 0) - (u.alt || 0);
      const md = u.d.layer === 'a' ? 62 : 40;
      if (Math.abs(dx) < md && Math.abs(dz) < md * .8 && Math.abs(da) < 45) {
        const push = (md - Math.abs(dx)) * dt * 1.9 * (dx > 0 ? -1 : 1);
        u.wx += push; v.wx -= push;
        const pz = (md * .8 - Math.abs(dz)) * dt * 1.1 * (dz > 0 ? -1 : 1) / DEPTH;
        u.wz = clamp(u.wz + pz, .02, .98); v.wz = clamp(v.wz - pz, .02, .98);
      }
    }

    /* 每门武器独立装填，每帧最多打一门（会自然交替使用） */
    for (const w of u.ws) if (w.cd > 0) w.cd -= dt;
    if (t && !u.d.suicide && !u.rtb) {
      const wp = pickWeapon(u, t, dist);
      if (wp) {
        wp.cd = wp.d.rof * rnd(.85, 1.15);
        if (wp.ammo !== Infinity) wp.ammo--;
        fire(u, t, wp);
      }
    }
  }

  /* 弹药飞行 */
  for (const p of projs) {
    if (p.delay > 0) { p.delay -= dt; continue; }
    p.life -= dt;
    p.pt = p.t;
    p.t += dt / p.dur;
    const tt = Math.min(1, p.t);
    p.wx = p.sx + (p.ex - p.sx) * tt;
    p.wz = p.sz + (p.ez - p.sz) * tt;
    p.alt = p.sa + (p.ea - p.sa) * tt + Math.sin(tt * Math.PI) * p.arc;
    if (p.trail) { p.trail.push(p.wx, p.wz, p.alt); if (p.trail.length > 33) p.trail.splice(0, 3); }
    if (p.t >= 1) { hit(p); p.dead = 1; }
    if (p.life <= 0) p.dead = 1;
  }
  projs = projs.filter(p => !p.dead);

  for (const f of fx) f.t += dt;
  fx = fx.filter(f => f.t < f.dur);
  for (const w of wrecks) w.t += dt;        // 空中残骸不再下坠：就在被击落的高度上散掉
  wrecks = wrecks.filter(w => w.t < w.life);

  for (const u of units) {
    if (u.hp <= 0 && !u.done) {
      u.done = 1;
      if (!u.noloss) lost[u.side]++;
      if (!u.silent) {
        const air = u.d.layer === 'a';
        wrecks.push({ wx: u.wx, wz: u.wz, alt: u.alt, d: u.d, side: u.side, sd: u.sd,
                      face: u.face, t: 0, life: air ? 1.4 : 3.6 });   // 游戏秒，×2 才是真实秒
        if (air) {
          /* 空中被击落：就在原高度开花——主爆 + 半拍后的二次闪 + 四散的碎片 */
          boom(u.wx, u.wz, u.alt, 56);
          fx.push({ k: 'boom', wx: u.wx + rnd(-16, 16), wz: u.wz, alt: u.alt + rnd(-12, 16),
                    r: 36, t: -.16, dur: .46, sd: (Math.random() * 1e6) | 0 });
          fx.push({ k: 'debris', wx: u.wx, wz: u.wz, alt: u.alt, t: 0, dur: 1.25,
                    sd: (Math.random() * 1e6) | 0, n: 9 });
        } else boom(u.wx, u.wz, u.alt, 32);
        beep('boom');
      }
    }
  }
  units = units.filter(u => u.hp > 0);

  if (!autoRe && !over && tick > 1.5) {
    let nb = 0, nr = 0;
    for (const u of units) u.side === 0 ? nb++ : nr++;
    if (nb === 0 || nr === 0) {
      over = true; running = false;
      const win = nb > 0 ? 0 : (nr > 0 ? 1 : -1);
      showBanner(win < 0 ? '同 归 于 尽' : SIDE_NAME[win] + ' 胜 利', win < 0 ? '#3b3a36' : SIDE_COL[win]);
    }
  }
}

function fire(u, t, wp) {
  const W = wp.d, n = W.burst || 1;
  const d = dist3(u, t);
  for (let i = 0; i < n; i++) shoot(u, t, i * (W.proj === 'rocket' ? .16 : .09), d, W);
  u.flash = 1; u.fk = W.proj;
  beep(W.proj === 'bullet' || W.proj === 'flak' ? 'shot' : 'pew');
}
function shoot(u, t, delay, d3, W) {
  const k = W.proj, splash = W.splash || 0;
  const far = clamp((d3 || 0) / W.rng, 0, 1);             // 0=贴脸 1=射程极限

  /* 单体弹算一次命中判定：越远越飘、打飞机更难、打大块头更容易 */
  let miss = false;
  if (!splash) {
    let acc = W.acc * (1 - .38 * far);
    if (t.d.layer === 'a') acc *= (u.d.layer === 'g' ? .62 : .82);   // 打空中目标难
    if (t.d.armor) acc *= 1.18;                                      // 车辆是大目标
    if (t.d.spd > 40 * K) acc *= .82;                                // 高速目标更难咬住
    miss = Math.random() > clamp(acc, .1, .95);
  }
  /* 溅射弹不判必中必失，落点散布随距离变大 —— 远程炮击自然打不准 */
  const scatter = splash ? splash * .4 * (.55 + .8 * far) : (k === 'bullet' ? 12 : 8);
  let ex = t.wx + rnd(-scatter, scatter);
  let ez = t.wz + rnd(-scatter, scatter) / DEPTH;
  let ea = (t.alt || 0) + (t.d.layer === 'g' ? t.d.h * .5 : rnd(-8, 8));
  if (miss) {                                            // 打偏了要看得出来：弹道从旁边穿过去
    const off = 34 + far * 90;
    ex += rnd(-off, off); ez += rnd(-off, off) / DEPTH;
    ea += t.d.layer === 'a' ? rnd(-off, off) * .7 : rnd(0, off) * .5;
  }
  const p = {
    kind: k, side: u.side, dmg: W.dmg, vs: W.vs, splash,
    sx: u.wx + u.face * 18, sz: u.wz, sa: (u.alt || 0) + (u.d.layer === 'g' ? u.d.h * .6 : 0),
    ex, ez, ea, miss,
    t: 0, pt: 0, delay: delay || 0, life: 8, col: SIDE_COL[u.side], sd: (Math.random() * 1e6) | 0,
    dur: k === 'bullet' || k === 'flak' ? .26 : (k === 'shell' ? .34 : (k === 'bomb' ? 1.0 : .62)),
    arc: k === 'bomb' ? 210 : (k === 'shell' ? 26 : (k === 'rocket' ? 30 : 0)),
    trail: k === 'rocket' ? [] : null,
  };
  if (k === 'drop') { p.sx = u.wx; p.sa = u.alt; p.ex = t.wx + rnd(-22, 22); p.dur = .9; p.arc = 0; }
  p.wx = p.sx; p.wz = p.sz; p.alt = p.sa;
  projs.push(p);
}
function detonate(u) {

    ctx.fillRect(q[0] - w / 2, y + h + 1.4, w, 1.8);
    ctx.fillStyle = u.rtb ? '#c0392b' : '#7d7a5f';
    ctx.fillRect(q[0] - w / 2, y + h + 1.4, w * clamp(rr, 0, 1), 1.8);
  }
  ctx.restore();
}

/* ══════════════════════ 画弹药 / 特效 ══════════════════════ */
function drawProj(p) {
  if (p.delay > 0) return;
  const q = proj(p.wx, p.wz, p.alt), sc = scaleAt(q[2]);
  ctx.save();
  ctx.strokeStyle = p.col; ctx.lineCap = 'round';
  seed(p.sd);
  if (p.kind === 'bullet' || p.kind === 'flak') {
    const t0 = Math.max(0, p.t - .45), t1 = Math.min(1, p.t);
    const a = proj(p.sx + (p.ex - p.sx) * t0, p.sz + (p.ez - p.sz) * t0, p.sa + (p.ea - p.sa) * t0 + Math.sin(t0 * Math.PI) * p.arc);
    const b = proj(p.sx + (p.ex - p.sx) * t1, p.sz + (p.ez - p.sz) * t1, p.sa + (p.ea - p.sa) * t1 + Math.sin(t1 * Math.PI) * p.arc);
    ctx.globalAlpha = .78; ctx.lineWidth = Math.max(.9, 1.7 * sc);
    rline(a[0], a[1], b[0], b[1], 1.1);
  } else if (p.kind === 'rocket') {
    const tr = p.trail;
    if (tr && tr.length >= 6) {
      ctx.globalAlpha = .28; ctx.strokeStyle = '#9c9484'; ctx.lineWidth = Math.max(1, 2.4 * sc);
      ctx.beginPath();
      for (let i = 0; i < tr.length; i += 3) {
        const t = proj(tr[i], tr[i + 1], tr[i + 2]);
        i === 0 ? ctx.moveTo(t[0], t[1]) : ctx.lineTo(t[0], t[1]);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = .95; ctx.fillStyle = p.col;
    const pv = proj(p.sx + (p.ex - p.sx) * Math.max(0, p.pt), p.sz, p.alt);
    ctx.translate(q[0], q[1]); ctx.rotate(Math.atan2(q[1] - pv[1], q[0] - pv[0]));
    const s = Math.max(2.2, 5 * sc);
    ctx.beginPath(); ctx.moveTo(s, 0); ctx.lineTo(-s * .8, s * .45); ctx.lineTo(-s * .8, -s * .45); ctx.closePath(); ctx.fill();
  } else {
    ctx.globalAlpha = .92; ctx.fillStyle = p.col;
    ctx.beginPath();
    ctx.ellipse(q[0], q[1], Math.max(1.8, 3.8 * sc), Math.max(1.4, 2.6 * sc), 0, 0, 6.3);
    ctx.fill();
  }
  ctx.restore();
}

function drawFx(f) {
  if (f.t < 0) return;                       // 负 t = 延迟出场（二次闪）
  const k = f.t / f.dur;
  const q = proj(f.wx, f.wz, f.alt || 0), sc = scaleAt(q[2]);
  ctx.save(); seed(f.sd);
  ctx.globalAlpha = 1 - k; ctx.lineCap = 'round';
  if (f.k === 'debris') {
    /* 击落碎片：一把向外飞散又被重力拽下来的短线 */
    ctx.strokeStyle = '#6b6455';
    for (let i = 0; i < f.n; i++) {
      const a = sr() * 6.3, v = 55 + sr() * 130, spin = sr() * 6.3;
      const dx = Math.cos(a) * v * f.t;
      const da = Math.sin(a) * v * f.t * .8 - 230 * f.t * f.t;
      if (f.alt + da < 2) continue;          // 落地了就不画
      const p2 = proj(f.wx + dx, f.wz + Math.sin(a) * v * f.t * .25 / DEPTH, f.alt + da);
      const s2 = scaleAt(p2[2]), len = (3.5 + sr() * 4) * s2;
      ctx.lineWidth = Math.max(.9, 1.5 * s2);
      const ang = spin + f.t * 9;
      rline(p2[0] - Math.cos(ang) * len, p2[1] - Math.sin(ang) * len,
            p2[0] + Math.cos(ang) * len, p2[1] + Math.sin(ang) * len, 1);
    }
    ctx.restore(); return;
  }
  if (f.k === 'boom') {
    const r = f.r * sc * .55 * (.4 + k * 1.5);
    ctx.strokeStyle = '#3b3a36'; ctx.lineWidth = Math.max(1.2, 2.2 * sc);
    const pts = [];
    for (let i = 0; i < 14; i++) { const a = i / 14 * 6.2832, rr = r * (i % 2 ? .5 : 1); pts.push([q[0] + Math.cos(a) * rr, q[1] + Math.sin(a) * rr * .78]); }
    rpoly(pts, true, 2.4);
    ctx.lineWidth = Math.max(1, 1.4 * sc);
    for (let i = 0; i < 6; i++) {
      const a = sr() * 6.3, l = r * (1.1 + sr() * .7);
      rline(q[0] + Math.cos(a) * r * .7, q[1] + Math.sin(a) * r * .55, q[0] + Math.cos(a) * l, q[1] + Math.sin(a) * l * .78, 1.5);
    }
  } else if (f.k === 'spark') {
    ctx.strokeStyle = '#3b3a36'; ctx.lineWidth = Math.max(1, 1.5 * sc);
    for (let i = 0; i < 5; i++) {
      const a = sr() * 6.3, l = (5 + sr() * 9 + k * 6) * sc;
      rline(q[0], q[1], q[0] + Math.cos(a) * l, q[1] + Math.sin(a) * l, 1);
    }
  } else {
    ctx.strokeStyle = '#9c9484'; ctx.lineWidth = 1.2;
    rcirc(q[0], q[1], (3 + k * 8) * sc, 2);
  }
  ctx.restore();
}

function drawWreck(w) {
  const fade = w.life * .42;                 // 更早开始淡，走得干脆些
  const a = w.t < fade ? 1 : Math.max(0, 1 - (w.t - fade) / (w.life - fade));
  drawUnit({ wx: w.wx, wz: w.wz, alt: w.alt, d: w.d, side: w.side, sd: w.sd, ph: 0, flash: 0, face: w.face }, a * .75, 1);
  const q = proj(w.wx, w.wz, w.alt), sc = scaleAt(q[2]);
  ctx.save();
  ctx.globalAlpha = a * .7;
  ctx.strokeStyle = '#6b6455'; ctx.lineWidth = Math.max(1.4, 2.4 * sc); ctx.lineCap = 'round';
  seed(w.sd + 3);
  const s = (w.d.layer === 'a' ? 15 : 12) * sc, yy = q[1] - (w.d.layer === 'g' ? 9 * sc : 0);
  rline(q[0] - s, yy - s, q[0] + s, yy + s, 2.2);
  rline(q[0] + s, yy - s, q[0] - s, yy + s, 2.2);
  ctx.restore();
}

/* ══════════════════════ 渲染（画家算法：远的先画） ══════════════════════ */
const zbuf = [];
function render() {
  drawPaper();
  zbuf.length = 0;
  for (const w of wrecks) zbuf.push([w.wz, 0, w]);
  for (const u of units) zbuf.push([u.wz, 1, u]);
  for (const p of projs) if (p.delay <= 0) zbuf.push([p.wz, 2, p]);
  for (const f of fx) zbuf.push([f.wz, 3, f]);
  zbuf.sort((a, b) => b[0] - a[0]);
  for (const e of zbuf) {
    if (e[1] === 0) drawWreck(e[2]);
    else if (e[1] === 1) drawUnit(e[2], 1, 0);
    else if (e[1] === 2) drawProj(e[2]);
    else drawFx(e[2]);
  }
  if (hover.on) {
    const d = UNITS[curTool], g = unproj(hover.x, hover.y);
    drawUnit({ wx: g[0], wz: g[1], alt: d.layer === 'a' ? d.alt : 0, d, side: curSide,
               sd: 4242, ph: 0, flash: 0, face: curSide === 0 ? 1 : -1 }, .34, 1);
  }
}

/* ══════════════════════ 主循环 ══════════════════════ */
const $ = id => document.getElementById(id);
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, .05) * SLOW;
  last = now;
  if (running) for (let i = 0; i < speed; i++) update(dt);
  render();
  let nb = 0, nr = 0;
  for (const u of units) u.side === 0 ? nb++ : nr++;
  $('nb').textContent = nb; $('nr').textContent = nr;
  $('lb').textContent = lost[0]; $('lr').textContent = lost[1];
  const pw = [power(0), power(1)], tot = pw[0] + pw[1] || 1;
  $('pb').style.width = (pw[0] / tot * 100) + '%';
  $('pr').style.width = (pw[1] / tot * 100) + '%';
  requestAnimationFrame(loop);
}

/* ══════════════════════ 交互 ══════════════════════ */
const hover = { on: 0, x: 0, y: 0 };
let drawing = 0, lastPut = 0, lastX = -1e9, lastY = -1e9;
/* offsetX/Y 已经是画布本地坐标，浏览器替我们做了 transform 逆变换，
   横屏旋转下照样准；clientX 减 rect 在旋转后是错的 */
const pos = e => [e.offsetX, e.offsetY];
function put(x, y) {
  const now = performance.now();
  if (now - lastPut < 80 || Math.hypot(x - lastX, y - lastY) < 14) return;
  lastPut = now; lastX = x; lastY = y;
  const g = unproj(x, y);
  spawn(curSide, curTool, g[0], g[1]);
  hideBanner();
}
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); drawing = 1; lastX = lastY = -1e9; const q = pos(e); put(q[0], q[1]); });
cv.addEventListener('pointermove', e => { const q = pos(e); hover.on = 1; hover.x = q[0]; hover.y = q[1]; if (drawing) put(q[0], q[1]); });
cv.addEventListener('pointerup', () => drawing = 0);
cv.addEventListener('pointercancel', () => drawing = 0);
cv.addEventListener('pointerleave', () => { drawing = 0; hover.on = 0; });

function buildTools() {
  const mk = (list, row) => list.forEach(k => {
    const d = UNITS[k], b = document.createElement('button');
    b.innerHTML = d.name + '<small>' + d.k.toUpperCase() + ' ' + d.sub + '</small>';
    b.dataset.k = k;
    /* 悬停看挂载明细 */
    b.title = d.name + '　血 ' + d.hp + '　速 ' + Math.round(d.spd / K) + '\n' +
      d.ws.map(w => '· ' + w.name + '：伤 ' + w.dmg + (w.burst ? '×' + w.burst : '') +
        '　射程 ' + Math.round(w.rng / K) + '　装填 ' + w.rof + 's' +
        '　对' + (w.hits === 'g' ? '地' : w.hits === 'a' ? '空' : '地空') +
        (w.splash ? '　溅射 ' + Math.round(w.splash / K) : '') +
        (w.ammo ? '　弹 ' + w.ammo : '')).join('\n');
    if (k === curTool) b.className = 'on';
    b.onclick = () => selTool(k);
    row.appendChild(b);
  });
  mk(GROUND, $('rowG')); mk(AIR, $('rowA'));
}
function selTool(k) {
  curTool = k;
  document.querySelectorAll('#tools button').forEach(b => b.className = b.dataset.k === k ? 'on' : '');
}
buildTools();
document.querySelectorAll('.side').forEach(b => {
  b.onclick = () => {
    curSide = +b.dataset.side;
    document.querySelectorAll('.side').forEach(x => x.classList.toggle('on', +x.dataset.side === curSide));
  };
});
function togglePlay() {
  running = !running;
  if (running) { over = false; hideBanner(); }
  $('play').textContent = running ? '暂停' : '开战';
  $('play').classList.toggle('on', running);
}
$('play').onclick = togglePlay;
$('spd').onclick = () => { speed = speed === 1 ? 2 : (speed === 2 ? 4 : 1); $('spd').textContent = speed + '×'; $('spd').classList.toggle('on', speed > 1); };
$('auto').onclick = () => { autoRe = !autoRe; $('auto').classList.toggle('on', autoRe); };
$('snd').onclick = () => { sound = !sound; $('snd').classList.toggle('on', sound); if (sound) beep('shot'); };
$('grid').onclick = () => { showGrid = !showGrid; $('grid').classList.toggle('on', showGrid); paper = null; };
$('ls').onclick = () => {
  const on = !document.body.classList.contains('ls');
  document.body.classList.toggle('ls', on);
  $('ls').classList.toggle('on', on);
  $('ls').textContent = on ? '竖屏' : '横屏';
  try { localStorage.setItem('mg_ls', on ? '1' : '0'); } catch (e) { }
  applyRot();
};
$('clr').onclick = () => {
  units = []; projs = []; fx = []; wrecks = []; lost = [0, 0]; over = false; tick = 0;
  hideBanner(); initArmies();
  running = true; $('play').textContent = '暂停'; $('play').classList.add('on');
};
addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); togglePlay(); return; }
  if (e.key === 'Tab') { e.preventDefault(); document.querySelector('.side[data-side="' + (1 - curSide) + '"]').click(); return; }
  const k = e.key.toLowerCase();
  for (const key of ALL) if (UNITS[key].k === k) { selTool(key); return; }
});

function showBanner(txt, col) {
  $('bantext').textContent = txt; $('bantext').style.color = col;
  $('banner').style.display = 'flex';
  $('play').textContent = '开战'; $('play').classList.remove('on');
}
const hideBanner = () => $('banner').style.display = 'none';

/* 记住上次的横竖屏选择 */
try {
  if (localStorage.getItem('mg_ls') === '1') {
    document.body.classList.add('ls');
    $('ls').classList.add('on'); $('ls').textContent = '竖屏';
  }
} catch (e) { }
applyRot();
initArmies();
requestAnimationFrame(loop);
setTimeout(() => { const h = $('hint'); h.style.transition = 'opacity 1s'; h.style.opacity = 0; }, 9000);
</script>
</body>
