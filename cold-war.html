<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>草稿纸大战</title>
<style>
  :root{ --paper:#f6f2e4; --ink:#3b3a36; --blue:#2f4f9e; --red:#b7332f; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:#cfc7b4;
    font-family:"HanziPen SC","Hanzipen SC","Chalkboard SE","Comic Sans MS","Bradley Hand","PingFang SC",cursive,sans-serif;
    color:var(--ink);overflow:hidden;display:flex;flex-direction:column;user-select:none;
  }
  #rot{display:flex;flex-direction:column;flex:1 1 auto;width:100%;min-height:0}
  body.ls #rot{position:fixed;top:0;left:0;transform-origin:0 0}
  #lsb{display:none}
  a.era{
    font-size:11px;color:var(--ink);opacity:.45;text-decoration:none;
    border-bottom:1px dotted currentColor;margin-left:10px;white-space:nowrap;
  }
  a.era:hover{opacity:.85}
  header{
    flex:0 0 auto;display:flex;align-items:center;gap:12px;
    padding:4px 12px;background:var(--paper);border-bottom:2px dashed #c9bfa6;
  }
  h1{font-size:18px;margin:0;letter-spacing:2px;font-weight:normal;white-space:nowrap}
  h1 .s{font-size:11px;opacity:.5;letter-spacing:0}
  .score{margin-left:auto;display:flex;gap:10px;font-size:13px;align-items:center;white-space:nowrap}
  .score b{font-size:17px}
  .sb{color:var(--blue)} .sr{color:var(--red)} .vs{opacity:.45;font-size:12px}
  #bar{width:90px;height:9px;border:1.5px solid #a9a08a;border-radius:4px;overflow:hidden;display:flex}
  #bar i{display:block;height:100%}
  #bar .b{background:var(--blue)} #bar .r{background:var(--red)}
  #wrap{flex:1 1 auto;position:relative;min-height:0}
  canvas{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}
  body.aiming canvas{cursor:cell}
  button.cmd.nospect{opacity:.42;cursor:default}
  body.panning canvas{cursor:grabbing}
  #zoom{
    position:absolute;right:10px;top:8px;display:none;gap:5px;align-items:center;
    background:rgba(239,233,216,.86);border:1.5px solid #a9a08a;border-radius:13px 9px 12px 10px;
    padding:2px 4px 2px 9px;font-size:12px;color:var(--ink);
  }
  #zoom.on{display:flex}
  #zoom b{font-weight:600;letter-spacing:.3px}
  #zoom button{padding:1px 7px;font-size:12px}
  #hud{
    flex:0 0 auto;background:var(--paper);border-top:2px dashed #c9bfa6;
    padding:4px 8px 6px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;
  }
  .grp{display:flex;gap:4px;align-items:center;padding:1px 7px;border-right:1px dotted #b9ad91}
  .grp:last-child{border:none}
  .col{flex-direction:column;align-items:flex-start;gap:3px}
  .row{display:flex;gap:4px;align-items:center}
  .lbl{font-size:11px;opacity:.5;width:14px;flex:0 0 auto}
  button{
    font-family:inherit;font-size:13px;color:var(--ink);background:transparent;
    border:1.5px solid #a9a08a;border-radius:12px 9px 13px 8px;
    padding:3px 9px;cursor:pointer;transition:.1s;line-height:1.25;position:relative;overflow:hidden;
  }
  button:hover{background:#ece5d0}
  button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  button.side.blue.on{background:var(--blue);border-color:var(--blue)}
  button.side.red.on{background:var(--red);border-color:var(--red)}
  button small{display:block;font-size:9px;opacity:.62;letter-spacing:-.2px}
  .row button{min-width:52px;padding:2px 6px;font-size:12px;white-space:nowrap}
  .row button.on{border-width:2.5px;background:var(--ink);color:var(--paper)}
  /* 指令按钮：底部升起的冷却遮罩 */
  .cmd{border-style:solid;border-color:#8d8272}
  .cmd .cool{
    position:absolute;left:0;right:0;bottom:0;background:rgba(59,58,54,.24);
    pointer-events:none;height:0;
  }
  .cmd.ready{border-color:var(--ink);font-weight:bold}
  .cmd.armed{background:var(--ink);color:var(--paper)}
  .cmd.cooling{opacity:.55;cursor:not-allowed}
  #banner{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none}
  #banner span{font-size:min(13vw,110px);transform:rotate(-6deg);text-shadow:2px 3px 0 rgba(0,0,0,.08);letter-spacing:6px}
  #log{
    position:absolute;right:8px;bottom:6px;pointer-events:none;
    font-size:11px;line-height:1.5;text-align:right;opacity:.62;max-width:44%;
  }
  #log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #hint{
    position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
    font-size:12px;opacity:.42;pointer-events:none;white-space:nowrap;
  }
  @media (max-width:900px){
    h1{font-size:15px} h1 .s{display:none}
    #hud{padding:3px 4px 5px;gap:4px} .grp{padding:1px 4px}
    button{font-size:11px;padding:2px 6px}
    .row button{min-width:auto;font-size:11px;padding:2px 5px}
    .row button small{display:none}
    .score{font-size:12px;gap:6px} #bar{width:58px}
    #hint{font-size:11px;white-space:normal;max-width:80%;text-align:center}
    #lsb{display:inline-block}
    #log{font-size:10px;max-width:38%}
  }
  @media (max-width:520px){
    header{padding:3px 7px} h1{font-size:13px;letter-spacing:1px}
    .score{font-size:11px;gap:4px} .score b{font-size:14px} #bar{width:40px;height:7px}
    #hud{padding:2px 3px 4px;gap:3px}
    .grp{padding:1px 3px;gap:3px} .grp.col{gap:2px} .row{gap:3px}
    .lbl{display:none}
    button{font-size:10px;padding:2px 4px;border-radius:9px 7px 10px 6px}
    .row button{font-size:10px;padding:1px 4px}
    #hint{font-size:10px;bottom:4px} #log{font-size:9px}
  }
</style>
</head>
<body>
<div id="rot">

<header>
  <h1>草稿纸大战 <span class="s">/ US vs USSR</span><a class="era" href="index.html">← 1944</a></h1>
  <div class="score">
    <span class="sb">US <b id="nb">0</b></span>
    <div id="bar"><i class="b" id="pb"></i><i class="r" id="pr"></i></div>
    <span class="sr"><b id="nr">0</b> CCCP</span>
    <span class="vs" id="tide"></span>
    <span class="vs"><span id="lossLbl">战损</span> <span class="sr" id="lb">0</span>:<span class="sb" id="lr">0</span></span>
  </div>
</header>

<div id="wrap">
  <canvas id="c"></canvas>
  <div id="zoom"><b id="zlvl">×1.0</b><button id="zfit" title="Reset view">1:1</button></div>
  <div id="banner"><span id="bantext"></span></div>
  <div id="log"></div>
  <div id="hint">按住拖动＝画部队　·　下排指令点一下再点战场　·　空格暂停</div>
</div>

<div id="hud">
  <div class="grp">
    <button class="side blue on" data-side="0">美军</button>
    <button class="side red" data-side="1">苏军</button>
  </div>
  <div class="grp col" id="tools">
    <div class="row" id="rowG"><span class="lbl">陆</span></div>
    <div class="row" id="rowA"><span class="lbl">空</span></div>
    <div class="row" id="rowS"><span class="lbl">S</span></div>
  </div>
  <div class="grp col">
    <div class="row" id="rowC"><span class="lbl">令</span></div>
    <div class="row">
      <button id="play" class="on">暂停</button><button id="spd">1×</button>
      <button id="auto" class="on">自动平衡</button><button id="snd" class="on">音效</button>
      <button id="grid" class="on">网格</button><button id="lsb">横屏</button>
      <button id="clr">重来</button><button id="langBtn" title="Language / 语言">EN</button>
    </div>
  </div>
</div>

</div>
<script>
"use strict";
/* ══════════════════════════ 手绘画笔 ══════════════════════════ */
let _s = 1;
const seed = n => { _s = (n | 0) || 1; };
const sr = () => { _s = (_s * 1103515245 + 12345) & 0x7fffffff; return _s / 0x7fffffff; };
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);

/* ══════════════════════════ LANGUAGE ══════════════════════════
   Bilingual throughout: any user-facing string is written as [en, zh]
   and read through L(). Falls back to English if a translation is missing. */
let lang = 'en';
try {
  const q = new URLSearchParams(location.search).get('lang');       // ?lang=en|zh wins, for sharing a link
  lang = q === 'en' || q === 'zh' ? q
       : localStorage.getItem('mg_lang') || ((navigator.language || '').indexOf('zh') === 0 ? 'zh' : 'en');
} catch (e) { }
const L = a => Array.isArray(a) ? (a[lang === 'zh' ? 1 : 0] || a[0]) : a;
const UI = {
  losses:   ['losses', '战损'],
  pause:    ['Pause', '暂停'],      fight:    ['Fight', '开战'],
  auto:     ['Auto-balance', '自动平衡'], sound: ['Sound', '音效'],
  grid:     ['Grid', '网格'],       rotate:   ['Rotate', '横屏'],
  portrait: ['Portrait', '竖屏'],   restart:  ['Restart', '重来'],
  spectNone:['(no set-play)', '（无奇观）'],
  ground:   ['G', '陆'],            air:      ['A', '空'],  spect:  ['S', '奇'],  orders: ['!', '令'],
  hint:     ['Drag to draw units　·　Click an order, then click the field　·　Space to pause',
             '按住拖动＝画部队　·　点指令再点战场　·　空格暂停'],
  pushing:  ['pushing', '攻势'],
  wins:     ['WINS', '胜 利'],      mutual:  ['MUTUAL RUIN', '同 归 于 尽'],
  hp:       ['HP', '血'],           kills:   ['kills', '战功'],
  ammo:     ['ammo', '弹'],         reloading:['reloading', '装填中'],
  heals:    ['heals allies', '治疗友军'],
  resup:    ['unsuppress · faster reload', '解压制·快装填'],
  supporting:[' (supporting)', '（正在支援）'],
  suppressed:['suppressed', '压制'], prone: ['prone', '卧倒'],
  inBunker: ['in bunker', '驻守碉堡'], inTrench: ['in trench', '壕沟内'],
  withdraw: ['withdrawing', '撤退整补'], rtb: ['RTB', '返航中'],
  fuel:     ['fuel', '油料'],       trackDmg:['track damaged', '履带受损'],
  turretJam:['turret jammed', '炮塔卡滞'], rallied:['rallied', '受鼓舞'],
  speed:    ['speed', '速'],        range:  ['range', '射程'],
  reload:   ['reload', '装填'],     dmg:    ['dmg', '伤'],
  splash:   ['splash', '溅射'],     vs:     ['vs', '对'],
  vsG:      ['ground', '地'],       vsA:    ['air', '空'], vsGA: ['ground+air', '地空'],
  support:  ['support', '支援'],
  cooldown: ['cooldown', '冷却'],
  aimHint:  ['Click the button, then click the field to aim', '点按钮后再点战场选位置'],
  /* log templates */
  lgDestroy:[' destroyed ', ' 击毁 '],
  lgPromote:[' promoted to ', ' 晋升'],
  lgRegroup:[' pulls back to regroup', ' 撤下整补'],
  lgFuel:   [' RTB — out of fuel', ' 油尽返航'],
  lgAmmo:   [' RTB — out of ammo', ' 弹尽返航'],
  lgInit:   [' seizes the initiative', ' 转入攻势'],
  lgStrike: [' calls in an air strike', ' 呼叫空袭'],
  lgBarrage:[' requests a barrage', ' 请求炮火覆盖'],
  lgReinf:  [' reinforcements arrive', ' 紧急增援抵达'],
  lgRally:  [' rallies ', ' 全线鼓舞 '],  lgUnits: [' units', ' 部队'],
  lgSmoke:  [' lays smoke', ' 施放烟幕'],
  lgDrop:   [' airborne drop', ' 空降突击队'],
};
const T = k => L(UI[k]);

const cv = document.getElementById('c');
const mainCtx = cv.getContext('2d');
let ctx = mainCtx;
let W = 0, H = 0, DPR = 1;

function rline(x1, y1, x2, y2, amp) {
  amp = amp === undefined ? 1.6 : amp;
  for (let k = 0; k < 2; k++) {
    const o = () => (sr() - .5) * amp;
    ctx.beginPath();
    ctx.moveTo(x1 + o(), y1 + o());
    ctx.quadraticCurveTo((x1 + x2) / 2 + o() * 1.8, (y1 + y2) / 2 + o() * 1.8, x2 + o(), y2 + o());
    ctx.stroke();
  }
}
function rpoly(pts, close, amp) {
  amp = amp === undefined ? 1.6 : amp;
  for (let k = 0; k < 2; k++) {
    const o = () => (sr() - .5) * amp;
    ctx.beginPath();
    ctx.moveTo(pts[0][0] + o(), pts[0][1] + o());
    for (let i = 1; i < pts.length; i++) {
      const p = pts[i], q = pts[i - 1];
      ctx.quadraticCurveTo((p[0] + q[0]) / 2 + o() * 1.6, (p[1] + q[1]) / 2 + o() * 1.6, p[0] + o(), p[1] + o());
    }
    if (close) ctx.closePath();
    ctx.stroke();
  }
}
function rcirc(cx, cy, r, amp) {
  const pts = [], n = 9;
  for (let i = 0; i <= n; i++) { const a = i / n * 6.2832; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  rpoly(pts, true, amp === undefined ? 1.3 : amp);
}
/* 五角星：一笔连五个隔点，正好画出星形轮廓。美军空心、苏军补一道涂色 */
function star(cx, cy, r, solid) {
  const pts = [];
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + i * 4 * Math.PI / 5;
    pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
  }
  rpoly(pts, true, .7);
  if (solid) { const lw = ctx.lineWidth; ctx.lineWidth = lw * .7; rline(cx - r * .5, cy, cx + r * .5, cy, .6); ctx.lineWidth = lw; }
}
/* 苏军统一的"涂色"手法：形状里补几道斜排线 */
function sh(x, y, w, h, n) {
  n = n || 3;
  const lw = ctx.lineWidth; ctx.lineWidth = Math.max(.7, lw * .6);
  for (let i = 0; i < n; i++) { const t = x + w * (i + .5) / n; rline(t, y, t - h * .55, y + h, .9); }
  ctx.lineWidth = lw;
}

/* ══════════════════════════ 伪 3D 投影 ══════════════════════════
   世界：wx 左右[0,WORLD_W] · wz 纵深[0近,1远] · alt 离地高度
   作弊透视：屏幕 y 铺满整块地面、横向按真透视收缩，
             但单位缩放只温和衰减 → 远处仍看得清                     */
const WORLD_W = 1400, DEPTH = 700, PERSP = 1.15, ALTK = 1.7;
const P_MIN = 1 / (1 + PERSP);
let FAR_Y = 0, BOT = 0, HZ = 0, XK = 1;
let SIZEK = 1.3;

const persp = wz => 1 / (1 + wz * PERSP);
const pnorm = p => (p - P_MIN) / (1 - P_MIN);
/* 缩放压缩过的作弊透视：纯透视会把远处压到 0.47 倍（看不清了），
   完全不压又显得一样大。取中间：远处约近处的 0.62 倍 */
const scaleAt = p => (.28 + .72 * p) * SIZEK;
function proj(wx, wz, alt) {
  const p = persp(wz);
  return [W / 2 + (wx - WORLD_W / 2) * p * XK,
          FAR_Y + (BOT - FAR_Y) * pnorm(p) - (alt || 0) * p * XK * ALTK, p];
}
const gyAt = wz => FAR_Y + (BOT - FAR_Y) * pnorm(persp(wz));
function unproj(sx, sy) {
  const n = clamp((sy - FAR_Y) / (BOT - FAR_Y), 0, 1);
  const p = P_MIN + n * (1 - P_MIN);
  return [(sx - W / 2) / (p * XK) + WORLD_W / 2, (1 / p - 1) / PERSP];
}
function layout() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth || 1; H = cv.clientHeight || 1;
  cv.width = W * DPR; cv.height = H * DPR;
  mainCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
  HZ = H * .19; FAR_Y = HZ + 14; BOT = H * .97;
  XK = W / WORLD_W * 1.12;
  const m = Math.min(W, H * 2.4);
  SIZEK = m < 520 ? .92 : (m < 760 ? 1.18 : (m < 1100 ? 1.44 : 1.66));
  paper = null; scars = null;
  if (typeof view !== 'undefined') clampView();
}

/* ══════════════════════════ 视图：滚轮缩放 / 中键拖动 ══════════════════════════
   纯屏幕空间的变换 —— 世界坐标、透视、模拟逻辑一概不碰。放大只是把画好的
   这张纸凑近了看，所以战局不会因为你在看哪儿而有任何不同。
   钳制保证画面永远铺满：缩放下限是 1，平移不许把纸拖出边框露白。 */
const view = { k: 1, x: 0, y: 0 }, VIEW_MAX = 6;
let pan = null;
function clampView() {
  view.k = clamp(view.k, 1, VIEW_MAX);
  view.x = clamp(view.x, W - W * view.k, 0);
  view.y = clamp(view.y, H - H * view.k, 0);
  const z = $('zoom');
  if (z) { z.classList.toggle('on', view.k > 1.02); const b = $('zlvl'); if (b) b.textContent = '×' + view.k.toFixed(1); }
}
function zoomAt(mx, my, mul) {
  const k0 = view.k;
  view.k = clamp(view.k * mul, 1, VIEW_MAX);
  /* 以光标为锚点：缩放前后，光标底下的那一点不动 */
  view.x = mx - (mx - view.x) * (view.k / k0);
  view.y = my - (my - view.y) * (view.k / k0);
  clampView();
}
function resetView() { view.k = 1; view.x = view.y = 0; clampView(); }

/* 触屏没有滚轮也没有中键：两指捏合缩放、两指平移。第二根手指一落下就
   停笔，免得缩放的时候顺手画出一串部队 */
const ptrs = new Map();
let pinch = null;
const ptrMid = () => {
  let x = 0, y = 0; for (const p of ptrs.values()) { x += p.x; y += p.y; }
  return [x / ptrs.size, y / ptrs.size];
};
const ptrSpan = () => {
  const a = [...ptrs.values()];
  return a.length < 2 ? 0 : Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
};
function pinchStart() {
  const r = cv.getBoundingClientRect(), m = ptrMid();
  pinch = { span: ptrSpan(), mx: m[0] - r.left, my: m[1] - r.top, k: view.k, vx: view.x, vy: view.y };
}
function pinchMove() {
  if (!pinch || ptrs.size < 2 || pinch.span < 8) return;
  const r = cv.getBoundingClientRect(), m = ptrMid();
  const mx = m[0] - r.left, my = m[1] - r.top;
  /* 先按捏合比例围绕起始中心缩放，再补上两指中心自己的位移 */
  const k = clamp(pinch.k * (ptrSpan() / pinch.span), 1, VIEW_MAX);
  view.k = k;
  view.x = pinch.mx - (pinch.mx - pinch.vx) * (k / pinch.k) + (mx - pinch.mx);
  view.y = pinch.my - (pinch.my - pinch.vy) * (k / pinch.k) + (my - pinch.my);
  clampView();
}

function applyRot() {
  const r = document.getElementById('rot'), on = document.body.classList.contains('ls');
  if (on) {
    r.style.width = window.innerHeight + 'px';
    r.style.height = window.innerWidth + 'px';
    r.style.transform = 'translate(' + window.innerWidth + 'px,0) rotate(90deg)';
  } else { r.style.width = r.style.height = r.style.transform = ''; }
  layout();
}
window.addEventListener('resize', applyRot);
window.addEventListener('orientationchange', () => setTimeout(applyRot, 120));

/* ══════════════════════════ 武器表 ══════════════════════════
   武器是独立的东西，一个单位挂 1-2 门，各有射程/装填/弹药。
   开火时按"对当前目标的单位时间有效伤害"自动挑一门。
   vs[对装甲,对软] · acc 基础精度 · supp 压制力（火力压人不用命中）
   溅射武器不判命中；ammo 只给机载武器                              */
const WPN = {
  rifle:    { name:['Rifle','步枪'], m:[['M16A2','M16A2'],['AK-74','AK-74']],      proj:'bullet', dmg:5,  rng:105, rof:.50, hits:'ga', vs:[.45,6.3],   acc:.68, supp:.07 },

const K = WORLD_W / 800;
const ROF_K = 1.9;          // 装填时间统一放慢，让每一发看得清、血条掉得住
/* 观赏性的关键不是把射速调到没动静，而是让单位活得住：
   弹药照样密集横飞，但一照面死不了，双方才会缠在一起打。 */
const TOUGH = 2.8;
for (const n in WPN) {
  const w = WPN[n];
  w.id = n; w.rng *= K;
  if (w.splash) w.splash *= K;
  w.minRng = (w.minRng || 0) * K;      // 导弹有最小射程，贴身了只能用机炮 → 逼出缠斗
  if (w.acc === undefined) w.acc = 1;
  if (w.supp === undefined) w.supp = .1;
  w.supp *= 2.4;            // 兵力压到 17 后交火更散，压制力再补一档
  w.rof *= ROF_K;           // 全局装填倍率：射速太快看不清单发，整体放慢
}
for (const k in UNITS) {
  const d = UNITS[k];
  d.key = k; d.spd *= K;
  d.hp = Math.round(d.hp * TOUGH);
  if (d.hold) d.hold *= K;
  d.ws = d.w.map(n => WPN[n]);
  const rs = d.ws.map(w => w.rng);
  d.rngMax = rs.length ? Math.max.apply(null, rs) : 0;
  d.rngMin = rs.length ? Math.min.apply(null, rs) : 0;
  d.hitAny = (d.ws.some(w => w.hits.indexOf('g') >= 0) ? 'g' : '') +
             (d.ws.some(w => w.hits.indexOf('a') >= 0) ? 'a' : '');
  d.dps = d.ws.reduce((s, w) => s + w.dmg * (w.burst || 1) / w.rof, 0);
  d.hasAmmo = d.ws.some(w => w.ammo !== undefined);
  /* 派生性格，不再逐个手写：
     · 抗压制：铁皮里的人比露天的沉得住气
     · 撤退阈值：支援车最先溜，装甲最后退，飞机不撤（走返航）
     · 突击性：射程短的自然得贴上去打，远程的留在后面 */
  d.morale = d.armor ? 1.6 : 1;
  /* 工事没有"撤下来整补"这回事：留着 grit 它会血少了就停火装死 */
  d.grit = (d.layer === 'a' || d.static) ? 0 : (d.support ? .5 : (d.armor ? .2 : .3));
  d.aggr = !!d.aggr;                      // 显式标记：主武器是近战的才顶上去
  if (d.layer === 'a' && !d.wing) d.wing = 'fixed';   // 只有旋翼能悬停
}

/* works = 地图预设的工事（壕沟 / 碉堡），只有步兵用得上，车辆照常开过去。
   弹坑不再算掩体 —— 那是打出来的坑，不该等于修好的阵地 */
let units = [], projs = [], fx = [], wrecks = [], smokes = [], works = [];

/* 预备队：自动增援每补一个就扣一个，扣光了这一方就再也变不出兵来。
   没有它的话，战力跌破 45% 的兜底会一直补，你把对手压得越死它补得越凶，
   结果就是永远打不完（Nate 踩到的正是这个）。玩家手画的部队不占这个额度。 */
let reserve = [150, 150], reserve0 = 150;
try {
  const q = +(new URLSearchParams(location.search).get('reserve'));
  if (q >= 10 && q <= 999) { reserve = [q, q]; reserve0 = q; }
} catch (e) { }
/* 每方目标编制。默认 17 是"看得清谁在打谁"的值；
   ?units=40 之类可以摆出大军对峙的场面（截图、演示用） */
let FIELD_TARGET = clamp(+(new URLSearchParams(location.search).get('units') || 17), 4, 60);

/* ══════════════════════════ 纸 & 伤痕层 ══════════════════════════ */
let paper = null, scars = null, scarFade = 0;
function drawPaper() {
  if (!paper || paper.width !== cv.width || paper.grid !== showGrid) {
    paper = document.createElement('canvas');
    paper.width = cv.width; paper.height = cv.height; paper.grid = showGrid;
    const p = paper.getContext('2d');
    p.setTransform(DPR, 0, 0, DPR, 0, 0);
    p.fillStyle = '#f6f2e4'; p.fillRect(0, 0, W, H);
    p.strokeStyle = '#bfd5e9'; p.lineWidth = 1;
    for (let y = 28; y < H; y += 28) {
      p.beginPath();
      for (let x = 0; x <= W; x += 22) p.lineTo(x, y + Math.sin(x * .012 + y) * .7);
      p.stroke();
    }
    p.globalAlpha = .4;
    for (let x = 28; x < W; x += 28) { p.beginPath(); p.moveTo(x, 0); p.lineTo(x, H); p.stroke(); }
    p.globalAlpha = 1;
    p.strokeStyle = '#e0a3a3'; p.lineWidth = 1.4;
    p.beginPath(); p.moveTo(46, 0); p.lineTo(46, H); p.stroke();
    p.fillStyle = 'rgba(120,105,80,.05)';
    for (let i = 0; i < 900; i++) p.fillRect(Math.random() * W, Math.random() * H, 1.4, 1.4);

    ctx = p; seed(11); ctx.lineCap = 'round';
    ctx.strokeStyle = '#c6bda6'; ctx.lineWidth = 1.4;
    let mx = -60;
    while (mx < W + 40) {
      const wd = clamp(rnd(220, 400) * (W / 1100), 70, 420), hg = rnd(34, 78) * clamp(W / 1100, .6, 1);
      rpoly([[mx, HZ], [mx + wd * .3, HZ - hg * .55], [mx + wd * .46, HZ - hg],
             [mx + wd * .68, HZ - hg * .5], [mx + wd, HZ]], false, 2.4);
      mx += wd * .82;
    }
    ctx.strokeStyle = '#8a8271'; ctx.lineWidth = 1.6;
    rline(0, HZ, W, HZ, 1.8);
    if (showGrid) {
      ctx.strokeStyle = 'rgba(115,138,170,.4)'; ctx.lineWidth = 1;
      for (let wx = 0; wx <= WORLD_W; wx += 100) {
        const a = proj(wx, 0, 0), b = proj(wx, 1, 0);
        rline(a[0], a[1], b[0], b[1], 1.3);
      }
      for (let i = 0; i <= 10; i++) {
        const a = proj(0, i / 10, 0), b = proj(WORLD_W, i / 10, 0);
        rline(a[0], a[1], b[0], b[1], 1.3);
      }
    }
    ctx.strokeStyle = '#8d8a6d'; ctx.lineWidth = 1.1;
    for (let i = 0; i < 150; i++) {
      const q = proj(sr() * WORLD_W, sr(), 0), sc = scaleAt(q[2]);
      rline(q[0], q[1], q[0] + (sr() - .5) * 6 * sc, q[1] - (4 + sr() * 7) * sc, 1);
    }
    ctx = mainCtx;
  }
  mainCtx.drawImage(paper, 0, 0, W, H);
  if (!scars) {                                  // 伤痕层：弹坑一发发涂上去，永久留在纸上
    scars = document.createElement('canvas');
    scars.width = cv.width; scars.height = cv.height;
    scars.getContext('2d').setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  mainCtx.drawImage(scars, 0, 0, W, H);
}
/* 在伤痕层上戳一个弹坑 */

/* ══════════════════════════ 生成 ══════════════════════════ */
function spawn(side, key, wx, wz) {

    ws: d.ws.map(w => ({ d: w, cd: rnd(0, w.rof), ammo: w.ammo === undefined ? Infinity : w.ammo })),
    fuel: d.fuel || 0, rtb: 0, fk: '',

  if (air > 0 && myAD / mt < .12 && r < .55) return pick(['aa','sam','fig','ifv']);

  if (armor / tot > .34 && r < .6) return pick(['atgm','heli','tank','drone','atgm']);

                'arty','supply','medic','fig','heli','atk'];    // 开局就别摆太满
  plan.forEach(k => {
    spawn(0, k, rnd(20, WORLD_W * .26), rnd(.05, .95));
    spawn(1, k, rnd(WORLD_W * .74, WORLD_W - 20), rnd(.05, .95));

     摆在纵深里没用 —— 实测那样机枪一局都够不着战线，碉堡就是块挨打的水泥 */
  for (let i = 0; i < 2; i++) {

  works.length = 0;

  for (let i = 0; i < 4; i++)

}

/* ══════════════════════════ 音效 ══════════════════════════ */
let AC = null, master = null, recent = [];
/* 一堆单位同时阵亡时，十几个爆炸声叠在一起就会削波破音（胜利那一刻最典型，
   因为最后一批往往是被同一发奇观一次清掉的）。三道保险：
   压缩器兜住峰值、150ms 内最多放 4 个爆炸、单发音量也压低一档。 */

    const comp = AC.createDynamicsCompressor();
    comp.threshold.value = -20; comp.knee.value = 14; comp.ratio.value = 14;
    comp.attack.value = .003; comp.release.value = .15;

}
/* 还是同一支笔画出来的电子音，只是按弹种分了几种口音：步枪脆、高炮闷一档、
   火炮往下沉、火箭是噪声上扫的"咻"、航弹是掉下去的哨音。 */
const TONE = {          /* 波形          起频   止频  时长  音量 */
  shot:   ['square',     980, 170, .07, .028],   // 步枪机枪：短促一声
  flak:   ['square',     520, 120, .11, .030],   // 高炮：低一档、拖长一点
  cannon: ['sawtooth',   240,  55, .22, .038],   // 火炮坦克炮：闷着往下沉
  drop:   ['triangle',   880, 190, .42, .020],   // 航弹：投下去的下滑哨音
  ric:    ['triangle',  1800, 600, .17, .035],   // 跳弹
  pew:    ['sawtooth',   380, 150, .18, .028],   // 兜底：老的那个声音
};
const FIRE_SND = { bullet: 'shot', flak: 'flak', shell: 'cannon',
                   rocket: 'rocket', bomb: 'drop', drop: 'drop' };

function noiseBuf(ac, sec, pow) {
  const n = (44100 * sec) | 0, b = ac.createBuffer(1, n, 44100), ch = b.getChannelData(0);
  for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, pow);
  const s = ac.createBufferSource(); s.buffer = b; return s;
}

    if (recent.length >= 4) return;              // 这一瞬间已经够吵了，再叠只会破音
    recent.push(t);

    g.connect(master);
    if (type === 'boom' || type === 'boomL') {
      /* 重炮和航弹落地是"轰"，火箭弹手雷这种小溅射是"啪" —— 差在低通扫到多低、拖多长 */

      const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.6;
      f.frequency.setValueAtTime(320, t);

      g.gain.exponentialRampToValueAtTime(.05, t + .05);
      g.gain.exponentialRampToValueAtTime(.001, t + .3);

/* ══════════════════════════ 战斗：查询 ══════════════════════════ */
const canHit = (a, b) => a.d.hitAny.indexOf(b.d.layer) >= 0;
/* 装甲有两级：armor 1 = 飞机和轻装甲车辆，armor 2 = 坦克这类重甲。

   0.7 才打得动空战，代价是它顺手也能凿穿坦克。vsH 把重甲单拎出来，缺省

function findTarget(u) {
  let best = null, bd = 1e18;

    if (v.side === u.side || v.hp <= 0 || !canHit(u, v)) continue;
    const d = dist3(u, v);

  }

}
function findAnchor(u) {
  let best = null, bd = 1e18;
  for (const v of units) {
    if (v.side === u.side || v.hp <= 0 || v.d.layer !== 'g') continue;
    const d = Math.abs(v.wx - u.wx) + Math.abs(v.wz - u.wz) * DEPTH * .5;

    if (W.hits.indexOf(t.d.layer) < 0) continue;
    /* 航弹是垂直丢下去的：射程只算水平投放距离。原来把飞行高度也算进

    if (dw > W.rng || dw < W.minRng) continue;

    if (!t.d.armor && W.vs[0] / W.vs[1] > 2) eff *= .45;   // 反装甲弹别去点步兵
    if (W.splash) {                                        // 溅射弹按目标周围人堆加权

  for (const w of works) {

/* 找最近的可用工事：碉堡防护好，给它一点"值得多跑几步"的优惠 */
function nearestWork(u, maxD) {
  let best = null, bd = maxD;
  for (const w of works) {
    if (w.kind === 'bunker' && w.users.length >= w.cap) continue;
    const d = Math.hypot(u.wx - w.wx, (u.wz - w.wz) * DEPTH) * (w.kind === 'bunker' ? .7 : 1);

function pushLog(txt) {

  el.innerHTML = logs.map((t, i) => '<div style="opacity:' + (1 - i * .18) + '">' + t + '</div>').join('');

/* ══════════════════════════ 战斗：主更新 ══════════════════════════ */
function update(dt) {
  tick += dt;
  /* 弹坑随时间渐隐：每隔一会儿把整块伤痕层擦掉一点 alpha，
     老坑被擦的次数多、先淡去，新坑还清楚 */
  scarFade += dt;
  if (scarFade > 1.2 && scars) {
    scarFade = 0;
    const c = scars.getContext('2d');
    c.save();
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.globalCompositeOperation = 'destination-out';
    c.fillStyle = 'rgba(0,0,0,.055)';
    c.fillRect(0, 0, scars.width, scars.height);
    c.restore();
  }
  for (const id in cmdCd) if (cmdCd[id] > 0) cmdCd[id] = Math.max(0, cmdCd[id] - dt);
  for (let i = shells.length - 1; i >= 0; i--) {     // 跟着模拟时钟的延迟队列
    shells[i].t -= dt;
    if (shells[i].t <= 0) { shells[i].fn(); shells.splice(i, 1); }
  }
  evTimer -= dt;                                     // 战场奇观：自己会来，不用你操作
  if (evTimer <= 0) { evTimer = rnd(60, 105); runSpectacle(); }

  if (autoRe) {
    reTimer -= dt;
    if (reTimer <= 0) {
      /* 波动平衡：不把双方死死锁在 50:50，让优势像潮水一样在两边来回 ——
         一方攻势推进一阵，再被扳回来。只有落后到快崩盘时才强力兜底。 */
      reTimer = 1.15;
      const TARGET = FIELD_TARGET;
      let nb = 0, nr = 0;
      /* 碉堡不算进这个额度：它是阵地，不是能拉上去顶线的部队。
         算进去的话画几座碉堡就等于把自己的增援卡死 */
      for (const u of units) { if (u.d.static) continue; u.side === 0 ? nb++ : nr++; }
      const cap = [nb, nr];
      const pw = [power(0), power(1)];
      const weak = pw[0] <= pw[1] ? 0 : 1;
      const ratio = Math.max(1, Math.min(pw[0], pw[1])) / Math.max(1, Math.max(pw[0], pw[1]));

      const tide = Math.sin(tick * .055);                  // 一个来回约 110 游戏秒
      const favored = tide > 0 ? 0 : 1;
      const sway = Math.abs(tide);
      if (favored !== lastFavored && sway > .35) {
        lastFavored = favored;
        pushLog(L(SIDE_NAME[favored]) + T('lgInit'));
      }
      for (let s = 0; s < 2; s++) {
        if (cap[s] >= TARGET) continue;
        /* 下风的一方补得慢些，于是战线会被推着走 */
        if (s === favored || Math.random() > sway * .6) reinforce(s);
      }
      if (ratio < .45 && cap[weak] < TARGET + 8) {         // 快打崩了才强力兜底
        reinforce(weak); reinforce(weak);
      }
    }
  }

  for (const u of units) {
    if (u.hp <= 0) continue;
    const air = u.d.layer === 'a';
    u.flash = Math.max(0, u.flash - dt * 4);
    if (u.dropping) {                                  // 挂在伞上飘下来，这期间打不了也挨不着压制
      u.alt -= 52 * dt;
      u.wx += Math.sin(tick * .55 + u.sd) * 11 * dt;   // 随风摆
      u.sup = 0;
      if (u.alt <= 0) {
        u.alt = 0; u.dropping = 0;
        fx.push({ k: 'chute', wx: u.wx, wz: u.wz, alt: 0, t: 0, dur: 9, sd: u.sd });
      }
      continue;
    }
    u.boost = Math.max(0, u.boost - dt);
    /* 工事里压制退得快，碉堡里最踏实 */
    u.sup = Math.max(0, u.sup - dt * (u.cover ? (u.cover.kind === 'bunker' ? .42 : .28) : .15));
    u.retgt -= dt;

    /* 卧倒：压制到一定程度步兵就趴下不动了（装甲车辆不趴） */
    if (!air && !u.d.armor) u.prone = u.sup > .75 ? Math.min(1, u.prone + dt * 4) : Math.max(0, u.prone - dt * 2);

    if (u.retgt <= 0 || !u.tgt || u.tgt.hp <= 0) {
      u.tgt = findTarget(u);
      if (!air) { u.anc = findAnchor(u); u.cover = usesCover(u) ? inWork(u) : null; }
      u.retgt = .3 + Math.random() * .3;
    }
    const t = u.tgt, fwd = u.side === 0 ? 1 : -1;
    const frac = u.hp / u.max;

    /* 伤重后撤：退到后方整补，缓回血，好了再上。老兵更早开溜（会保命） */
    if (!air && u.d.grit > 0) {
      const th = u.d.grit * (1 + u.rank * .22);
      if (u.mode === 0 && frac < th) { u.mode = 1; if (u.rank) pushLog(L(SIDE_NAME[u.side]) + ' ' + L(u.d.name) + T('lgRegroup')); }
      if (u.mode === 1) {
        u.hp = Math.min(u.max, u.hp + u.max * (u.medicated ? .085 : .035) * dt);
        if (frac > .72) u.mode = 0;

    }
    u.medicated = 0;
    /* 奇观拉上来的部队打完就撤 —— 它们是来做一件事的，不是来常驻的 */
    if (u.leave > 0) { u.leave -= dt; if (u.leave <= 0 && u.mode !== 1) u.mode = 2; }

    /* 装甲损伤：血少了先断履带、再卡炮塔，一路冒烟 */
    const hurtTrack = u.d.armor && frac < .45, hurtTurret = u.d.armor && frac < .25;
    if (frac < .55) u.smokeT += dt; else u.smokeT = 0;

    let sp = u.d.spd * (1 - u.sup * .55) * (u.boost ? 1.45 : 1);
    if (hurtTrack) sp *= .45;
    /* 匍匐速度：趴下后常规推进停了，但爬向工事还得能爬 —— 不然被压制的
       步兵原地趴着永远进不了掩体（这个死锁实测撞到过） */
    const crawl = u.d.spd * (1 - u.sup * .3) * .75;
    if (u.prone > .5) sp = 0;

    if (air) {
      /* ── 空中 ── */
      u.ph += dt;
      /* fuel 0 = 不吃油（系留气球这类），别把它判成"油尽返航"飘出地图 */
      if (!u.d.suicide && u.d.fuel) {
        u.fuel -= dt;
        if (!u.rtb && (u.fuel <= 0 || outOfAmmo(u))) {
          u.rtb = 1;
          pushLog(L(SIDE_NAME[u.side]) + ' ' + L(u.d.name) + (u.fuel <= 0 ? T('lgFuel') : T('lgAmmo')));
        }
      }
      if (u.rtb) {
        const home = u.side === 0 ? -220 : WORLD_W + 220;
        u.wx += Math.sign(home - u.wx) * sp * dt * 1.1;
        u.alt += (u.d.alt * 1.35 - u.alt) * dt * .8;
        if (u.wx < -190 || u.wx > WORLD_W + 190) { u.hp = 0; u.silent = 1; u.noloss = 1; }
      } else if (u.d.suicide) {
        if (t) {
          /* 自杀弹要真撞上去，三个方向都得收敛（wz 记得换算成世界单位再折回） */
          const d = dist3(u, t) || 1;
          u.wx += (t.wx - u.wx) / d * sp * dt;
          u.wz += (t.wz - u.wz) * DEPTH / d * sp * dt / DEPTH;
          u.alt += ((t.alt || 0) - u.alt) / d * sp * dt;
          if (dist3(u, t) < 30 * K) { detonate(u); continue; }
        } else { u.wx += fwd * sp * dt; u.alt += (u.d.alt - u.alt) * dt; }
        if (u.wx < -160 || u.wx > WORLD_W + 160) { u.hp = 0; u.silent = 1; u.noloss = 1; }
      } else {
        const dist = t ? dist3(u, t) : 1e18;
        /* 咬地面目标就压下去飞：既进得了射程，也才像在俯冲 */
        const wantAlt = !t ? u.d.alt : (t.d.layer === 'a' ? t.alt : u.d.alt * .5);
        if (u.d.wing === 'rotor') {
          /* ── 旋翼：可以悬停，可以倒着退，稳稳吊在射程上打 ── */
          if (t) {
            const d = dist || 1, ux = (t.wx - u.wx) / d, uz = (t.wz - u.wz) * DEPTH / d;
            if (dist > u.d.rngMin * .85) { u.wx += ux * sp * dt; u.wz += uz * sp * dt / DEPTH; }
            else if (dist < u.d.rngMin * .35) u.wx -= ux * sp * dt * .6;
            else u.wz += uz * sp * dt * .3 / DEPTH;
          } else u.wx += fwd * sp * dt * .5;
        } else if (u.d.loiter && t && dist < u.d.rngMax * .95) {
          /* ── 察打无人机：吊在目标头上绕圈盘旋 ── */
          u.orb = (u.orb === undefined ? Math.random() * 6.3 : u.orb) + dt * .55;
          const R = u.d.rngMax * .62;
          u.wx += (t.wx + Math.cos(u.orb) * R - u.wx) * Math.min(1, dt * 1.2);
          u.wz += (t.wz + Math.sin(u.orb) * R * .5 / DEPTH - u.wz) * Math.min(1, dt * 1.2);
        } else if (t) {
          /* ── 固定翼：切进射程，然后在射程上小幅前后游弋 ──
             用正弦驱动而不是"飞过头就脱离"的状态机：允许速度过零点
             （也就是允许短暂静止），代码简单、不会卡死。
             注意水平推进不能写成 (t.wx-u.wx)/dist * sp —— dist 是三维的，
             飞机有高度，水平距离趋零时速度会渐近归零，飞机就钉在目标
             头顶不动了（这个 bug 实测抓到过） */
          const dz = t.wz - u.wz;
          if (t.d.layer === 'a') {
            /* ── 空中缠斗：咬住对手尾巴，而不是擦身而过 ──
               双方都往对方身后钻，自然绞成互相追逐的圆圈 */
            const bx = t.wx - t.face * 78 * K;                // 目标屁股后面
            const cs = sp * (dist < u.d.rngMin ? .62 : 1);    // 绞在一起就减速盘旋
            u.wx += Math.sign(bx - u.wx) * cs * dt;
            u.wz += Math.sign(dz) * Math.min(Math.abs(dz), cs * dt * .7 / DEPTH);
          } else {
            /* ── 对地：来回攻击航线 ──
               阶段由"本段剩余航程"推进，不看与目标的相对位置：目标自己
               也在跑，靠相对位置判断"是否飞过头"在相向交错时永远判不出来，
               飞机就卡在原地了（前几版栽的就是这个坑） */
            if (u.leg <= 0) {
              if (u.egress) {                                 // 拉开完了 → 掉头再进入
                u.egress = 0;
                u.face = t.wx > u.wx ? 1 : -1;
                u.leg = Math.abs(t.wx - u.wx) + 90 * K;       // 冲到目标并穿过去
              } else {                                        // 打完这一趟 → 脱离
                u.egress = 1;
                u.leg = 250 * K;
              }
            }
            u.leg -= sp * dt;
            u.wx += u.face * sp * dt;                         // 恒速，从不停
            if (!u.egress) u.wz += Math.sign(dz) * Math.min(Math.abs(dz), sp * dt * .5 / DEPTH);
            if (u.wx < 70 || u.wx > WORLD_W - 70) u.leg = 0;  // 撞到图边就结束本段
          }
        } else u.wx += fwd * sp * dt;                         // 没目标也得往前飞
        u.alt += (wantAlt - u.alt) * Math.min(1, dt * 1.4) + Math.sin(u.ph * 1.6 + u.sd) * 14 * dt;
        u.wx = clamp(u.wx, -180, WORLD_W + 180);
      }
      u.alt = clamp(u.alt, 18, 360);
    } else if (u.mode === 2) {
      /* ── 归建：任务完成，走出地图边缘就算收队，不记作损失 ── */
      const home = u.side === 0 ? -70 : WORLD_W + 70;
      u.wx += Math.sign(home - u.wx) * sp * dt * 1.3;
      if (u.wx < -60 || u.wx > WORLD_W + 60) { u.hp = 0; u.silent = 1; u.noloss = 1; }
    } else if (u.mode === 1) {
      /* ── 撤退整补：往自家后方退 ── */
      const home = u.side === 0 ? 40 : WORLD_W - 40;
      if (Math.abs(u.wx - home) > 30) u.wx += Math.sign(home - u.wx) * sp * dt;
    } else {
      /* ── 地面推进：停在自己最远武器的射程上；被压制/趴下就别动 ── */
      let ck = null;
      if (u.bunker) {
        /* 进驻碉堡：钉在射击孔后面不动，火力一停就出来继续推进 */
        u.wx = u.bunker.wx + ((u.slot || 0) - (u.bunker.cap - 1) / 2) * 15 * K;
        u.wz = u.bunker.wz;
        if (u.sup < .12) leaveBunker(u);
      } else if (usesCover(u) && u.sup > .4 && !u.cover) ck = nearestWork(u, 190 * K);
      if (u.bunker) { /* 不动 */ }
      else if (ck) {
        /* 步兵吃到火力，先往最近的壕沟/碉堡里钻，不硬顶着推进 */
        const dx = ck.wx - u.wx, dz = (ck.wz - u.wz) * DEPTH, d = Math.hypot(dx, dz) || 1;
        if (ck.kind === 'bunker' && d < ck.r && ck.users.length < ck.cap) {
          u.slot = ck.users.length;                // 并排站进射击孔
          ck.users.push(u.id); u.bunker = ck;
        } else {
          u.wx += dx / d * crawl * dt * 1.25;
          u.wz += dz / d * crawl * dt * .8 / DEPTH;
        }
      } else {
        /* 突击兵种顶到近距离打，支援/炮兵才吊在最远射程上 —— 不然
           大家都停在射程边缘远远对射，永远缠不起来 */
        const a = u.anc;
        const stop = (u.d.hold || (u.d.aggr ? u.d.rngMin * .5 : u.d.rngMax * .9)) * u.st;
        if (a) {
          const dx = a.wx - u.wx, dz = (a.wz - u.wz) * DEPTH, d = Math.hypot(dx, dz) || 1;
          if (d > stop) { u.wx += dx / d * sp * dt; u.wz += dz / d * sp * dt * .22 / DEPTH; }
        } else u.wx += fwd * sp * dt;
      }
      u.wx = clamp(u.wx, 8, WORLD_W - 8);
    }
    u.wz = clamp(u.wz, .02, .98);

    /* 炮口指向：算出仰角，高炮对天、坦克平射，一眼看得出在打谁 */
    if (t) {
      const dh = (t.alt || 0) + (t.d.layer === 'g' ? t.d.h * .5 : 0) - (u.alt || 0);
      const want = clamp(Math.atan2(dh * 1.15, Math.max(40, distG(u, t))), -.12, 1.32);
      u.aimEl += (want - u.aimEl) * Math.min(1, dt * 3.4);
    } else u.aimEl += (.12 - u.aimEl) * Math.min(1, dt * 1.6);

    /* 掉头（固定翼脱离途中保持航向，不许原地扭头） */
    let wantFace = u.face;
    const onRun = u.d.wing === 'fixed' && t && t.d.layer === 'g' && !u.rtb;
    if (u.d.static) wantFace = fwd;             // 射孔朝哪边是浇进混凝土里的，不会转
    else if (u.rtb || u.mode === 1) wantFace = u.side === 0 ? -1 : 1;
    else if (onRun) wantFace = u.face;          // 对地航线自己管朝向，别在这儿扭头
    else if (t && Math.abs(t.wx - u.wx) > 25) wantFace = t.wx > u.wx ? 1 : -1;
    else if (!t) wantFace = fwd;
    if (wantFace !== u.face) u.turnT = .4;                    // 翻面 → 短暂横滚
    u.face = wantFace;
    u.turnT = Math.max(0, (u.turnT || 0) - dt);

    /* 别叠成一坨。工事是钉在地上的，位移全算到活动的那一边 */
    for (const v of units) {
      if (v === u || v.hp <= 0 || v.d.layer !== u.d.layer) continue;
      if (u.bunker || v.bunker) continue;          // 碉堡里的别被顶出去
      if (u.d.static && v.d.static) continue;      // 两座工事各占各的地
      const dx = v.wx - u.wx, dz = (v.wz - u.wz) * DEPTH, da = (v.alt || 0) - (u.alt || 0);
      const md = air ? 78 : 50;      // 单位画大了，间距跟着放开，不然更挤
      if (Math.abs(dx) < md && Math.abs(dz) < md * .8 && Math.abs(da) < 45) {
        const push = (md - Math.abs(dx)) * dt * 1.9 * (dx > 0 ? -1 : 1);
        const ku = u.d.static ? 0 : (v.d.static ? 2 : 1), kv = v.d.static ? 0 : (u.d.static ? 2 : 1);
        u.wx += push * ku; v.wx -= push * kv;
        const pz = (md * .8 - Math.abs(dz)) * dt * 1.1 * (dz > 0 ? -1 : 1) / DEPTH;
        u.wz = clamp(u.wz + pz * ku, .02, .98); v.wz = clamp(v.wz - pz * kv, .02, .98);
      }
    }

    /* ── 支援单位：补给车解压制+快装填，医疗兵治伤员 ── */
    if (u.d.support) {
      u.suppT = (u.suppT || 0) + dt;
      if (u.suppT > .5) {
        u.suppT = 0; u.link = null;
        let best = null, bd = 1e18;
        for (const v of units) {
          if (v.side !== u.side || v.hp <= 0 || v === u || v.d.layer === 'a') continue;
          const d = distG(u, v);
          if (d > 190 * K) continue;
          const need = u.d.support === 'medic' ? (1 - v.hp / v.max) : v.sup;
          if (need > .12 && d < bd) { bd = d; best = v; }
        }
        u.link = best;
      }
      if (u.link && u.link.hp > 0) {
        if (u.d.support === 'medic') {
          u.link.hp = Math.min(u.link.max, u.link.hp + u.link.max * .05 * dt);
          u.link.medicated = 1;
        } else {
          u.link.sup = Math.max(0, u.link.sup - dt * 1.1);
          u.link.resupplied = 1;
        }
      }
    }

    /* ── 开火 ── */
    const supRof = 1 + u.sup * 1.6;
    const rofMul = supRof * RANK_ROF[u.rank] * (hurtTurret ? 1.9 : 1) *
                   (u.boost ? .7 : 1) * (u.resupplied ? .85 : 1) * (u.prone > .5 ? 1.35 : 1);
    u.resupplied = 0;
    for (const w of u.ws) if (w.cd > 0) w.cd -= dt;
    if (t && !u.d.suicide && !u.rtb && u.mode === 0 && !u.egress) {   // 脱离途中背对目标，不开火
      const wp = pickWeapon(u, t, dist3(u, t));
      if (wp) {
        wp.cd = wp.d.rof * rnd(.85, 1.15) * rofMul;
        if (wp.ammo !== Infinity) wp.ammo--;
        fire(u, t, wp);
      }
    }
  }

  /* 弹药飞行 */
  for (const p of projs) {
    if (p.delay > 0) { p.delay -= dt; continue; }
    p.life -= dt;
    p.pt = p.t;
    p.t += dt / p.dur;
    const tt = Math.min(1, p.t);
    p.wx = p.sx + (p.ex - p.sx) * tt;
    p.wz = p.sz + (p.ez - p.sz) * tt;
    p.alt = p.sa + (p.ea - p.sa) * tt + Math.sin(tt * Math.PI) * p.arc;
    if (p.trail) { p.trail.push(p.wx, p.wz, p.alt); if (p.trail.length > 33) p.trail.splice(0, 3); }
    if (p.t >= 1) { hit(p); p.dead = 1; }
    if (p.life <= 0) p.dead = 1;
  }
  projs = projs.filter(p => !p.dead);

  for (const f of fx) f.t += dt;
  fx = fx.filter(f => f.t < f.dur);
  for (const w of wrecks) w.t += dt;
  wrecks = wrecks.filter(w => w.t < w.life);
  for (const s of smokes) { s.t += dt; s.r = s.r0 * (.55 + .45 * Math.min(1, s.t / 1.6)); }
  smokes = smokes.filter(s => s.t < s.life);

  /* 死亡结算 */
  for (const u of units) {
    if (u.hp <= 0 && !u.done) {
      u.done = 1;
      leaveBunker(u);
      if (!u.noloss) lost[u.side]++;
      if (!u.silent) {
        const air = u.d.layer === 'a';
        wrecks.push({ wx: u.wx, wz: u.wz, alt: u.alt, d: u.d, side: u.side, sd: u.sd,
                      face: u.face, t: 0, life: air ? 1.4 : 3.6 });
        if (air) {
          boom(u.wx, u.wz, u.alt, 56);
          fx.push({ k: 'boom', wx: u.wx + rnd(-16, 16), wz: u.wz, alt: u.alt + rnd(-12, 16),
                    r: 36, t: -.16, dur: .46, sd: (Math.random() * 1e6) | 0 });
          fx.push({ k: 'debris', wx: u.wx, wz: u.wz, alt: u.alt, t: 0, dur: 1.25,
                    sd: (Math.random() * 1e6) | 0, n: 9 });
        } else {
          boom(u.wx, u.wz, u.alt, 32);
        }
        beep('boom');
        /* 战功记账：谁打死的，谁涨经验 */
        const kr = u.killer;
        if (kr && kr.hp > 0) {
          kr.kills++; kr.vet += u.d.armor ? 2 : 1;
          const nr = kr.vet >= 5 ? 2 : (kr.vet >= 2 ? 1 : 0);   // 缠斗后击杀变稀，门槛跟着降
          if (nr > kr.rank) {
            kr.rank = nr;
            pushLog(L(SIDE_NAME[kr.side]) + ' ' + L(kr.d.name) + T('lgPromote') + L(RANK_NAME[nr]));
          }
          pushLog(L(SIDE_NAME[kr.side]) + ' ' + (kr.rank ? L(RANK_NAME[kr.rank]) + ' ' : '') + L(kr.d.name) +
                  T('lgDestroy') + L(SIDE_NAME[u.side]) + ' ' + L(u.d.name));
        }
      }
    }
  }
  units = units.filter(u => u.hp > 0);

  if (!over && tick > 1.5) {
    let nb = 0, nr = 0;
    for (const u of units) u.side === 0 ? nb++ : nr++;
    /* 打光场上的、也打光预备队的，才算真的败了 */
    if (autoRe) { if (nb > 0 || reserve[0] > 0) nb = 1; if (nr > 0 || reserve[1] > 0) nr = 1; }
    if (nb === 0 || nr === 0) {
      over = true; running = false;
      const win = nb > 0 ? 0 : (nr > 0 ? 1 : -1);
      showBanner(win < 0 ? T('mutual') : L(SIDE_NAME[win]) + ' ' + T('wins'), win < 0 ? '#3b3a36' : SIDE_COL[win]);
    }
  }
}

/* ══════════════════════════ 开火与命中 ══════════════════════════ */
function fire(u, t, wp) {
  const W = wp.d, n = W.burst || 1;
  const d = W.proj === 'drop' ? distG(u, t) : dist3(u, t);
  for (let i = 0; i < n; i++) shoot(u, t, i * (W.proj === 'rocket' ? .16 : .09), d, W);
  u.flash = 1; u.fk = W.proj;
  beep(FIRE_SND[W.proj] || 'pew');
}
function shoot(u, t, delay, d3, W) {
  const k = W.proj, splash = W.splash || 0;
  const far = clamp((d3 || 0) / W.rng, 0, 1);
  let miss = false;
  if (!splash) {
    let acc = W.acc * (1 - .38 * far) * RANK_ACC[u.rank] * smokeCover(t);
    if (t.d.layer === 'a') acc *= (u.d.layer === 'g' ? .62 : .82);
    if (t.d.armor) acc *= 1.18;
    if (t.d.spd > 40 * K) acc *= .82;
    /* 缠在一起互相机动规避，谁也不好瞄 —— 让狗斗多绞几个回合 */
    if (t.d.layer === 'a' && u.d.layer === 'a' && (d3 || 0) < 110 * K) acc *= .7;
    if (u.sup > .3) acc *= 1 - u.sup * .35;         // 被压着打，手抖
    if (u.prone > .5) acc *= .82;
    if (t.cover) acc *= t.cover.kind === 'bunker' ? .52 : .72;   // 目标缩在工事里
    if (t.prone > .5) acc *= .78;                   // 趴着的人难打
    miss = Math.random() > clamp(acc, .08, .95);
  }
  const scatter = splash ? splash * .4 * (.55 + .8 * far) : (k === 'bullet' ? 12 : 8);
  let ex = t.wx + rnd(-scatter, scatter);
  let ez = t.wz + rnd(-scatter, scatter) / DEPTH;
  let ea = (t.alt || 0) + (t.d.layer === 'g' ? t.d.h * .5 : rnd(-8, 8));
  if (miss) {
    const off = 34 + far * 90;
    ex += rnd(-off, off); ez += rnd(-off, off) / DEPTH;
    ea += t.d.layer === 'a' ? rnd(-off, off) * .7 : rnd(0, off) * .5;
  }
  projs.push({
    kind: k, side: u.side, dmg: W.dmg, vs: W.vs, splash, supp: W.supp, owner: u,
    sx: u.wx + u.face * 18, sz: u.wz, sa: (u.alt || 0) + (u.d.layer === 'g' ? u.d.h * .6 : 0),
    ex, ez, ea, miss,
    wx: u.wx + u.face * 18, wz: u.wz, alt: (u.alt || 0) + (u.d.layer === 'g' ? u.d.h * .6 : 0),
    t: 0, pt: 0, delay: delay || 0, life: 8, col: SIDE_COL[u.side], sd: (Math.random() * 1e6) | 0,
    dur: k === 'bullet' || k === 'flak' ? .26 : (k === 'shell' ? .34 : (k === 'bomb' ? 1.0 : .62)),
    arc: k === 'bomb' ? 210 : (k === 'shell' ? 26 : (k === 'rocket' ? 30 : 0)),
    trail: k === 'rocket' ? [] : null,
  });
}
function detonate(u) {
  u.hp = 0; u.silent = 1; u.done = 1; lost[u.side]++;
  const W = u.ws[0].d;
  hit({ ex: u.wx, ez: u.wz, ea: u.alt, dmg: W.dmg, vs: W.vs, splash: W.splash,
        supp: W.supp, side: u.side, sd: u.sd, miss: 0, owner: null });
}
/* 造成伤害：装甲面前轻武器会跳弹（期望伤害不变，但看着有戏） */
function applyDamage(p, v) {
  let dmg;
  const am = v.d.armor ? armMul(p, v) : 1;
  if (v.d.armor && am < 1) {
    if (Math.random() > am) {                  // 打不穿 → 跳弹
      fx.push({ k: 'ric', wx: p.ex, wz: p.ez, alt: p.ea, t: 0, dur: .3, sd: p.sd });
      beep('ric');

/* ══════════════════════════ 显示比例 ══════════════════════════

   步兵画成蚂蚁，全都一样大又没有分量感。取 (真实高 / 1.8) 的 0.55 次方 ——
   坦克比人明显高一圈，攻城炮压得住场，步兵仍然看得清。

   每个单位画出来多大是一笔一笔手画的，难免参差（校准之前四个版本的坦克
   居然全都比步兵还矮）。所以启动时拿一个只记坐标的假 context 把每种单位
   描一遍，量出它实际占多高，再反算该缩放多少 —— 以后改画法也不用手动
   重算系数。sizeM 是"视觉占位高度"而不是严格的物理尺寸：骑兵举着长矛、

const SIZE_REF = 1.8, SIZE_POW = .55;
function calibrate() {
  const b = { x0: 1e9, y0: 1e9, x1: -1e9, y1: -1e9 };

    if (!isFinite(x) || !isFinite(y)) return;
    b.x0 = Math.min(b.x0, x); b.x1 = Math.max(b.x1, x);
    b.y0 = Math.min(b.y0, y); b.y1 = Math.max(b.y1, y);

    rect(x, y, w, h) { T(x, y); T(x + w, y + h); },
    get lineWidth() { return lw; }, set lineWidth(v) { lw = v; },

    const u = { d, ph: 1.1, flash: 0, prone: 0, aimEl: .15, hp: d.hp, max: d.hp, sd: 7,
      dropping: 0, face: 1, alt: d.alt || 0, wz: .5, wx: 0, side: 0, smokeT: 0,
      bunker: null, dmgTrack: 0, turnT: 0, rank: 0, leg: 0, egress: 0, fuel: 9, tgt: null };
    b.x0 = b.y0 = 1e9; b.x1 = b.y1 = -1e9; lw = 1.7;

    if (b.y1 - b.y0 > 1) H[k] = b.y1 - b.y0;
  }

     保持原样，只是把各兵种之间的相对比例摆正 */
  const base = H.inf;
  if (!base) return;
  for (const k of ALL) {

function drawUnit(u, alpha, dead) {
  const q = proj(u.wx, u.wz, u.alt || 0), sc = scaleAt(q[2]) * (u.d.gsc || 1);
  if (!dead || u.alt > 4) {
    const gy = gyAt(u.wz);
    ctx.save();
    ctx.globalAlpha = alpha * (u.alt > 4 ? .17 : .25);
    ctx.fillStyle = '#6b6455';
    ctx.beginPath(); ctx.ellipse(q[0], gy, 12 * sc, 3.2 * sc, 0, 0, 6.3); ctx.fill();
    if (u.alt > 30) {
      ctx.globalAlpha = alpha * .13;
      ctx.strokeStyle = '#6b6455'; ctx.lineWidth = 1;
      ctx.setLineDash([3, 4]);
      ctx.beginPath(); ctx.moveTo(q[0], q[1] + 2); ctx.lineTo(q[0], gy); ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.restore();
  }
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(q[0], q[1]);
  /* 固定翼掉头时把机身压扁一下，当作侧倾横滚看 */
  const roll = (u.turnT > 0 && u.d.wing === 'fixed') ? (1 - u.turnT / .4 * .72) : 1;
  ctx.scale((u.face < 0 ? -1 : 1) * sc, sc * roll);
  ctx.strokeStyle = dead ? '#8d8778' : SIDE_COL[u.side];
  ctx.lineWidth = 1.7 / sc;
  ctx.lineCap = 'round';
  seed(u.sd + ((tick * 5) | 0));
  u.dmgTrack = !dead && u.d.armor && u.hp / u.max < .45;
  const isRed = u.side === 1;
  (DRAW[u.d.key] || DRAW.inf)(u, isRed);
  /* 国籍星标：车体/机身上一颗五角星（太小就省了，免得糊成一团） */
  if (u.d.armor && sc > .95) {
    ctx.lineWidth = 1.1 / sc;
    star(u.d.layer === 'a' ? -4 : -7, u.d.layer === 'a' ? -1 : -8, 2.6, isRed);
  }
  if (!dead && u.flash > .45 && (u.fk === 'rocket' || u.fk === 'bomb')) {
    ctx.strokeStyle = '#9c9484'; ctx.lineWidth = 1.2 / sc;
    const y0 = u.d.layer === 'g' ? -u.d.h * .45 : 1;
    rcirc(-15, y0, 3.5 + u.flash * 3.5, 2.6);
    rcirc(-24, y0 - 3, 2.5 + u.flash * 2.5, 2.4);
  }
  ctx.restore();
  if (dead) return;

  /* 受创冒烟：一路飘上去 */
  if (u.smokeT > 0) {
    ctx.save(); seed(u.sd + 5);
    ctx.strokeStyle = '#8d8778'; ctx.lineWidth = 1.1;
    const n = u.hp / u.max < .25 ? 3 : 2;
    for (let i = 0; i < n; i++) {
      const ph = (u.smokeT * .8 + i * .34) % 1;
      ctx.globalAlpha = (1 - ph) * .42;
      rcirc(q[0] + (sr() - .5) * 8 * sc + ph * 5, q[1] - u.d.h * .7 * sc - ph * 34 * sc,
            (2.5 + ph * 7) * sc, 2.2);
    }
    ctx.restore();
  }

  if (u.link && u.link.hp > 0) {
    const b = proj(u.link.wx, u.link.wz, u.link.alt || 0);
    ctx.save();
    ctx.globalAlpha = .3; ctx.setLineDash([3, 5]);

function drawHP(u, q, sc) {

  ctx.fillStyle = u.mode === 1 ? '#4c8b5a' : (r > .5 ? SIDE_COL[u.side] : (r > .22 ? '#c98b1e' : '#c0392b'));
  ctx.fillRect(q[0] - w / 2, y, w * r, h);
  seed(u.sd);
  ctx.strokeStyle = 'rgba(59,58,54,.7)'; ctx.lineWidth = 1;
  rpoly([[q[0] - w / 2, y], [q[0] + w / 2, y], [q[0] + w / 2, y + h], [q[0] - w / 2, y + h]], true, .9);
  /* 压制条：血条正上方一道短横，压满就快趴了 */
  if (u.sup > .06) {
    ctx.globalAlpha = .85;
    ctx.fillStyle = '#8a5a2a';
    ctx.fillRect(q[0] - w / 2, y - 2.6, w * Math.min(1, u.sup), 1.7);
  }
  /* 油弹余量 */
  if (u.d.fuel) {
    let am = 0;
    for (const w2 of u.ws) if (w2.d.ammo) am = Math.max(am, w2.ammo / w2.d.ammo);
    const rr = Math.min(u.fuel / u.d.fuel, u.d.hasAmmo ? am : 1);
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.fillRect(q[0] - w / 2, y + h + 1.4, w, 1.8);
    ctx.fillStyle = u.rtb ? '#c0392b' : '#7d7a5f';
    ctx.fillRect(q[0] - w / 2, y + h + 1.4, w * clamp(rr, 0, 1), 1.8);
  }
  /* 军衔：老兵一颗、精锐两颗小星 */
  if (u.rank) {
    ctx.globalAlpha = .95;
    ctx.strokeStyle = '#a8791e'; ctx.lineWidth = 1.3; ctx.lineCap = 'round';
    seed(u.sd + 9);
    for (let i = 0; i < u.rank; i++) {
      const sx = q[0] + w / 2 + 3.5 + i * 5, sy = y + h / 2;
      rline(sx - 2, sy, sx + 2, sy, .7); rline(sx, sy - 2, sx, sy + 2, .7);
    }
  }
  /* 鼓舞中：头顶感叹号 */
  if (u.boost > 0) {
    ctx.globalAlpha = .8;
    ctx.strokeStyle = '#c07a1e'; ctx.lineWidth = 1.6;
    seed(u.sd + 3);
    rline(q[0], y - 12, q[0], y - 6, 1);
    rline(q[0], y - 4.2, q[0], y - 3.4, .6);
  }
  ctx.restore();
}

/* ══════════════════════════ 画弹药 / 特效 / 场景 ══════════════════════════ */
function drawProj(p) {
  if (p.delay > 0) return;
  const q = proj(p.wx, p.wz, p.alt), sc = scaleAt(q[2]);
  ctx.save();
  ctx.strokeStyle = p.col; ctx.lineCap = 'round';
  seed(p.sd);
  if (p.kind === 'bullet' || p.kind === 'flak') {
    /* 曳光只画当前位置前后一小段。原来取 .45 等于把整条弹道一次画出来，
       远程高炮那种射程画出来就是一条贯穿战场的"激光" */
    const t0 = Math.max(0, p.t - .16), t1 = Math.min(1, p.t);
    const a = proj(p.sx + (p.ex - p.sx) * t0, p.sz + (p.ez - p.sz) * t0, p.sa + (p.ea - p.sa) * t0 + Math.sin(t0 * Math.PI) * p.arc);
    const b = proj(p.sx + (p.ex - p.sx) * t1, p.sz + (p.ez - p.sz) * t1, p.sa + (p.ea - p.sa) * t1 + Math.sin(t1 * Math.PI) * p.arc);
    ctx.globalAlpha = .62; ctx.lineWidth = Math.max(.9, 1.6 * sc);
    rline(a[0], a[1], b[0], b[1], 1.1);
  } else if (p.kind === 'rocket') {
    const tr = p.trail;
    if (tr && tr.length >= 6) {
      ctx.globalAlpha = .28; ctx.strokeStyle = '#9c9484'; ctx.lineWidth = Math.max(1, 2.4 * sc);
      ctx.beginPath();
      for (let i = 0; i < tr.length; i += 3) {
        const t = proj(tr[i], tr[i + 1], tr[i + 2]);
        i === 0 ? ctx.moveTo(t[0], t[1]) : ctx.lineTo(t[0], t[1]);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = .95; ctx.fillStyle = p.col;
    const pv = proj(p.sx + (p.ex - p.sx) * Math.max(0, p.pt), p.sz, p.alt);
    ctx.translate(q[0], q[1]); ctx.rotate(Math.atan2(q[1] - pv[1], q[0] - pv[0]));
    const s = Math.max(2.2, 5 * sc);
    ctx.beginPath(); ctx.moveTo(s, 0); ctx.lineTo(-s * .8, s * .45); ctx.lineTo(-s * .8, -s * .45); ctx.closePath(); ctx.fill();
  } else {
    ctx.globalAlpha = .92; ctx.fillStyle = p.col;
    ctx.beginPath();
    ctx.ellipse(q[0], q[1], Math.max(1.8, 3.8 * sc), Math.max(1.4, 2.6 * sc), 0, 0, 6.3);
    ctx.fill();
    if (p.alt > 60) {                              // 高空落弹拖一条虚影，能预判落点
      ctx.globalAlpha = .18; ctx.strokeStyle = p.col; ctx.lineWidth = 1;
      const g = proj(p.wx, p.wz, 0);
      ctx.setLineDash([2, 5]);
      ctx.beginPath(); ctx.moveTo(q[0], q[1]); ctx.lineTo(g[0], g[1]); ctx.stroke();
      ctx.setLineDash([]);
    }
  }
  ctx.restore();
}

function drawFx(f) {
  if (f.t < 0) return;
  const k = f.t / f.dur;
  const q = proj(f.wx, f.wz, f.alt || 0), sc = scaleAt(q[2]);
  ctx.save(); seed(f.sd);
  ctx.globalAlpha = 1 - k; ctx.lineCap = 'round';
  if (f.k === 'debris') {
    ctx.strokeStyle = '#6b6455';
    for (let i = 0; i < f.n; i++) {
      const a = sr() * 6.3, v = 55 + sr() * 130, spin = sr() * 6.3;
      const dx = Math.cos(a) * v * f.t;
      const da = Math.sin(a) * v * f.t * .8 - 230 * f.t * f.t;
      if (f.alt + da < 2) continue;
      const p2 = proj(f.wx + dx, f.wz + Math.sin(a) * v * f.t * .25 / DEPTH, f.alt + da);
      const s2 = scaleAt(p2[2]), len = (3.5 + sr() * 4) * s2;
      ctx.lineWidth = Math.max(.9, 1.5 * s2);
      const ang = spin + f.t * 9;
      rline(p2[0] - Math.cos(ang) * len, p2[1] - Math.sin(ang) * len,
            p2[0] + Math.cos(ang) * len, p2[1] + Math.sin(ang) * len, 1);
    }
  } else if (f.k === 'boom') {
    const r = f.r * sc * .55 * (.4 + k * 1.5);
    ctx.strokeStyle = '#3b3a36'; ctx.lineWidth = Math.max(1.2, 2.2 * sc);
    const pts = [];
    for (let i = 0; i < 14; i++) { const a = i / 14 * 6.2832, rr = r * (i % 2 ? .5 : 1); pts.push([q[0] + Math.cos(a) * rr, q[1] + Math.sin(a) * rr * .78]); }
    rpoly(pts, true, 2.4);
    ctx.lineWidth = Math.max(1, 1.4 * sc);
    for (let i = 0; i < 6; i++) {
      const a = sr() * 6.3, l = r * (1.1 + sr() * .7);
      rline(q[0] + Math.cos(a) * r * .7, q[1] + Math.sin(a) * r * .55, q[0] + Math.cos(a) * l, q[1] + Math.sin(a) * l * .78, 1.5);
    }
  } else if (f.k === 'chute') {
    /* 落地后瘫在地上的伞布，慢慢淡掉 */
    ctx.globalAlpha = (1 - k) * .45;
    ctx.strokeStyle = '#9c9484'; ctx.lineWidth = Math.max(1, 1.5 * sc);
    for (let i = 0; i < 3; i++)
      rline(q[0] - 11 * sc, q[1] - i * 2.2 * sc, q[0] + 12 * sc, q[1] - i * 2.8 * sc, 2.6);
  } else if (f.k === 'spark') {
    ctx.strokeStyle = '#3b3a36'; ctx.lineWidth = Math.max(1, 1.5 * sc);
    for (let i = 0; i < 5; i++) {
      const a = sr() * 6.3, l = (5 + sr() * 9 + k * 6) * sc;
      rline(q[0], q[1], q[0] + Math.cos(a) * l, q[1] + Math.sin(a) * l, 1);
    }
  } else if (f.k === 'ric') {
    /* 跳弹：一道折返的短线 + 一个小星 */
    ctx.strokeStyle = '#7a7261'; ctx.lineWidth = Math.max(1.1, 1.8 * sc);
    const a = -1 + sr() * .7, l = (9 + k * 22) * sc;
    rline(q[0], q[1], q[0] + Math.cos(a) * l, q[1] + Math.sin(a) * l, 1.4);
    for (let i = 0; i < 3; i++) {
      const b = sr() * 6.3, l2 = 4 * sc;
      rline(q[0] - Math.cos(b) * l2, q[1] - Math.sin(b) * l2, q[0] + Math.cos(b) * l2, q[1] + Math.sin(b) * l2, 1);
    }
  } else if (f.k === 'rally') {
    ctx.strokeStyle = SIDE_COL[f.side]; ctx.lineWidth = Math.max(1.4, 2.4 * sc);
    rcirc(q[0], q[1], (40 + k * 260) * sc * .5, 3);
    ctx.lineWidth = Math.max(1, 1.6 * sc);
    for (let i = 0; i < 7; i++) {
      const a = sr() * 6.3, rr = (30 + k * 200) * sc * .5;
      rline(q[0] + Math.cos(a) * rr, q[1] + Math.sin(a) * rr * .5,
            q[0] + Math.cos(a) * rr, q[1] + Math.sin(a) * rr * .5 - 9 * sc, 1.2);
    }
  } else if (f.k === 'flyby') {
    /* 空袭：两架剪影从一侧掠过 */
    ctx.globalAlpha = .55 * (1 - k * .5);
    for (let i = 0; i < 2; i++) {
      const prog = clamp(k * 1.5 - i * .12, 0, 1);
      const wx = f.wx + (prog - .5) * 900 * (f.side === 0 ? 1 : -1);
      const p2 = proj(wx, f.wz + i * .05, f.alt), s2 = scaleAt(p2[2]);
      ctx.save();
      ctx.translate(p2[0], p2[1]); ctx.scale((f.side === 0 ? 1 : -1) * s2, s2);
      ctx.strokeStyle = SIDE_COL[f.side]; ctx.lineWidth = 1.6 / s2;
      DRAW.bmb({ flash: 0 }, f.side === 1);
      ctx.restore();
    }
  } else {
    ctx.strokeStyle = '#9c9484'; ctx.lineWidth = 1.2;
    rcirc(q[0], q[1], (3 + k * 8) * sc, 2);
  }
  ctx.restore();
}

function drawSmoke(s) {
  const q = proj(s.wx, s.wz, 0), sc = scaleAt(q[2]);
  const fade = s.t > s.life - 3 ? (s.life - s.t) / 3 : Math.min(1, s.t * 2.5);
  ctx.save(); seed(s.sd);
  ctx.strokeStyle = '#a09884'; ctx.lineWidth = 1.6;
  for (let i = 0; i < 7; i++) {
    ctx.globalAlpha = .3 * fade * (1 - i * .07);
    const a = sr() * 6.3, rr = sr() * s.r * .5 * sc;
    rcirc(q[0] + Math.cos(a) * rr, q[1] + Math.sin(a) * rr * .4 - i * 3 * sc,
          (s.r * .32 + sr() * s.r * .2) * sc, 2.8);
  }
  ctx.restore();
}
function drawWork(w) {
  ctx.save(); seed(w.sd); ctx.lineCap = 'round';
  if (w.kind === 'trench') {
    /* 壕沟：沿纵深挖的 Z 字折线，两侧堆着挖出来的土 */
    ctx.globalAlpha = .5; ctx.strokeStyle = '#7d7565'; ctx.lineWidth = 1.7;
    const n = 6, pts = [];
    for (let i = 0; i <= n; i++) {
      const wz = clamp(w.wz + (i / n - .5) * w.half * 2 / DEPTH, .02, .98);
      const q = proj(w.wx + (i % 2 ? 9 * K : -9 * K), wz, 0);
      pts.push([q[0], q[1]]);
    }
    rpoly(pts, false, 2.2);
    ctx.globalAlpha = .3; ctx.lineWidth = 1.2;
    for (const p of pts) rline(p[0] - 6, p[1] + 2.5, p[0] + 6, p[1] + 2.5, 1.8);
  } else {
    /* 碉堡：混凝土墩子 + 一条射击孔，驻了几个人就在顶上点几个圈 */
    const q = proj(w.wx, w.wz, 0), sc = scaleAt(q[2]);
    const bw = 13 * sc, bh = 9 * sc;
    ctx.globalAlpha = .62; ctx.strokeStyle = '#6e6858'; ctx.lineWidth = 1.9;
    rpoly([[q[0] - bw, q[1]], [q[0] - bw * .78, q[1] - bh],
           [q[0] + bw * .78, q[1] - bh], [q[0] + bw, q[1]]], true, 2);
    ctx.lineWidth = 1.5;
    rline(q[0] - bw, q[1] - bh, q[0] + bw, q[1] - bh, 1.8);          // 顶盖
    ctx.lineWidth = 2.6; ctx.globalAlpha = .72;
    rline(q[0] - bw * .5, q[1] - bh * .5, q[0] + bw * .5, q[1] - bh * .5, 1.3);   // 射击孔
    if (w.users.length) {
      ctx.globalAlpha = .55; ctx.lineWidth = 1.2;
      for (let i = 0; i < w.users.length; i++)
        rcirc(q[0] + (i - (w.users.length - 1) / 2) * 7 * sc, q[1] - bh - 4 * sc, 1.9 * sc, 1);
    }
  }
  ctx.restore();
}
function drawWreck(w) {
  const fade = w.life * .42;
  const a = w.t < fade ? 1 : Math.max(0, 1 - (w.t - fade) / (w.life - fade));
  drawUnit({ wx: w.wx, wz: w.wz, alt: w.alt, d: w.d, side: w.side, sd: w.sd, ph: 0,
             flash: 0, face: w.face, prone: 0, aimEl: .1, hp: 1, max: 1 }, a * .75, 1);
  const q = proj(w.wx, w.wz, w.alt), sc = scaleAt(q[2]);
  ctx.save();
  ctx.globalAlpha = a * .7;
  ctx.strokeStyle = '#6b6455'; ctx.lineWidth = Math.max(1.4, 2.4 * sc); ctx.lineCap = 'round';
  seed(w.sd + 3);
  const s = (w.d.layer === 'a' ? 15 : 12) * sc, yy = q[1] - (w.d.layer === 'g' ? 9 * sc : 0);
  rline(q[0] - s, yy - s, q[0] + s, yy + s, 2.2);
  rline(q[0] + s, yy - s, q[0] - s, yy + s, 2.2);
  ctx.restore();
}

/* ══════════════════════════ 单位详情 ══════════════════════════ */
const TIPFONT = '12px "HanziPen SC","Hanzipen SC","Chalkboard SE","PingFang SC",cursive';
/* 光标底下压着哪个单位 */
function unitAt(sx, sy) {
  let best = null, bd = 1e9;
  for (const u of units) {
    const q = proj(u.wx, u.wz, u.alt || 0), sc = scaleAt(q[2]);
    const d = Math.hypot(sx - q[0], sy - (q[1] - u.d.h * sc * .45));
    if (d < 24 * sc && d < bd) { bd = d; best = u; }
  }
  return best;
}
function drawTip(u) {
  const q = proj(u.wx, u.wz, u.alt || 0), sc = scaleAt(q[2]);
  const nn = u.side;
  const model = u.d.m ? L(u.d.m[nn]) : L(u.d.name);
  const rows = [L(SIDE_NAME[u.side]) + ' ' + model + (u.rank ? ' · ' + L(RANK_NAME[u.rank]) : '')];
  rows.push(L(u.d.name) + '　' + T('hp') + ' ' + Math.max(0, Math.ceil(u.hp)) + '/' + u.max +
            (u.kills ? '　' + T('kills') + ' ' + u.kills : ''));
  for (const w of u.ws)
    rows.push('· ' + (w.d.m ? L(w.d.m[nn]) : L(w.d.name)) + ' ' + w.d.rof.toFixed(1) + 's' + (w.d.burst ? '×' + w.d.burst : '') +
           (w.ammo !== Infinity ? '　' + T('ammo') + ' ' + w.ammo : '') + (w.cd > 0 ? '　' + T('reloading') : ''));
  if (u.d.support) rows.push('· ' + (u.d.support === 'medic' ? T('heals') : T('resup')) +
                          (u.link ? T('supporting') : ''));
  const st = [];
  if (u.sup > .05) st.push(T('suppressed') + ' ' + Math.round(u.sup * 100) + '%');
  if (u.prone > .5) st.push(T('prone'));
  if (u.bunker) st.push(T('inBunker')); else if (u.cover) st.push(T('inTrench'));
  if (u.mode === 1) st.push(T('withdraw'));
  if (u.rtb) st.push(T('rtb'));
  if (u.d.fuel) st.push(T('fuel') + ' ' + Math.round(clamp(u.fuel / u.d.fuel, 0, 1) * 100) + '%');
  if (u.dmgTrack) st.push(T('trackDmg'));
  if (u.d.armor && u.hp / u.max < .25) st.push(T('turretJam'));
  if (u.boost > 0) st.push(T('rallied'));
  if (st.length) rows.push(st.join('　'));

  ctx.save();
  ctx.font = TIPFONT;
  let wm = 0;
  for (const l of rows) wm = Math.max(wm, ctx.measureText(l).width);
  const pad = 7, lh = 15, bw = wm + pad * 2, bh = rows.length * lh + pad * 1.4;
  let bx = q[0] + 24 * sc, by = q[1] - u.d.h * sc - bh - 6;
  if (bx + bw > W - 6) bx = q[0] - 24 * sc - bw;
  bx = clamp(bx, 4, Math.max(4, W - bw - 4));
  by = clamp(by, 4, Math.max(4, H - bh - 4));
  ctx.fillStyle = 'rgba(246,242,228,.95)';
  ctx.fillRect(bx, by, bw, bh);
  seed(u.sd + 77);                                  // 定住种子，框才不会抖
  ctx.globalAlpha = .45; ctx.strokeStyle = SIDE_COL[u.side]; ctx.lineWidth = 1.2; ctx.lineCap = 'round';
  rline(bx + (q[0] > bx + bw / 2 ? bw : 0), by + bh, q[0], q[1] - u.d.h * sc * .45, 1.4);
  ctx.globalAlpha = 1; ctx.lineWidth = 1.6;
  rpoly([[bx, by], [bx + bw, by], [bx + bw, by + bh], [bx, by + bh]], true, 1.5);
  ctx.textBaseline = 'top';
  rows.forEach((l, i) => {
    ctx.fillStyle = i === 0 ? SIDE_COL[u.side] : (i === rows.length - 1 && st.length ? '#8a5a2a' : '#3b3a36');
    ctx.fillText(l, bx + pad, by + pad * .7 + i * lh);
  });
  ctx.restore();
}

/* ══════════════════════════ 渲染 ══════════════════════════ */
const zbuf = [];
function render() {
  mainCtx.save();
  mainCtx.setTransform(DPR * view.k, 0, 0, DPR * view.k, DPR * view.x, DPR * view.y);
  drawPaper();
  for (const w of works) drawWork(w);
  zbuf.length = 0;
  for (const w of wrecks) zbuf.push([w.wz, 0, w]);
  for (const u of units) zbuf.push([u.wz, 1, u]);
  for (const p of projs) if (p.delay <= 0) zbuf.push([p.wz, 2, p]);
  for (const f of fx) zbuf.push([f.wz, 3, f]);
  for (const s of smokes) zbuf.push([s.wz, 4, s]);
  zbuf.sort((a, b) => b[0] - a[0]);
  for (const e of zbuf) {
    const k = e[1];
    if (k === 0) drawWreck(e[2]);
    else if (k === 1) drawUnit(e[2], 1, 0);
    else if (k === 2) drawProj(e[2]);
    else if (k === 3) drawFx(e[2]);
    else drawSmoke(e[2]);
  }
  /* 笔尖预览 / 指令准星 */
  if (hover.on) {
    const g = unproj(hover.x, hover.y);
    const hu = armed ? null : unitAt(hover.x, hover.y);
    if (hu) drawTip(hu);                        // 光标压在单位上 → 看详情
    else if (armed) {
      const q = proj(g[0], g[1], 0), sc = scaleAt(q[2]);
      ctx.save(); seed((tick * 6) | 0);
      ctx.globalAlpha = .55; ctx.strokeStyle = SIDE_COL[curSide]; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
      const R = (armed === 'rally' ? 300 : armed === 'strike' ? 240 : 110) * K * sc * .5;
      rcirc(q[0], q[1], R, 3);
      rline(q[0] - R * .3, q[1], q[0] + R * .3, q[1], 2);
      rline(q[0], q[1] - R * .18, q[0], q[1] + R * .18, 2);
      ctx.restore();
    } else {
      const d = UNITS[curTool];
      drawUnit({ wx: g[0], wz: g[1], alt: d.layer === 'a' ? d.alt : 0, d, side: curSide,
                 sd: 4242, ph: 0, flash: 0, face: curSide === 0 ? 1 : -1,
                 prone: 0, aimEl: .12, hp: 1, max: 1 }, .34, 1);
    }
  }
  mainCtx.restore();
}

/* ══════════════════════════ 主循环 ══════════════════════════ */
const $ = id => document.getElementById(id);
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, .05) * SLOW;
  last = now;
  if (running) {
    /* 拆成整数个子步，快进时才不会因为单步过大而抖 */
    const n = Math.max(1, Math.ceil(speed));
    for (let i = 0; i < n; i++) update(dt * speed / n);
  }
  render();
  let nb = 0, nr = 0;
  for (const u of units) u.side === 0 ? nb++ : nr++;
  $('nb').textContent = nb + (autoRe ? '·' + reserve[0] : '');
  $('nr').textContent = nr + (autoRe ? '·' + reserve[1] : '');
  $('lb').textContent = lost[0]; $('lr').textContent = lost[1];
  const pw = [power(0), power(1)], tot = pw[0] + pw[1] || 1;
  $('pb').style.width = (pw[0] / tot * 100) + '%';
  $('pr').style.width = (pw[1] / tot * 100) + '%';
  /* 战局潮汐：谁在攻势 */
  const tide = Math.sin(tick * .055), el = $('tide');
  if (autoRe && Math.abs(tide) > .3) {
    el.textContent = tide > 0 ? 'US 攻势 ▶' : '◀ CCCP 攻势';
    el.style.color = tide > 0 ? SIDE_COL[0] : SIDE_COL[1];
  } else el.textContent = '';
  for (const c of CMDS) {                          // 冷却遮罩
    const b = cmdBtn[c.id], k = c.cd ? cmdCd[c.id] / c.cd : 0;
    b.querySelector('.cool').style.height = (k * 100) + '%';
    b.classList.toggle('cooling', cmdCd[c.id] > 0);
    b.classList.toggle('ready', cmdCd[c.id] <= 0);
    b.classList.toggle('armed', armed === c.id);
    if (c.id === 'spect') {
      refreshAct();
      /* 带上 ⚑ ——日志里奇观也是这个记号，一眼看出这按钮不是常规指令 */
      const nm = actQ ? '⚑ ' + L(actQ[0].name) : T('spectNone');
      if (b.dataset.nm !== nm) {
        b.dataset.nm = nm; b.firstChild.textContent = nm;
        b.title = L(c.name) + ' · ' + nm + '\n' + L(c.tip);
      }
      b.classList.toggle('nospect', !actQ);
    }
  }
  requestAnimationFrame(loop);
}

/* ══════════════════════════ 交互 ══════════════════════════ */
const hover = { on: 0, x: 0, y: 0 };
let drawing = 0, lastPut = 0, lastX = -1e9, lastY = -1e9;
const pos = e => [(e.offsetX - view.x) / view.k, (e.offsetY - view.y) / view.k];
function put(x, y) {
  const now = performance.now();
  if (now - lastPut < 80 || Math.hypot(x - lastX, y - lastY) < 14) return;
  lastPut = now; lastX = x; lastY = y;
  const g = unproj(x, y);
  spawn(curSide, curTool, g[0], g[1]);
  hideBanner();
}
cv.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch') {
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 2) { drawing = 0; pinchStart(); return; }
    if (ptrs.size > 2) return;
  }
  if (e.button === 1) {                              // 中键：拖动画面
    e.preventDefault();
    pan = { sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y };
    cv.setPointerCapture(e.pointerId);
    document.body.classList.add('panning');
    return;
  }
  const q = pos(e);
  if (armed) {                                     // 指令落点
    const g = unproj(q[0], q[1]);
    execCmd(armed, g[0], g[1]);
    armed = null; document.body.classList.remove('aiming');
    return;
  }
  cv.setPointerCapture(e.pointerId); drawing = 1; lastX = lastY = -1e9;
  put(q[0], q[1]);
});
cv.addEventListener('pointermove', e => {
  if (ptrs.has(e.pointerId)) {
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size >= 2) { pinchMove(); return; }
  }
  if (pan) { view.x = pan.vx + (e.clientX - pan.sx); view.y = pan.vy + (e.clientY - pan.sy); clampView(); return; }
  const q = pos(e);
  hover.on = 1; hover.x = q[0]; hover.y = q[1];
  if (drawing) put(q[0], q[1]);
});
cv.addEventListener('pointerup', e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; pan = null; document.body.classList.remove('panning'); drawing = 0; });
/* 滚轮缩放。passive:false 才能拦下页面滚动 */
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * .0016));
}, { passive: false });
/* 中键拖动。Chrome 的中键默认是自动滚动，得在 mousedown 上拦 */
cv.addEventListener('mousedown', e => { if (e.button === 1) e.preventDefault(); });
cv.addEventListener('auxclick', e => { if (e.button === 1) e.preventDefault(); });
if ($('zfit')) $('zfit').onclick = resetView;

cv.addEventListener('pointercancel', e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; pan = null; document.body.classList.remove('panning'); drawing = 0; });
cv.addEventListener('pointerleave', e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; drawing = 0; hover.on = 0; });

/* 兵种按钮 */
function buildTools() {
  ['rowG', 'rowA', 'rowS'].forEach(id => $(id).querySelectorAll('button').forEach(b => b.remove()));
  const mk = (list, row) => list.forEach(k => {
    const d = UNITS[k], b = document.createElement('button');
    b.innerHTML = L(d.name) + '<small>' + d.k.toUpperCase() + ' ' + L(d.sub) + '</small>';
    b.dataset.k = k;
    if (k === curTool) b.className = 'on';
    b.title = (d.m ? L(d.m[curSide]) + ' (' + L(d.name) + ')' : L(d.name)) + '　' + T('hp') + ' ' + d.hp + '　' + T('speed') + ' ' + Math.round(d.spd / K) +
      (d.support ? '\n· 支援：' + (d.support === 'medic' ? '治疗友军' : '解除压制、加快装填') : '') + '\n' +
      d.ws.map(w => '· ' + (w.m ? L(w.m[curSide]) : L(w.name)) + ': ' + T('dmg') + ' ' + w.dmg + (w.burst ? '×' + w.burst : '') +
        '　射程 ' + Math.round(w.rng / K) + '　装填 ' + w.rof + 's' +
        '　对' + (w.hits === 'g' ? '地' : w.hits === 'a' ? '空' : '地空') +
        (w.splash ? '　溅射 ' + Math.round(w.splash / K) : '') +
        (w.ammo ? '　弹 ' + w.ammo : '')).join('\n');
    b.onclick = () => selTool(k);
    row.appendChild(b);
  });
  mk(GROUND, $('rowG')); mk(AIR, $('rowA')); mk(SPECT, $('rowS'));
}
function selTool(k) {
  curTool = k;
  armed = null; document.body.classList.remove('aiming');
  document.querySelectorAll('#tools button').forEach(b => b.className = b.dataset.k === k ? 'on' : '');
}
buildTools();

/* 指令按钮 */
const cmdBtn = {};
function buildCmds() {
  $('rowC').querySelectorAll('button').forEach(b => b.remove());
  CMDS.forEach(c => {
  const b = document.createElement('button');
  b.className = 'cmd ready';
  b.innerHTML = L(c.name) + '<div class="cool"></div>';
  b.title = L(c.name) + ' (' + T('cooldown') + ' ' + c.cd + 's)\n' + L(c.tip) + (c.aim ? '\n' + T('aimHint') : '');
  b.onclick = () => {
    if (cmdCd[c.id] > 0) return;
    if (!c.aim) { execCmd(c.id, 0, 0); return; }
    armed = armed === c.id ? null : c.id;
    document.body.classList.toggle('aiming', !!armed);
  };
    cmdBtn[c.id] = b;
    $('rowC').appendChild(b);
  });
}
buildCmds();

/* 语言切换：把所有静态文本重贴一遍 */
function applyLang() {
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  $('hint').textContent = T('hint');
  $('play').textContent = running ? T('pause') : T('fight');
  $('auto').textContent = T('auto');
  $('snd').textContent = T('sound');
  $('grid').textContent = T('grid');
  $('lsb').textContent = document.body.classList.contains('ls') ? T('portrait') : T('rotate');
  $('clr').textContent = T('restart');
  $('lossLbl').textContent = T('losses');
  $('langBtn').textContent = lang === 'zh' ? 'EN' : '中';
  $('rowG').firstElementChild.textContent = T('ground');
  $('rowA').firstElementChild.textContent = T('air');
  $('rowS').firstElementChild.textContent = T('spect');
  $('rowC').firstElementChild.textContent = T('orders');
  document.querySelectorAll('.side').forEach(x => x.textContent = L(SIDE_NAME[+x.dataset.side]));
  buildTools(); buildCmds();
}
$('langBtn').onclick = () => {
  lang = lang === 'zh' ? 'en' : 'zh';
  try { localStorage.setItem('mg_lang', lang); } catch (e) { }
  applyLang();
};

document.querySelectorAll('.side').forEach(b => {
  b.onclick = () => {
    curSide = +b.dataset.side;
    document.querySelectorAll('.side').forEach(x => {
      x.classList.toggle('on', +x.dataset.side === curSide);
      x.textContent = L(SIDE_NAME[+x.dataset.side]);
    });
  };
});
function togglePlay() {
  running = !running;
  if (running) { over = false; hideBanner(); }
  $('play').textContent = running ? T('pause') : T('fight');
  $('play').classList.toggle('on', running);
}
$('play').onclick = togglePlay;
const SPEEDS = [.5, 1, 2, 4];
$('spd').onclick = () => {
  speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length];
  $('spd').textContent = speed + '×';
  $('spd').classList.toggle('on', speed !== 1);
};
$('auto').onclick = () => { autoRe = !autoRe; $('auto').classList.toggle('on', autoRe); };
$('snd').onclick = () => { sound = !sound; $('snd').classList.toggle('on', sound); if (sound) beep('shot'); };
$('grid').onclick = () => { showGrid = !showGrid; $('grid').classList.toggle('on', showGrid); paper = null; };
$('lsb').onclick = () => {
  const on = !document.body.classList.contains('ls');
  document.body.classList.toggle('ls', on);
  $('lsb').classList.toggle('on', on);
  $('lsb').textContent = on ? T('portrait') : T('rotate');
  try { localStorage.setItem('mg_ls', on ? '1' : '0'); } catch (e) { }
  applyRot();
};
$('clr').onclick = () => {
  units = []; projs = []; fx = []; wrecks = []; smokes = [];
  lost = [0, 0]; over = false; tick = 0; logs = []; $('log').innerHTML = '';
  reserve = [reserve0, reserve0];
  scars = null;
  for (const c of CMDS) cmdCd[c.id] = 0;
  hideBanner(); initArmies();
  running = true; $('play').textContent = T('pause'); $('play').classList.add('on');
};
addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); togglePlay(); return; }
  if (e.key === 'Escape') { armed = null; document.body.classList.remove('aiming'); return; }
  if (e.key === 'Tab') { e.preventDefault(); document.querySelector('.side[data-side="' + (1 - curSide) + '"]').click(); return; }
  const k = e.key.toLowerCase();
  for (const key of ALL) if (UNITS[key].k === k) { selTool(key); return; }
});

function showBanner(txt, col) {
  $('bantext').textContent = txt; $('bantext').style.color = col;
  $('banner').style.display = 'flex';
  $('play').textContent = T('fight'); $('play').classList.remove('on');
}
const hideBanner = () => $('banner').style.display = 'none';

try {
  if (localStorage.getItem('mg_ls') === '1') {
    document.body.classList.add('ls');
    $('lsb').classList.add('on'); $('lsb').textContent = T('portrait');
  }
} catch (e) { }
applyRot();
applyLang();
initArmies();
/* ?warmup=45 预跑 45 游戏秒再开始渲染 —— 截图和演示用，
   免得看到的总是双方还没接触的开局 */
const warmup = Math.min(+(new URLSearchParams(location.search).get('warmup') || 0), 180);
if (warmup > 0) for (let i = 0, n = warmup / .016; i < n; i++) update(.016);

calibrate();
requestAnimationFrame(loop);
setTimeout(() => { const h = $('hint'); h.style.transition = 'opacity 1s'; h.style.opacity = 0; }, 9000);
</script>
</body>
</html>
